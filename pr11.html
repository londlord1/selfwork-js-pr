ocus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР11<\/span>\n<h1>ПР11 • Зад.1 • Адаптивный дизайн через resize<\/h1>\n<div class=\"desc\">Добавьте отображение брейкпоинтов (mobile, tablet, desktop) на основе ширины окна и автоматически меняйте цветовую схему при изменении размера.<\/div>\n\n<div class=\"card\" id=\"bpbox\" style=\"text-align:center;padding:40px 20px;min-height:160px\">\n  <h2 id=\"bp\">—<\/h2>\n  <p id=\"bpw\" style=\"color:#888\">изменяйте размер окна<\/p>\n<\/div>\n<div class=\"out\" id=\"out\">Меняйте ширину окна — брейкпоинт и цветовая схема обновляются автоматически.<\/div>\n<script>\nconst schema={mobile:['#e74c3c','#ffe9e9','Мобильный (mobile)'],tablet:['#f39c12','#fff3cd','Планшет (tablet)'],desktop:['#27ae60','#e9fbef','Компьютер (desktop)']};\nfunction applyBp(){\n const w=window.innerWidth;\n const bp=w<600?'mobile':(w<1024?'tablet':'desktop');\n const [col,bg,label]=schema[bp];\n const box=document.getElementById('bpbox');\n box.style.background=bg;box.style.border='3px solid '+col;\n document.getElementById('bp').textContent=label+' · '+w+'px';\n document.getElementById('bp').style.color=col;\n document.getElementById('bpw').textContent='Ширина окна: '+w+'px · цветовая схема переключена';\n document.getElementById('out').innerHTML='<span class=\"hl\">resize<\/span> → брейкпоинт: <span class=\"ok\">'+bp+'<\/span> ('+w+'px)';\n}\nwindow.addEventListener('resize',applyBp);applyBp();\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Умный скролл — кнопка «Наверх»", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР11 • Зад.2 • Умный скролл — кнопка «Наверх»<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom: >\n<div id=\"upBtn\" style=\"display:none;position:sticky;bottom:10px;align-self:flex-end;background:#1a73e8;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;margin-top:-52px;margin-left:auto\">⬆<\/div>\n<div class=\"out\" id=\"out\">Прокрутите блок вниз более 300px — появится кнопка «Наверх».<\/div>\n<script>\nconst area=document.getElementById('scArea'),btn=document.getElementById('upBtn');\narea.addEventListener('scroll',()=>{btn.style.display=(area.scrollTop>300)?'block':'none';document.getElementById('out').innerHTML='<span class=\"hl\">scroll<\/span> → прокручено '+Math.round(area.scrollTop)+'px'+(area.scrollTop>300?' · показана кнопка «Наверх»':'');});\nbtn.onclick=()=>{area.scrollTo({top:0,behavior:'smooth'});document.getElementById('out').innerHTML='<span class=\"ok\">Плавная прокрутка вверх ✓<\/span>';};\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Офлайн-режим и восстановление сети", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР11 • Зад.3 • Офлайн-режим и восстановление сети<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#f ss=\"pr-tag\">ПР11<\/span>\n<h1>ПР11 • Зад.3 • Офлайн-режим и восстановление сети<\/h1>\n<div class=\"desc\">Добавьте индикатор и уведомление при потере соединения; сохраняйте последние действия в localStorage для синхронизации при восстановлении сети.<\/div>\n\n<div class=\"card\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;background:#f8f9fa\" id=\"netbox\">\n <span id=\"netdot\" style=\"width:16px;height:16px;border-radius:50%;background:#28a745;display:inline-block\"><\/span>\n <b id=\"nettext\">Вы онлайн<\/b>\n<\/div>\n<button class=\"btn\" onclick=\"addAct()\">➕ Записать действие<\/button>\n<button class=\"btn red\" onclick=\"clearActs()\">Очистить лог<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Действия сохраняются в localStorage и восстановятся при возврате в онлайн.<\/div>\n<script>\nconst KEY='pr11_acts';\nlet acts=JSON.parse(localStorage.getItem(KEY)||'[]');\nfunction persist(){localStorage.setItem(KEY,JSON.stringify(acts.slice(-10)));}\nfunction upd(online){\n document.getElementById('netdot').style.background=online?'#28a745':'#dc3545';\n document.getElementById('nettext').innerText=online?'Вы онлайн':'⚠ ОФЛАЙН';\n document.getElementById('out').innerHTML=(online?`<span class=\"ok\">✅ Соединение восстановлено<\/span> — синхронизирую сохранённые действия (${acts.length}):\n${acts.map(a=>'• '+a.time+' '+a.msg).join('\\n')}`\n  :'<span class=\"err\">🔴 Потеря соединения<\/span> — действия сохраняются в localStorage ('+acts.length+')');\n}\nwindow.addEventListener('online',()=>upd(true));window.addEventListener('offline',()=>upd(false));\nfunction addAct(){const t=new Date().toLocaleTimeString();acts.push({time:t,msg:'действие '+acts.length});persist();document.getElementById('out').innerHTML='<span class=\"ok\">Сохранено в localStorage:<\/span> '+t+' → ('+acts.length+')';}\nfunction clearActs(){acts=[];persist();document.getElementById('out').innerHTML='Лог действий очищен';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Отслеживание активности пользователя", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР11 • Зад.4 • Отслеживание активности пользователя<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР11<\/span>\n<h1>ПР11 • Зад.4 • Отслеживание активности пользователя<\/h1>\n<div class=\"desc\">Реализуйте таймер неактивности (30 секунд без движения мыши — уведомление) и считайте клики, движения мыши и нажатия клавиш за сессию.<\/div>\n\n<div class=\"card\">\n<div class=\"stats\" style=\"display:flex;gap:12px;flex-wrap:wrap\">\n <div style=\"flex:1;background:#eef6ff;border-radius:10px;padding:12px;text-align:center\"><div style=\"font-size:26px;font-weight:bold;color:#1a73e8\" id=\"clicks\">0<\/div>кликов<\/div>\n <div style=\"flex:1;background:#e9fbef;border-radius:10px;padding:12px;text-align:center\"><div style=\"font-size:26px;font-weight:bold;color:#27ae60\" id=\"moves\">0<\/div>движений<\/div>\n <div style=\"flex:1;background:#fff3cd;border-radius:10px;padding:12px;text-align:center\"><div style=\"font-size:26px;font-weight:bold;color:#f39c12\" id=\"keys\">0<\/div>клавиш<\/div>\n<\/div>\n<div class=\"out\" id=\"out\">Двигайте мышь, кликайте, нажимайте клавиши. Пауза 30 сек = уведомление.<\/div>\n<\/div>\n<script>\nlet c=0,m=0,k=0,last=new Date().getTime();\ndocument.addEventListener('click',()=>{c++;document.getElementById('clicks').textContent=c;ping();});\ndocument.addEventListener('mousemove',()=>{m++;document.getElementById('moves').textContent=m;ping();});\ndocument.addEventListener('keydown',()=>{k++;document.getElementById('keys').textContent=k;ping();});\nfunction ping(){last=new Date().getTime();document.getElementById('out').innerHTML='✅ Активность: кликов '+c+', движений '+m+', клавиш '+k;}\nsetInterval(()=>{const idle=Math.round((new Date().getTime()-last)/1000);if(idle>=30){document.getElementById('out').innerHTML='<span class=\"err\">⏰ Неактивность! <b>'+idle+'<\/b> сек без действий<\/span>';}} ,1000);\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "История навигации — хлебные крошки и кнопки", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР11 • Зад.5 • История навигации — хлебные крошки и кнопки<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР11<\/span>\n<h1>ПР11 • Зад.5 • История навигации — хлебные крошки и кнопки<\/h1>\n<div class=\"desc\">Создайте «хлебные крошки» на основе popstate и реализуйте кнопки «Назад»/«Вперёд» с помощью history API.<\/div>\n\n<style>.crumb{display:inline-block;background:#eef6ff;color:#0b57d0;border-radius:8px;padding:4px 12px;margin:3px;font-size:13px}<\/style>\n<div class=\"card\">\n<div style=\"margin-bottom:10px\"><b>Хлебные крошки:<\/b> <span id=\"crumbs\"><span class=\"crumb\">Главная<\/span><\/span><\/div>\n<button class=\"btn\" onclick=\"pushCrumb()\">➕ Добавить страницу<\/button>\n<button class=\"btn orange\" onclick=\"goBack()\">⬅ Назад<\/button>\n<button class=\"btn green\" onclick=\"goFwd()\">Вперёд ➡<\/button>\n<button class=\"btn red\" onclick=\"resetCrumbs()\">Сброс<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Добавляйте страницы — крошки растут. Кнопки используют history.pushState и popstate.<\/div>\n<script>\nconst names=['Главная','Товары','Каталог','Профиль','Заказы','Настройки'];\nlet idx=0;\nfunction renderCrumbs(){const path=names.slice(0,idx+1);document.getElementById('crumbs').innerHTML=path.map(n=>'<span class=\"crumb\">'+n+'<\/span>').join('');}\npushCrumb();\nfunction pushCrumb(){if(idx<names.length-1){idx++;window.history.pushState({i:idx},'',names[idx]);renderCrumbs();document.getElementById('out').innerHTML='<span class=\"hl\">pushState<\/span> → добавлена страница: <span class=\"ok\">'+names[idx]+'<\/span>';}}\nwindow.addEventListener('popstate',(e)=>{if(e.state){idx=e.state.i;renderCrumbs();document.getElementById('out').innerHTML='<span class=\"hl\">popstate<\/span> → сейчас на странице: <span class=\"ok\">'+names[idx]+'<\/span>';}});\nfunction goBack(){window.history.back();}\nfunction goFwd(){window.history.forward();}\nfunction resetCrumbs(){idx=0;renderCrumbs();window.history.pushState({i:0},'',names[0]);document.getElementById('out').innerHTML='Крошки сброшены';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Интеграция с Storage — чат между вкладками", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР11 • Зад.6 • Интеграция с Storage — чат между вкладками<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР11<\/span>\n<h1>ПР11 • Зад.6 • Интеграция с Storage — чат между вкладками<\/h1>\n<div class=\"desc\">При изменении storage из другой вкладки обновляйте интерфейс в реальном времени; создайте простой чат между вкладками через localStorage.<\/div>\n\n<div class=\"card\">\n<div id=\"chatbox\" style=\"border:1px solid #e2e8f0;border-radius:12px;padding:12px;min-height:140px;max-height:220px;overflow-y:auto;background:#f8f9fa\"><\/div>\n<div style=\"display:flex;gap:10px;margin-top:10px\">\n<input id=\"chatInput\" placeholder=\"Сообщение в другую вкладку...\" style=\"flex:1\">\n<button class=\"btn\" onclick=\"sendMsg()\">Отправить<\/button>\n<\/div>\n<\/div>\n<div class=\"out\" id=\"out\">Отправьте сообщение — откройте эту же страницу во 2-й вкладке: сообщения синхронизируются через storage-события.<\/div>\n<script>\nconst KEY='pr11_chat';\nfunction draw(){const box=document.getElementById('chatbox');const msgs=JSON.parse(localStorage.getItem(KEY)||'[]');box.innerHTML=msgs.map(m=>'<div style=\"padding:6px 10px;margin:4px 0;background:#eef6ff;border-radius:8px\"><b>'+m.tab+'<\/b> · '+m.time+': '+m.text+'<\/div>').join('')||'<div style=\"color:#aaa;text-align:center\">Пока пусто<\/div>';}\nfunction sendMsg(){const v=document.getElementById('chatInput').value.trim();if(!v)return;const msgs=JSON.parse(localStorage.getItem(KEY)||'[]');msgs.push({tab:Math.random().toString(36).slice(2,7),time:new Date().toLocaleTimeString(),text:v});localStorage.setItem(KEY,JSON.stringify(msgs.slice(-20)));document.getElementById('chatInput').value='';draw();document.getElementById('out').innerHTML='<span class=\"ok\">Сохранено в localStorage<\/span> — событие storage увидят другие вкладки.';}\nwindow.addEventListener('storage',(e)=>{if(e.key===KEY){draw();document.getElementById('out').innerHTML='<span class=\"err\">📨 storage-событие от другой вкладки<\/span> — интерфейс обновлён.';}});\ndraw();\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
</script>
