se().includes(q));}\nfunction doSearch(){const q=document.getElementById('q16').value;const r=searchPosts(q);document.getElementById('res16').innerHTML=r.map(p=>'<div style=\"background:#f8f9fa;border-radius:8px;padding:8px 12px;margin:4px 0\">📰 '+p.title+'<\/div>').join('')||'<div class=\"err\">Ничего не найдено<\/div>';document.getElementById('out').innerHTML=`<span class=\"hl\">Поиск<\/span>: «${q}» — найдено <span class=\"ok\">${r.length}<\/span> пост(ов)`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Рекомендации на основе избранного", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР16 • Зад.3 • Рекомендации на основе избранного<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font- ное: пост 2<\/button>\n<button class=\"btn orange\" onclick=\"rec()\">💡 Рекомендации<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Добавьте посты в избранное, затем покажите рекомендации.<\/div>\n<script>\nconst posts=[\n {id:1,title:'JavaScript ES2025',tags:['javascript','es2025','web']},\n {id:2,title:'React 20',tags:['react','frontend','web']},\n {id:3,title:'TypeScript опыт',tags:['typescript','javascript','опыт']},\n {id:4,title:'Дизайн-системы',tags:['design','ui','components']}\n];\nconst favorites=new Set();\nfunction fav1(){favorites.add(1);document.getElementById('out').innerHTML='В избранном: '+[...favorites].join(', ');}\nfunction fav2(){favorites.add(2);document.getElementById('out').innerHTML='В избранном: '+[...favorites].join(', ');}\nfunction getRecommendations(){if(favorites.size===0)return[];const ft=new Set();favorites.forEach(id=>posts.find(p=>p.id===id).tags.forEach(t=>ft.add(t)));return posts.filter(p=>!favorites.has(p.id)&&p.tags.some(t=>ft.has(t)));}\nfunction rec(){const r=getRecommendations();const favTags=[...favorites].reduce((a,id)=>{posts.find(p=>p.id===id).tags.forEach(t=>a.push(t));return a;},[]);document.getElementById('out').innerHTML=`<span class=\"hl\">Рекомендации (по тегам избранного)<\/span>\n\nТеги избранного: ${[...new Set(favTags)].join(', ')}\n\nРекомендации (${r.length}):\n${r.map(p=>'• '+p.title).join('\\n')}`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Экспорт данных в JSON", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР16 e-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР16<\/span>\n<h1>ПР16 • Зад.4 • Экспорт данных в JSON<\/h1>\n<div class=\"desc\">Реализуйте экспорт текущего состояния (избранные посты, счётчики) в JSON с форматированием (JSON.stringify, null, 2).<\/div>\n\n<div class=\"card\">\n<button class=\"btn\" onclick=\"doExport()\">📤 Экспортировать состояние в JSON<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите «Экспортировать» — состояния выводится как JSON-строка.<\/div>\n<script>\nconst posts=[{id:1,title:'Post A'},{id:2,title:'Post B'},{id:3,title:'Post C'}];\nconst favorites=new Set([1,3]);\nfunction doExport(){const state={favorites:[...favorites],totalPosts:posts.length,exportDate:new Date().toISOString()};const json=JSON.stringify(state,null,2);document.getElementById('out').innerHTML=`<span class=\"hl\">Экспортированное состояние (JSON.stringify, null, 2)<\/span>\n\n${json}`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
