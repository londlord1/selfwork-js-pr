Название<\/label><input id=\"edit-title\">\n    <label>Автор<\/label><input id=\"edit-author\">\n    <div class=\"row\" style=\"margin-top:14px\">\n      <button class=\"btn green\" onclick=\"saveEdit()\">Сохранить<\/button>\n      <button class=\"btn gray\" onclick=\"closeModal()\">Отмена<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">class Book {\n  constructor(id, title, author, year, rating) {\n    this.id = id; this.title = title; this.author = author; this.year = year; this.rating = rating;\n  }\n}\n\nconst books = [\n  new Book(1, &#x27;Война и мир&#x27;, &#x27;Л. Н. Толстой&#x27;, 1869, 4.9),\n  new Book(2, &#x27;Мастер и Маргарита&#x27;, &#x27;М. А. Булгаков&#x27;, 1967, 4.8),\n  new Book(3, &#x27;Дюна&#x27;, &#x27;Ф. Герберт&#x27;, 1965, 4.6)\n];\n\nlet editingId = null;\n\nfunction render() {\n  $(&#x27;books&#x27;).innerHTML = books.map(b =&gt; `\n    &lt;div class=&quot;book&quot;&gt;\n      &lt;b&gt;${esc(b.title)}&lt;/b&gt;\n      &lt;div class=&quot;meta&quot;&gt;${esc(b.author)} · ${b.year} · ★ ${b.rating}&lt;/div&gt;\n      &lt;button class=&quot;btn&quot; style=&quot;margin-top:8px&quot; onclick=&quot;openModal(${b.id})&quot;&gt;✏️ Редактировать&lt;/button&gt;\n    &lt;/div&gt;`).join(&#x27;&#x27;);\n}\n\nfunction openModal(id) {\n  editingId = id;\n  const b = books.find(x =&gt; x.id === id);\n  $(&#x27;edit-title&#x27;).value = b.title;\n  $(&#x27;edit-author&#x27;).value = b.author;\n  $(&#x27;modal&#x27;).classList.add(&#x27;open&#x27;);\n}\n\nfunction closeModal() {\n  $(&#x27;modal&#x27;).classList.remove(&#x27;open&#x27;);\n  editingId = null;\n}\n\nfunction saveEdit() {\n  const b = books.find(x =&gt; x.id === editingId);\n  if (!b) return;\n  const title = $(&#x27;edit-title&#x27;).value.trim();\n  const author = $(&#x27;edit-author&#x27;).value.trim();\n  if (!title) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Название не может быть пустым&lt;/span&gt;&#x27;); return; }\n  b.title = title;\n  b.author = author;\n  render();\n  closeModal();\n  out(`&lt;span class=&quot;ok&quot;&gt;Книга обновлена:&lt;/span&gt; ${esc(title)} — ${esc(author)}`);\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass Book {\n  constructor(id, title, author, year, rating) {\n    this.id = id; this.title = title; this.author = author; this.year = year; this.rating = rating;\n  }\n}\n\nconst books = [\n  new Book(1, 'Война и мир', 'Л. Н. Толстой', 1869, 4.9),\n  new Book(2, 'Мастер и Маргарита', 'М. А. Булгаков', 1967, 4.8),\n  new Book(3, 'Дюна', 'Ф. Герберт', 1965, 4.6)\n];\n\nlet editingId = null;\n\nfunction render() {\n  $('books').innerHTML = books.map(b => `\n    <div class=\"book\">\n      <b>${esc(b.title)}<\/b>\n      <div class=\"meta\">${esc(b.author)} · ${b.year} · ★ ${b.rating}<\/div>\n      <button class=\"btn\" style=\"margin-top:8px\" onclick=\"openModal(${b.id})\">✏️ Редактировать<\/button>\n    <\/div>`).join('');\n}\n\nfunction openModal(id) {\n  editingId = id;\n  const b = books.find(x => x.id === id);\n  $('edit-title').value = b.title;\n  $('edit-author').value = b.author;\n  $('modal').classList.add('open');\n}\n\nfunction closeModal() {\n  $('modal').classList.remove('open');\n  editingId = null;\n}\n\nfunction saveEdit() {\n  const b = books.find(x => x.id === editingId);\n  if (!b) return;\n  const title = $('edit-title').value.trim();\n  const author = $('edit-author').value.trim();\n  if (!title) { out('<span class=\"err\">Название не может быть пустым<\/span>'); return; }\n  b.title = title;\n  b.author = author;\n  render();\n  closeModal();\n  out(`<span class=\"ok\">Книга обновлена:<\/span> ${esc(title)} — ${esc(author)}`);\n}\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Поиск книг по названию и автору", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР24 • Зад.2 • Поиск книг по названию и автору<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:ho filter()<\/code>).<\/div>\n\n<div class=\"card\">\n  <div class=\"toolbar\">\n    <input id=\"search\" placeholder=\"Поиск по названию или автору...\" style=\"flex:1;min-width:240px\" oninput=\"render()\">\n  <\/div>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const books = [\n  { title: &#x27;Война и мир&#x27;, author: &#x27;Л. Н. Толстой&#x27;, year: 1869, rating: 4.9 },\n  { title: &#x27;Анна Каренина&#x27;, author: &#x27;Л. Н. Толстой&#x27;, year: 1877, rating: 4.8 },\n  { title: &#x27;Мастер и Маргарита&#x27;, author: &#x27;М. А. Булгаков&#x27;, year: 1967, rating: 4.9 },\n  { title: &#x27;Собачье сердце&#x27;, author: &#x27;М. А. Булгаков&#x27;, year: 1925, rating: 4.7 },\n  { title: &#x27;Дюна&#x27;, author: &#x27;Ф. Герберт&#x27;, year: 1965, rating: 4.6 }\n];\n\nfunction render() {\n  const query = $(&#x27;search&#x27;).value.trim().toLowerCase();\n  const filtered = query\n    ? books.filter(b =&gt; b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query))\n    : books;\n\n  $(&#x27;books&#x27;).innerHTML = filtered.length\n    ? filtered.map(b =&gt; `&lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.title)}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;${esc(b.author)} · ${b.year} · ★ ${b.rating}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;Ничего не найдено.&lt;/p&gt;&#x27;;\n\n  out(`Запрос: «${esc(query)}» → найдено &lt;span class=&quot;hl&quot;&gt;${filtered.length}&lt;/span&gt; из ${books.length}`);\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst books = [\n  { title: 'Война и мир', author: 'Л. Н. Толстой', year ground:#fff;border:1px solid #e2e8f0;border-left:4px solid #1a73e8;border-radius:10px;padding:12px 14px;margin:8px 0}\n.book b{color:#0f172a}\n.book .meta{font-size:13px;color:#64748b;margin-top:4px}\n.stars{color:#f59e0b;letter-spacing:1px}\n\n.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}\n.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}\n.modal.open{display:flex}\n.modal-box{background:#fff;border-radius:12px;padding:20px;max-width:420px;width:100%}\n.modal-box h3{margin-bottom:10px}\n.modal-box input{width:100%}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР24 • Зад.3<\/span>\n<h1>Сортировка книг<\/h1>\n<div class=\"desc\">Задание 3: выпадающий список сортировки — по году (по возрастанию/убыванию), по названию (А-Я) и по рейтингу. Массив сортируется перед рендерингом.<\/div>\n\n<div class=\"card\">\n  <div class=\"toolbar\">\n    <label>Сортировка:<\/label>\n    <select id=\"sort\" onchange=\"render()\">\n      <option value=\"year-desc\">Год: новые сначала<\/option>\n      <option value=\"year-asc\">Год: старые сначала<\/option>\n      <option value=\"title\">Название (А-Я)<\/option>\n      <option value=\"rating\">Рейтинг (высокий → низкий)<\/option>\n    <\/select>\n  <\/div>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const books = [\n  { title: &#x27;Война и мир&#x27;, author: &#x27;Л. Н. Толстой&#x27;, year: 1869, rating: 4.9 },\n  { title: &#x27;Анна Каренина&#x27;, author: &#x27;Л. Н. Толстой&#x27;, year: 1877, rating: 4.8 },\n  { title: &#x27;Мастер и Маргарита&#x27;, author: &#x27;М. А. Булгаков&#x27;, year: 1967, rating: 4.9 },\n  { title: &#x27;Дюна&#x27;, author: &#x27;Ф. Герберт&#x27;, year: 1965, rating: 4.6 },\n  { title: &#x27;Гарри Поттер&#x27;, author: &#x27;Дж. Роулинг&#x27;, year: 1997, rating: 4.7 }\n];\n\nconst comparators = {\n  &#x27;year-desc&#x27;: (a, b) =&gt; b.year - a.year,\n  &#x27;year-asc&#x27;: (a, b) =&gt; a.year - b.year,\n  &#x27;title&#x27;: (a, b) =&gt; a.title.localeCompare(b.title, &#x27;ru&#x27;),\n  &#x27;rating&#x27;: (a, b) =&gt; b.rating - a.rating\n};\n\nfunction render() {\n  const mode = $(&#x27;sort&#x27;).value;\n  const sorted = [...books].sort(comparators[mode]);\n  $(&#x27;books&#x27;).innerHTML = sorted.map(b =&gt; `\n    &lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.title)}&lt;/b&gt;\n    &lt;div class=&quot;meta&quot;&gt;${esc(b.author)} · ${b.year} · ★ ${b.rating}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);\n  out(`sort(&#x27;${mode}&#x27;) → ${sorted.map(b =&gt; b.year).join(&#x27;, &#x27;)}`);\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst books = [\n  { title: 'Война и мир', author: 'Л. Н. Толстой', year: 1869, rating: 4.9 },\n  { title: 'Анна Каренина', author: 'Л. Н. Толстой', year: 1877, rating: 4.8 },\n  { title: 'Мастер и Маргарита', author: 'М. А. Булгаков', year: 1967, rating: 4.9 },\n  { title: 'Дюна', author: 'Ф. Герберт', year: 1965, rating: 4.6 },\n  { title: 'Гарри Поттер', author: 'Дж. Роулинг', year: 1997, rating: 4.7 }\n];\n\nconst comparators = {\n  'year-desc': (a, b) => b.year - a.year,\n  'year-asc': (a, b) => a.year - b.year,\n  'title': (a, b) => a.title.localeCompare(b.title, 'ru'),\n  'rating': (a, b) => b.rating - a.rating\n};\n\nfunction render() {\n  const mode = $('sort').value;\n  const sorted = [...books].sort(comparators[mode]);\n  $('books').innerHTML = sorted.map(b => `\n    <div class=\"book\"><b>${esc(b.title)}<\/b>\n    <div class=\"meta\">${esc(b.author)} · ${b.year} · ★ ${b.rating}<\/div><\/div>`).join('');\n  out(`sort('${mode}') → ${sorted.map(b => b.year).join(', ')}`);\n}\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
