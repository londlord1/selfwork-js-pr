<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.navbtns{display:flex;gap:8px}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}

.card h2{font-size:15px;color:#333;margin-bottom:10px}
.book{display:flex;justify-content:space-between;align-items:center;border-left:4px solid #1a73e8;background:#f8fafc;border-radius:8px;padding:9px 12px;margin-bottom:6px}

.rbtn.gray{background:#64748b}.rbtn.green{background:#28a745}.rbtn.red{background:#dc3545}
.out{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;min-height:40px;margin-top:10px}
.muted{color:#64748b;font-size:12px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#e0f2fe;color:#075985}

<body>
<div class="wrap">
<div class="topnav">
  <a href="index.html">« Все практические</a>
  <div class="navbtns"><button class="btn" onclick="location.href='pr21.html'">← Пред. ПР</button><button class="btn" onclick="location.href='pr23.html'">След. ПР →</button></div>

<span class="pr-tag">ПР22</span>
<h1>ПР22 — Основы классов: модель данных (все задания)</h1>
<div class="desc">Одно приложение библиотеки: метод isOld(), фильтр по диапазону лет, средний рейтинг и сортировка пяти книг по году.</div>

<div class="card">
  <h2>Библиотека</h2>
  <div id="books"></div>
</div>

<div class="card">
  <h2>Диапазон лет + средний рейтинг + сортировка</h2>
  <div class="row">
    <label class="muted">годы:</label>
    <input id="from" type="number" value="1900"><span class="muted">—</span>
    <input id="to" type="number" value="2000">
    <button class="rbtn" onclick="filterRange()">Фильтр</button>
    <button class="rbtn gray" onclick="showAll()">Все</button>
  </div>
  <div class="row">
    <button class="rbtn green" onclick="showAvg()">Средний рейтинг</button>
    <button class="rbtn gray" onclick="sortYear()">Сортировать по году (новые → старые)</button>
  </div>
  <div class="out" id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let library;

class Book {
  constructor(title, author, year, genre, rating) {
    this.title = title; this.author = author; this.year = year; this.genre = genre; this.rating = rating;
  }
  get age() { return new Date().getFullYear() - this.year; }
  isOld() { return this.age > 100; }
}

class LibraryManager {
  constructor(books) { this.books = books; }
  getAllBooks() { return this.books; }
  getBooksByYearRange(f, t) { return this.books.filter((b) => b.year >= f && b.year <= t); }
  getAverageRating() {
    if (!this.books.length) return 0;
    return Number((this.books.reduce((s, b) => s + b.rating, 0) / this.books.length).toFixed(2));
  }
}

function render(list) {
  $('books').innerHTML = list.map((b) =>
    '<div class="book"><div><span class="t">' + esc(b.title) + '</span><div class="m">' + esc(b.author) + ' · ' + b.year + ' · ' + esc(b.genre) + ' · ★ ' + b.rating + ' · возраст ' + b.age + '</div></div>'
    + '<span class="badge ' + (b.isOld() ? 'ok' : '') + '">' + (b.isOld() ? 'isOld: true' : 'isOld: false') + '</span></div>'
  ).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function out(html) { $('out').innerHTML = html; }

function filterRange() {
  const list = library.getBooksByYearRange(Number($('from').value), Number($('to').value));
  render(list);
  out('getBooksByYearRange(' + $('from').value + ', ' + $('to').value + ') → ' + list.length + ' книг');
}
function showAll() { render(library.getAllBooks()); out('getAllBooks() → ' + library.books.length + ' книг'); }
function showAvg() { out('getAverageRating() → <b>' + library.getAverageRating() + '</b>'); }
function sortYear() {
  const sorted = [...library.books].sort((a, b) => b.year - a.year);
  render(sorted);
  out(sorted.map((b) => b.year + ': ' + b.title).join('\n'));
}

library = new LibraryManager([
  new Book('Война и мир', 'Л. Н. Толстой', 1869, 'роман', 4.9),
  new Book('Дюна', 'Ф. Герберт', 1965, 'фантастика', 4.6),
  new Book('Мастер и Маргарита', 'М. А. Булгаков', 1967, 'роман', 4.8),
  new Book('Гарри Поттер', 'Дж. Роулинг', 1997, 'фэнтези', 4.7),
  new Book('Тень ветра', 'К. Р. Сафон', 2001, 'детектив', 4.5)
]);
render(library.getAllBooks());
</script>
</body>
</html>
