ой&#x27;, 1869, &#x27;роман&#x27;, 4.9),\n  new Book(&#x27;Преступление и наказание&#x27;, &#x27;Ф. М. Достоевский&#x27;, 1866, &#x27;роман&#x27;, 4.8),\n  new Book(&#x27;Мастер и Маргарита&#x27;, &#x27;М. А. Булгаков&#x27;, 1967, &#x27;роман&#x27;, 4.9),\n  new Book(&#x27;Пикник на обочине&#x27;, &#x27;А. и Б. Стругацкие&#x27;, 1972, &#x27;фантастика&#x27;, 4.7),\n  new Book(&#x27;Дюна&#x27;, &#x27;Ф. Герберт&#x27;, 1965, &#x27;фантастика&#x27;, 4.6)\n];\n\n$(&#x27;books&#x27;).innerHTML = books.map(b =&gt; `\n  &lt;div class=&quot;book&quot;&gt;\n    &lt;b&gt;${esc(b.title)}&lt;/b&gt;\n    &lt;div class=&quot;meta&quot;&gt;${esc(b.author)} · ${b.year} · возраст: ${b.age} лет&lt;/div&gt;\n    &lt;div class=&quot;meta&quot;&gt;isOld(): &lt;b class=&quot;${b.isOld() ? &#x27;err&#x27; : &#x27;ok&#x27;}&quot;&gt;${b.isOld()}&lt;/b&gt;&lt;/div&gt;\n  &lt;/div&gt;`).join(&#x27;&#x27;);\n\nout(`Всего книг: &lt;span class=&quot;hl&quot;&gt;${books.length}&lt;/span&gt;\nСтарше 100 лет: &lt;span class=&quot;ok&quot;&gt;${books.filter(b =&gt; b.isOld()).length}&lt;/span&gt;\n&lt;br&gt;console.log(book.isOld()) → ${books.map(b =&gt; b.isOld()).join(&#x27;, &#x27;)}`);<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass Book {\n  constructor(title, author, year, genre, rating) {\n    this.title = title;\n    this.author = author;\n    this.year = year;\n    this.genre = genre;\n    this.rating = rating;\n  }\n\n  get age() {\n    return new Date().getFullYear() - this.year;\n  }\n\n  isOld() {\n    return this.age > 100;\n  }\n\n  getInfo() {\n    return `${this.title} — ${this.author} (${this.year})`;\n  }\n}\n\nconst books = [\n  new Book('Война и мир', 'Л. Н. Толстой', 1869, 'роман', 4.9),\n  new Book('Преступление и наказание', 'Ф. М. Достоевский', 1866, 'роман', 4.8),\n  new Book('Мастер и Маргарита', 'М. А. Булгаков', 1967, 'роман', 4.9),\n  new Book('Пикник на обочине', 'А. и Б. Стругацкие', 1972, 'фантастика', 4.7),\n  new Book('Дюна', 'Ф. Герберт', 1965, 'фантастика', 4.6)\n];\n\n$('books').innerHTML = books.map(b => `\n  <div class=\"book\">\n    <b>${esc(b.title)}<\/b>\n    <div class=\"meta\">${esc(b.author)} · ${b.year} · возраст: ${b.age} лет<\/div>\n    <div class=\"meta\">isOld(): <b class=\"${b.isOld() ? 'err' : 'ok'}\">${b.isOld()}<\/b><\/div>\n  <\/div>`).join('');\n\nout(`Всего книг: <span class=\"hl\">${books.length}<\/span>\nСтарше 100 лет: <span class=\"ok\">${books.filter(b => b.isOld()).length}<\/span>\n<br>console.log(book.isOld()) → ${books.map(b => b.isOld()).join(', ')}`);\n\n<\/script>\n<script>\n(function () {\n  var index = 0;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Диапазон лет издания", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР22 • Зад.2 • Диапазон лет издания<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size: 7;result&#x27;).innerHTML = list.length\n    ? list.map(b =&gt; `&lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.title)}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;${esc(b.author)} · ${b.year}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;Книг в этом диапазоне нет.&lt;/p&gt;&#x27;;\n}\n\nfunction applyRange() {\n  const from = Number($(&#x27;from&#x27;).value);\n  const to = Number($(&#x27;to&#x27;).value);\n  const list = library.getBooksByYearRange(from, to);\n  render(list);\n  out(`getBooksByYearRange(${from}, ${to}) → найдено &lt;span class=&quot;hl&quot;&gt;${list.length}&lt;/span&gt; книг`);\n}\n\nfunction resetRange() {\n  render(library.getAllBooks());\n  out(`getAllBooks() → &lt;span class=&quot;hl&quot;&gt;${library.getAllBooks().length}&lt;/span&gt; книг`);\n}\n\nresetRange();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass Book {\n  constructor(title, author, year) { this.title = title; this.author = author; this.year = year; }\n  getInfo() { return `${this.title} — ${this.author} (${this.year})`; }\n}\n\nclass LibraryManager {\n  constructor(books = []) { this.books = books; }\n  getBooksByYearRange(fromYear, toYear) {\n    return this.books.filter(book => book.year >= fromYear && book.year <= toYear);\n  }\n  getAllBooks() { return this.books; }\n}\n\nconst library = new LibraryManager([\n  new Book('Война и мир', 'Л. Н. Толстой', 1869),\n  new Book('Мастер и Маргарита', 'М. А. Булгаков', 1967),\n  new Book('Пикник на обочине', 'А. и Б. Стругацкие', 1972),\n  new Book('Гарри Поттер и философский камень', 'Дж. Роулинг', 1997),\n  new Book('Тень ветра', 'К. Р. Сафон', 2001),\n  new Book('Сто лет одиночества', 'Г. Г. Маркес', 1967)\n]);\n\nfunction render(list) {\n  $('result').innerHTML = list.length\n    ? list.map(b => `<div class=\"book\"><b>${esc(b.title)}<\/b><div class=\"meta\">${esc(b.author)} · ${b.year}<\/div><\/div>`).join('')\n    : '<p class=\"muted\">Книг в этом диапазоне нет.<\/p>';\n}\n\nfunction applyRange() {\n  const from = Number($('from').value);\n  const to = Number($('to').value);\n  const list = library.getBooksByYearRange(from, to);\n  render(list);\n  out(`getBooksByYearRange(${from}, ${to}) → найдено <span class=\"hl\">${list.length}<\/span> книг`);\n}\n\nfunction resetRange() {\n  render(library.getAllBooks());\n  out(`getAllBooks() → <span class=\"hl\">${library.getAllBooks().length}<\/span> книг`);\n}\n\nresetRange();\n\n<\/script>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Средний рейтинг книг", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР22 • Зад.3 • Средний рейтинг книг<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{back rs{color:#f59e0b;letter-spacing:1px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР22 • Зад.3<\/span>\n<h1>Средний рейтинг книг<\/h1>\n<div class=\"desc\">Задание 3: метод <code>getAverageRating()<\/code> считает средний рейтинг через <code>reduce<\/code>. Если книг нет — возвращает 0. Результат округляется до двух знаков.<\/div>\n\n<div class=\"card\">\n  <h2>Книги и рейтинги<\/h2>\n  <div id=\"books\"><\/div>\n  <div class=\"row\">\n    <button class=\"btn\" onclick=\"showAverage()\">getAverageRating()<\/button>\n    <button class=\"btn red\" onclick=\"clearBooks()\">Очистить библиотеку<\/button>\n    <button class=\"btn green\" onclick=\"restoreBooks()\">Вернуть книги<\/button>\n  <\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">class Book {\n  constructor(title, rating) { this.title = title; this.rating = rating; }\n}\n\nclass LibraryManager {\n  constructor(books = []) { this.books = books; }\n  getAverageRating() {\n    if (this.books.length === 0) return 0;\n    const sum = this.books.reduce((acc, book) =&gt; acc + book.rating, 0);\n    return Number((sum / this.books.length).toFixed(2));\n  }\n}\n\nconst initial = [\n  new Book(&#x27;Война и мир&#x27;, 4.9),\n  new Book(&#x27;Мастер и Маргарита&#x27;, 4.8),\n  new Book(&#x27;Дюна&#x27;, 4.6),\n  new Book(&#x27;Пикник на обочине&#x27;, 4.7)\n];\n\nlet library = new LibraryManager([...initial]);\n\nfunction render() {\n  $(&#x27;books&#x27;).innerHTML = library.books.length\n    ? library.books.map(b =&gt; `&lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.title)}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;рейтинг: ${b.rating}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;Библиотека пуста.&lt;/p&gt;&#x27;;\n}\n\nfunction showAverage() {\n  const avg = library.getAverageRating();\n  out(`getAverageRating() → &lt;span class=&quot;hl&quot;&gt;${avg}&lt;/span&gt;${library.books.length === 0 ? &#x27; &lt;span class=&quot;muted&quot;&gt;(книг нет — возвращаем 0)&lt;/span&gt;&#x27; : &#x27;&#x27;}`);\n}\n\nfunction clearBooks() { library.books = []; render(); out(&#x27;Библиотека очищена — средний рейтинг теперь 0&#x27;); }\nfunction restoreBooks() { library.books = [...initial]; render(); showAverage(); }\n\nrender();\nshowAverage();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass Book {\n  constructor(title, rating) { this.title = title; this.rating = rating; }\n}\n\nclass LibraryManager {\n  constructor(books = []) { this.books = books; }\n  getAverageRating() {\n    if (this.books.length === 0) return 0;\n    const sum = this.books.reduce((acc, book) => acc + book.rating, 0);\n    return Number((sum / this.books.length).toFixed(2));\n  }\n}\n\nconst initial = [\n  new Book('Война и мир', 4.9),\n  new Book('Мастер и Маргарита', 4.8),\n  new Book('Дюна', 4.6),\n  new Book('Пикник на обочине', 4.7)\n];\n\nlet library = new LibraryManager([...initial]);\n\nfunction render() {\n  $('books').innerHTML = library.books.length\n    ? library.books.map(b => `<div class=\"book\"><b>${esc(b.title)}<\/b><div class=\"meta\">рейтинг: ${b.rating}<\/div><\/div>`).join('')\n    : '<p class=\"muted\">Библиотека пуста.<\/p>';\n}\n\nfunction showAverage() {\n  const avg = library.getAverageRating();\n  out(`getAverageRating() → <span class=\"hl\">${avg}<\/span>${library.books.length === 0 ? ' <span class=\"muted\">(книг нет — возвращаем 0)<\/span>' : ''}`);\n}\n\nfunction clearBooks() { library.books = []; render(); out('Библиотека очищена — средний рейтинг теперь 0'); }\nfunction restoreBooks() { library.books = [...initial]; render(); showAverage(); }\n\nrender();\nshowAverage();\n\n<\/script>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Пять книг разных жанров", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР22 • Зад.4 • Пять книг разных жанров<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.book{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #1a73e8;border-radius:10px;padding:12px 14px;margin:8px 0}\n.book b{color:#0f172a}\n.book .meta{font-size:13px;color:#64748b;margin-top:4px}\n.stars{color:#f59e0b;letter-spacing:1px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР22 • Зад.4<\/span>\n<h1>Пять книг разных жанров<\/h1>\n<div class=\"desc\">Задание 4: созданы 5 книг разных жанров с рейтингами. Список выводится отсортированным по году выпуска — от новых к старым.<\/div>\n\n<div class=\"card\">\n  <h2>Книги, отсортированные по году (новые → старые)<\/h2>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">class Book {\n  constructor(title, author, year, genre, rating) {\n    this.title = title; this.author = author; this.year = year;\n    this.genre = genre; this.rating = rating;\n  }\n}\n\nconst library = [\n  new Book(&#x27;Война и мир&#x27;, &#x27;Л. Н. Толстой&#x27;, 1869, &#x27;роман&#x27;, 4.9),\n  new Book(&#x27;Дюна&#x27;, &#x27;Ф. Герберт&#x27;, 1965, &#x27;фантастика&#x27;, 4.6),\n  new Book(&#x27;Мастер и Маргарита&#x27;, &#x27;М. А. Булгаков&#x27;, 1967, &#x27;роман&#x27;, 4.8),\n  new Book(&#x27;Гарри Поттер&#x27;, &#x27;Дж. Роулинг&#x27;, 1997, &#x27;фэнтези&#x27;, 4.7),\n  new Book(&#x27;Тень ветра&#x27;, &#x27;К. Р. Сафон&#x27;, 2001, &#x27;детектив&#x27;, 4.5)\n];\n\nconst sortedBooks = [...library].sort((a, b) =&gt; b.year - a.year);\n\n$(&#x27;books&#x27;).innerHTML = sortedBooks.map((b, i) =&gt; `\n  &lt;div class=&quot;book&quot;&gt;\n    &lt;b&gt;${i + 1}. ${esc(b.title)}&lt;/b&gt;\n    &lt;div class=&quot;meta&quot;&gt;${esc(b.author)} · ${b.year} · ${esc(b.genre)} · &lt;span class=&quot;stars&quot;&gt;★&lt;/span&gt; ${b.rating}&lt;/div&gt;\n  &lt;/div&gt;`).join(&#x27;&#x27;);\n\nout(sortedBooks.map(b =&gt; `${b.year}: ${b.title}`).join(&#x27;\\n&#x27;));<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass Book {\n  constructor(title, author, year, genre, rating) {\n    this.title = title; this.author = author; this.year = year;\n    this.genre = genre; this.rating = rating;\n  }\n}\n\nconst library = [\n  new Book('Война и мир', 'Л. Н. Толстой', 1869, 'роман', 4.9),\n  new Book('Дюна', 'Ф. Герберт', 1965, 'фантастика', 4.6),\n  new Book('Мастер и Маргарита', 'М. А. Булгаков', 1967, 'роман', 4.8),\n  new Book('Гарри Поттер', 'Дж. Роулинг', 1997, 'фэнтези', 4.7),\n  new Book('Тень ветра', 'К. Р. Сафон', 2001, 'детектив', 4.5)\n];\n\nconst sortedBooks = [...library].sort((a, b) => b.year - a.year);\n\n$('books').innerHTML = sortedBooks.map((b, i) => `\n  <div class=\"book\">\n    <b>${i + 1}. ${esc(b.title)}<\/b>\n    <div class=\"meta\">${esc(b.author)} · ${b.year} · ${esc(b.genre)} · <span class=\"stars\">★<\/span> ${b.rating}<\/div>\n  <\/div>`).join('');\n\nout(sortedBooks.map(b => `${b.year}: ${b.title}`).join('\\n'));\n\n<\/script>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
