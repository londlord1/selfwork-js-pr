<html lang="ru">

<title>ПР05 — DOM и события</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.topnav a:hover{text-decoration:underline}
.navbtns{display:flex;gap:8px;flex-wrap:wrap}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
.navbtns .btn:hover{background:#eef6ff}
.navbtns .btn:disabled{opacity:.4;cursor:default}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.card h2{font-size:17px;color:#333;margin-bottom:10px}
.toc{position:sticky;top:0;z-index:5;background:#f0f2f5;padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e2e8f0;margin-bottom:6px}
.toc b{font-size:13px;color:#475569;margin-right:4px}
.toc a{display:inline-flex;min-width:30px;justify-content:center;background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:3px 9px;text-decoration:none;font-size:13px;color:#0b57d0}
.toc a:hover{background:#eef6ff;border-color:#93c5fd}
.task{margin:20px 0}
.task-head{display:flex;gap:9px;align-items:center;font-weight:600;color:#334155;margin-bottom:8px;font-size:15px}
.task-num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;background:#1a73e8;color:#fff;border-radius:50%;font-size:13px;flex:none}
.task-frame{width:100%;height:620px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;display:block;transition:height .15s ease}
footer{margin-top:24px;font-size:12px;color:#999;text-align:center}
a{color:#0b57d0}
</style>
</head>

}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР05<\/span>\n<h1>ПР05 • Зад.3 • Валидация формы (Имя и Email)<\/h1>\n<div class=\"desc\">Форма с полями «Имя» и «Email». При нажатии проверяйте, что поля не пустые, и выводите результат.<\/div>\n\n<div class=\"card\">\n<label>Имя:<\/label><input id=\"fname\" value=\"\">\n<label>Email:<\/label><input id=\"fmail\" value=\"\"><br>\n<button class=\"btn\" onclick=\"check()\">Отправить<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Заполните форму и нажмите «Отправить».<\/div>\n<script>\nfunction check(){\n const n=document.getElementById('fname').value.trim();\n const e=document.getElementById('fmail').value.trim();\n const o=document.getElementById('out');\n const errs=[];\n if(!n)errs.push('Имя обязательно');\n if(!e)errs.push('Email обязателен');\n else if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(e))errs.push('Некорректный email');\n if(errs.length){o.innerHTML='<span class=\"err\">'+errs.join('; ')+'<\/span>';}\n else{o.innerHTML=`<span class=\"ok\">✅ Форма валидна!<\/span>\n\nИмя: ${n}\nEmail: ${e}`;}\n}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeOb ing:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР05<\/span>\n<h1>ПР05 • Зад.4 • Галерея изображений<\/h1>\n<div class=\"desc\">Несколько миниатюр; по клику в большом блоке отображается соответствующее изображение.<\/div>\n\n<div class=\"card\">\n<div id=\"big\" style=\"height:180px;border:2px dashed #cbd5e1;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#999;margin-bottom:14px\">Выберите миниатюру<\/div>\n<div style=\"display:flex;gap:10px\" id=\"thumbs\"><\/div>\n<\/div>\n<script>\nconst items=[\n {label:'Красный',color:'#e74c3c'},\n {label:'Зелёный',color:'#27ae60'},\n {label:'Синий',color:'#3498db'},\n {label:'Жёлтый',color:'#f1c40f'}\n];\nconst th=document.getElementById('thumbs');\nitems.forEach((it,i)=>{\n const b=document.createElement('div');\n b.style.cssText='width:60px;height:60px;border-radius:10px;background:'+it.color+';cursor:pointer;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)';\n b.title=it.label;\n b.onclick=()=>{const big=document.getElementById('big');big.innerHTML='<span style=\"font-weight:bold\">'+it.label+'<\/span>';big.style.background=it.color;big.style.color='#fff';};\n th.appendChild(b)   title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
</body>
</html>
