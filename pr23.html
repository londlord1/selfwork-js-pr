e; this.author = author; this.year = year; }\n  getInfo() { return `${this.title} — ${this.author} (${this.year})`; }\n}\n\nclass EducationalBook extends Book {\n  constructor(title, author, year, subject, level = &#x27;beginner&#x27;) {\n    super(title, author, year);\n    this.subject = subject;\n    this.level = level;\n  }\n  getInfo() {\n    const baseInfo = super.getInfo();\n    const levelMap = { beginner: &#x27;Начальный&#x27;, intermediate: &#x27;Средний&#x27;, advanced: &#x27;Продвинутый&#x27; };\n    return `${baseInfo} (Учебник по ${this.subject}, ${levelMap[this.level] || this.level})`;\n  }\n}\n\nconst books = [\n  new Book(&#x27;Война и мир&#x27;, &#x27;Л. Н. Толстой&#x27;, 1869),\n  new EducationalBook(&#x27;JavaScript для профессионалов&#x27;, &#x27;Д. Флэнаган&#x27;, 2020, &#x27;JavaScript&#x27;, &#x27;advanced&#x27;)\n];\n\nfunction render() {\n  $(&#x27;books&#x27;).innerHTML = books.map(b =&gt; `\n    &lt;div class=&quot;book&quot;&gt;\n      &lt;b&gt;${esc(b.title)}&lt;/b&gt;\n      &lt;div class=&quot;meta&quot;&gt;${esc(b.getInfo())}&lt;/div&gt;\n      &lt;div class=&quot;meta&quot;&gt;instanceof EducationalBook: &lt;b class=&quot;${b instanceof EducationalBook ? &#x27;ok&#x27; : &#x27;muted&#x27;}&quot;&gt;${b instanceof EducationalBook}&lt;/b&gt;&lt;/div&gt;\n    &lt;/div&gt;`).join(&#x27;&#x27;);\n}\n\nfunction addTextbook() {\n  const subject = $(&#x27;subject&#x27;).value.trim() || &#x27;JavaScript&#x27;;\n  const level = $(&#x27;level&#x27;).value;\n  books.push(new EducationalBook(&#x27;Учебник по &#x27; + subject, &#x27;Автор&#x27;, new Date().getFullYear(), subject, level));\n  render();\n  out(`&lt;span class=&quot;ok&quot;&gt;Создан EducationalBook&lt;/span&gt;\n${esc(books[books.length - 1].getInfo())}`);\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<> 0);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "AudioBook.skipTo(time)", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР23 • Зад.2 • AudioBook.skipTo(time)<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cur окнига)&#x27;, 720, 0);\n\nfunction render(extra = &#x27;&#x27;) {\n  const p = Math.round(audiobook.currentTime / audiobook.duration * 100);\n  out(`${esc(audiobook.title)}\nТекущее время: &lt;span class=&quot;hl&quot;&gt;${audiobook.currentTime}&lt;/span&gt; / ${audiobook.duration} мин\nПрогресс: [${&#x27;█&#x27;.repeat(Math.round(p / 5))}${&#x27;░&#x27;.repeat(20 - Math.round(p / 5))}] ${p}%\n${extra}`);\n}\n\nfunction doSkip() {\n  audiobook.skipTo(Number($(&#x27;time&#x27;).value) || 0);\n  render();\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass AudioBook {\n  constructor(title, duration, currentTime = 0) {\n    this.title = title;\n    this.duration = duration;\n    this.currentTime = currentTime;\n  }\n\n  skipTo(time) {\n    if (time < 0) time = 0;\n    if (time > this.duration) time = this.duration;\n    this.currentTime = time;\n    console.log(`⏩ Переход к ${time} минуте`);\n    render(`⏩ Переход к ${time} минуте`);\n    return time;\n  }\n}\n\nconst audiobook = new AudioBook('Дюна (аудиокнига)', 720, 0);\n\nfunction render(extra = '') {\n  const p = Math.round(audiobook.currentTime / audiobook.duration * 100);\n  out(`${esc(audiobook.title)}\nТекущее время: <span class=\"hl\">${audiobook.currentTime}<\/span> / ${audiobook.duration} мин\nПрогресс: [${'█'.repeat(Math.round(p / 5))}${'░'.repeat(20 - Math.round(p / 5))}] ${p}%\n${extra}`);\n}\n\nfunction doSkip() {\n  audiobook.skipTo(Number($('time').value) || 0);\n  render();\n}\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Класс Collection", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР23 • Зад.3 • Класс Collection<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n lex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.book{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #1a73e8;border-radius:10px;padding:12px 14px;margin:8px 0}\n.book b{color:#0f172a}\n.book .meta{font-size:13px;color:#64748b;margin-top:4px}\n.stars{color:#f59e0b;letter-spacing:1px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР23 • Зад.3<\/span>\n<h1>Класс Collection<\/h1>\n<div class=\"desc\">Задание 3: коллекция книг с методами <code>addBook()<\/code>, <code>getAllBooks()<\/code> и <code>getByType()<\/code>. Тип определяется через <code>instanceof<\/code>.<\/div>\n\n<div class=\"card\">\n  <h2>Коллекция<\/h2>\n  <div class=\"row\">\n    <button class=\"btn\" onclick=\"add('book')\">+ Обычная книга<\/button>\n    <button class=\"btn green\" onclick=\"add('ebook')\">+ Электронная<\/button>\n    <button class=\"btn orange\" onclick=\"add('audiobook')\">+ Аудиокнига<\/button>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn gray\" onclick=\"show('all')\">getAllBooks()<\/button>\n    <button class=\"btn gray\" onclick=\"show('book')\">getByType('book')<\/button>\n    <button class=\"btn gray\" onclick=\"show('ebook')\">getByType('ebook')<\/button>\n    <button class=\"btn gray\" onclick=\"show('audiobook')\">getByType('audiobook')<\/button>\n  <\/div>\n  <div id=\"list\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">class Book {\n  constructor(title) { this.title = title; this.type = &#x27;book&#x27;; }\n  getInfo() { return `${this.title} (печатная книга)`; }\n}\nclass EBook extends Book {\n  constructor(title, fileSize) { super(title); this.type = &#x27;ebook&#x27;; this.fileSize = fileSize; }\n  getInfo() { return `${this.title} (электронная, ${this.fileSize} МБ)`; }\n}\nclass AudioBook extends Book {\n  constructor(title, duration) { super(title); this.type = &#x27;audiobook&#x27;; this.duration = duration; }\n  getInfo() { return `${this.title} (аудиокнига, ${this.duration} мин)`; }\n}\n\nclass Collection {\n  constructor() { this.books = []; }\n  addBook(book) { this.books.push(book); return this; }\n  getAllBooks() { return this.books; }\n  getByType(type) {\n    if (type === &#x27;ebook&#x27;) return this.books.filter(b =&gt; b instanceof EBook);\n    if (type === &#x27;audiobook&#x27;) return this.books.filter(b =&gt; b instanceof AudioBook);\n    if (type === &#x27;book&#x27;) return this.books.filter(b =&gt; !(b instanceof EBook) &amp;&amp; !(b instanceof AudioBook));\n    return this.books;\n  }\n}\n\nconst collection = new Collection();\nlet counter = 0;\n\nfunction add(type) {\n  counter++;\n  if (type === &#x27;ebook&#x27;) collection.addBook(new EBook(&#x27;Электронная книга &#x27; + counter, 2 + counter));\n  else if (type === &#x27;audiobook&#x27;) collection.addBook(new AudioBook(&#x27;Аудиокнига &#x27; + counter, 120 + counter * 10));\n  else collection.addBook(new Book(&#x27;Печатная книга &#x27; + counter));\n  show(&#x27;all&#x27;);\n}\n\nfunction show(type) {\n  const list = type === &#x27;all&#x27; ? collection.getAllBooks() : collection.getByType(type);\n  $(&#x27;list&#x27;).innerHTML = list.length\n    ? list.map(b =&gt; `&lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.getInfo())}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;type: ${b.type}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;В этой категории пусто.&lt;/p&gt;&#x27;;\n  out(`getByType(&#x27;${type}&#x27;) → &lt;span class=&quot;hl&quot;&gt;${list.length}&lt;/span&gt; книг(и)`);\n}\n\nadd(&#x27;book&#x27;);\nadd(&#x27;ebook&#x27;);\nadd(&#x27;audiobook&#x27;);<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nclass Book {\n  constructor(title) { this.title = title; this.type = 'book'; }\n  getInfo() { return `${this.title} (печатная книга)`; }\n}\nclass EBook extends Book {\n  constructor(title, fileSize) { super(title); this.type = 'ebook'; this.fileSize = fileSize; }\n  getInfo() { return `${this.title} (электронная, ${this.fileSize} МБ)`; }\n}\nclass AudioBook extends Book {\n  constructor(title, duration) { super(title); this.type = 'audiobook'; this.duration = duration; }\n  getInfo() { return `${this.title} (аудиокнига, ${this.duration} мин)`; }\n}\n\nclass Collection {\n  constructor() { this.books = []; }\n  addBook(book) { this.books.push(book); return this; }\n  getAllBooks() { return this.books; }\n  getByType(type) {\n    if (type === 'ebook') return this.books.filter(b => b instanceof EBook);\n    if (type === 'audiobook') return this.books.filter(b => b instanceof AudioBook);\n    if (type === 'book') return this.books.filter(b => !(b instanceof EBook) && !(b instanceof AudioBook));\n    return this.books;\n  }\n}\n\nconst collection = new Collection();\nlet counter = 0;\n\nfunction add(type) {\n  counter++;\n  if (type === 'ebook') collection.addBook(new EBook('Электронная книга ' + counter, 2 + counter));\n  else if (type === 'audiobook') collection.addBook(new AudioBook('Аудиокнига ' + counter, 120 + counter * 10));\n  else collection.addBook(new Book('Печатная книга ' + counter));\n  show('all');\n}\n\nfunction show(type) {\n  const list = type === 'all' ? collection.getAllBooks() : collection.getByType(type);\n  $('list').innerHTML = list.length\n    ? list.map(b => `<div class=\"book\"><b>${esc(b.getInfo())}<\/b><div class=\"meta\">type: ${b.type}<\/div><\/div>`).join('')\n    : '<p class=\"muted\">В этой категории пусто.<\/p>';\n  out(`getByType('${type}') → <span class=\"hl\">${list.length}<\/span> книг(и)`);\n}\n\nadd('book');\nadd('ebook');\nadd('audiobook');\n\n<\/script>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
