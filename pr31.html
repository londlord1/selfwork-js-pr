<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПР31 — React: калькулятор (все задания)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.navbtns{display:flex;gap:8px}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin:14px 0}
.screen{background:#0f172a;color:#4ade80;font-family:Consolas,monospace;font-size:26px;padding:16px;border-radius:10px;text-align:right;min-height:64px}
.err{color:#fca5a5;font-size:14px;min-height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px}
input:focus,select:focus{border-color:#1a73e8;outline:none}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.keypad button{padding:13px 0;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;font-size:16px;cursor:pointer}
.keypad button:hover{background:#eef6ff}
.keypad button.op{background:#e0f2fe}
.keypad button.eq{background:#1a73e8;color:#fff;border-color:#1a73e8}
.mem{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.muted{color:#64748b;font-size:12px;margin-top:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px;margin-right:4px}
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="topnav">
  <a href="index.html">« Все практические</a>
  <div class="navbtns"><button class="btn" onclick="location.href='pr30.html'">← Пред. ПР</button><button class="btn" onclick="location.href='pr32.html'">След. ПР →</button></div>
</div>
<span class="pr-tag">ПР31</span>
<h1>ПР31 — React: формы, списки, научный калькулятор (все задания)</h1>
<div class="desc">Один калькулятор со всеми заданиями: операции % и ^, клавиатурные сокращения, цифровая панель, системы счисления, память M+/M−/MR/MC и научные функции.</div>
<div id="root"></div>
</div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function fact(n) { return n < 0 || !Number.isInteger(n) ? NaN : (n <= 1 ? 1 : n * fact(n - 1)); }

function evaluate(raw) {
  let e = String(raw).replace(/\s+/g, '');
  if (!/^[0-9+\-*/().^!a-zπ]+$/i.test(e)) throw new Error('Недопустимые символы');
  e = e.replace(/π/g, 'Math.PI').replace(/sqrt\(/g, 'Math.sqrt(').replace(/sin\(/g, 'Math.sin(')
       .replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(').replace(/log\(/g, 'Math.log10(')
       .replace(/ln\(/g, 'Math.log(').replace(/(\d+(?:\.\d+)?)!/g, 'FACT($1)').replace(/\^/g, '**');
  if (e.includes('!')) throw new Error('Факториал: n! или fact(n)');
  const r = Function('FACT', '"use strict"; return (' + e + ')')(fact);
  if (typeof r !== 'number' || !Number.isFinite(r)) throw new Error('Не число');
  return r;
}

function App() {
  const [a, setA] = useState('10');
  const [b, setB] = useState('3');
  const [op, setOp] = useState('+');
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [active, setActive] = useState('a');
  const [memory, setMemory] = useState(0);
  const [base, setBase] = useState(10);
  const [baseVal, setBaseVal] = useState('255');
  const [sci, setSci] = useState('');
  const [sciResult, setSciResult] = useState(null);
  const [sciErr, setSciErr] = useState('');

  const calcSci = () => {
    try { setSciResult(Number(evaluate(sci).toFixed(6))); setSciErr(''); }
    catch (e) { setSciResult(null); setSciErr(e.message); }
  };

  const calc = () => {
    const x = Number(a), y = Number(b);
    if (a === '' || b === '') { setError('Введите оба числа'); return; }
    if ((op === '/' || op === '%') && y === 0) { setError('Деление на ноль!'); return; }
    const v = op === '+' ? x + y : op === '-' ? x - y : op === '*' ? x * y : op === '^' ? Math.pow(x, y) : op === '%' ? x % y : x / y;
    setError(''); setResult(v);
  };

  useEffect(() => {
    const kd = (e) => {
      if (e.key === 'Escape') { setA(''); setB(''); setOp('+'); setResult(null); setError(''); }
      if (e.key === 'Enter') { calc(); return; }
      if (/^[0-9.]$/.test(e.key)) { if (active === 'a') setA(v => v + e.key); else setB(v => v + e.key); }
      if (['+', '-', '*', '/', '%', '^'].includes(e.key)) setOp(e.key);
    };
    window.addEventListener('keydown', kd);
    return () => window.removeEventListener('keydown', kd);
  }, [a, b, op, active]);

  const append = (v) => { if (active === 'a') setA(p => p + v); else setB(p => p + v); };
  const chooseOp = (v) => { setOp(v); };
  const toActive = (f) => setActive(f);

  const dec = Number.parseInt(baseVal, base);
  const decOk = !Number.isNaN(dec);

  return (
    <div>
      <div className="card">
        <h2>Основной калькулятор: + − × ÷ % ^ · клавиши · панель</h2>
        <div className="row">
          <input value={a} onFocus={() => toActive('a')} onChange={(e) => setA(e.target.value)} placeholder="A" style={{ width: 110, borderColor: active === 'a' ? '#1a73e8' : undefined }} />
          <select value={op} onChange={(e) => setOp(e.target.value)}>
            <option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option><option value="%">%</option><option value="^">^</option>
          </select>
          <input value={b} onFocus={() => toActive('b')} onChange={(e) => setB(e.target.value)} placeholder="B" style={{ width: 110, borderColor: active === 'b' ? '#1a73e8' : undefined }} />
          <button className="rbtn" onClick={calc}>=</button>
        </div>
        <div className="screen">{result === null ? '—' : result}</div>
        <div className="err">{error}</div>
        <div className="keypad">
          {['7','8','9','/','4','5','6','*','1','2','3','-','0','.','%','+','^'].map((k) => (
            /^[/\-*%+^]$/.test(k)
              ? <button key={k} className="op" onClick={() => chooseOp(k)}>{k}</button>
              : <button key={k} onClick={() => append(k)}>{k}</button>
          ))}
          <button className="eq" style={{ gridColumn: 'span 2' }} onClick={calc}>=</button>
          <button style={{ gridColumn: 'span 2' }} onClick={() => { setA(''); setB(''); setResult(null); setError(''); setActive('a'); }}>C</button>
        </div>
        <div className="mem">
          <span className="badge">Память: {memory}</span>
          <button className="rbtn" onClick={() => result !== null && setMemory(memory + result)}>M+</button>
          <button className="rbtn gray" onClick={() => result !== null && setMemory(memory - result)}>M−</button>
          <button className="rbtn gray" onClick={() => setA(String(memory))}>MR</button>
          <button className="rbtn red" onClick={() => setMemory(0)}>MC</button>
        </div>
        <p className="muted">Esc — сброс · цифры — в активное поле · + − * / % ^ — операция</p>
      </div>

      <div className="card">
        <h2>Системы счисления</h2>
        <div className="row">
          <select value={base} onChange={(e) => setBase(Number(e.target.value))}>
            <option value={2}>BIN</option><option value={8}>OCT</option><option value={10}>DEC</option><option value={16}>HEX</option>
          </select>
          <input value={baseVal} onChange={(e) => setBaseVal(e.target.value)} style={{ fontFamily: 'Consolas,monospace', flex: 1 }} />
        </div>
        <div className="screen" style={{ fontSize: 16, textAlign: 'left', lineHeight: 1.8 }}>
          {decOk
            ? 'DEC: ' + dec + '\nBIN: ' + dec.toString(2) + '\nOCT: ' + dec.toString(8) + '\nHEX: ' + dec.toString(16).toUpperCase()
            : '—'}
        </div>
        <div className="err">{dec !== null && !decOk ? 'Некорректные символы для системы' : ''}</div>
      </div>

      <div className="card">
        <h2>Научный калькулятор: sin cos tan log ln √ π e n!</h2>
        <input value={sci} onChange={(e) => setSci(e.target.value)} placeholder="sin(π/2)+sqrt(16)+3!" style={{ width: '100%', fontFamily: 'Consolas,monospace', fontSize: 15 }} onKeyDown={(e) => { if (e.key === 'Enter') calcSci(); }} />
        <div className="row">
          {['sin(', 'cos(', 'tan(', 'log(', 'ln(', 'sqrt(', 'π', 'e', '^', '(', ')', 'fact('].map((fn) => <button key={fn} className="rbtn gray" onClick={() => setSci(s => s + fn.replace(/\($/, '') + (fn.endsWith('(') ? '(' : ''))}>{fn.replace('(', '')}</button>)}
          <button className="rbtn green" onClick={calcSci}>=</button>
          <button className="rbtn red" onClick={() => { setSci(''); setSciErr(''); }}>C</button>
        </div>
        <div className="screen">{sciResult === null ? '—' : sciResult}</div>
        <div className="err">{sciErr}</div>
      </div>
    </div>
  );
}
const state = {};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
