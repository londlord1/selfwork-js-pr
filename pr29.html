onst gainNode = audioContext.createGain();\n    oscillator.connect(gainNode);\n    gainNode.connect(audioContext.destination);\n    oscillator.frequency.value = 800;\n    oscillator.type = &#x27;sine&#x27;;\n    gainNode.gain.value = 0.3;\n    oscillator.start();\n    setTimeout(() =&gt; { oscillator.stop(); audioContext.close(); }, 500);\n  } catch (e) {\n    console.warn(&#x27;Звук недоступен:&#x27;, e);\n  }\n}\n\nfunction App() {\n  const [time, setTime] = useState(10);\n  const [initial, setInitial] = useState(10);\n  const [active, setActive] = useState(false);\n  const [finished, setFinished] = useState(false);\n\n  useEffect(() =&gt; {\n    if (!active) return;\n    const id = setInterval(() =&gt; setTime(t =&gt; Math.max(0, t - 1)), 1000);\n    return () =&gt; clearInterval(id);\n  }, [active]);\n\n  useEffect(() =&gt; {\n    if (time === 0 &amp;&amp; active) {\n      setActive(false);\n      setFinished(true);\n      playSound();\n    }\n  }, [time, active]);\n\n  const start = () =&gt; {\n    if (time === 0) setTime(initial);\n    setFinished(false);\n    setActive(true);\n  };\n\n  return (\n    &lt;div className=&quot;card timer&quot;&gt;\n      &lt;h2&gt;Таймер со звуком&lt;/h2&gt;\n      &lt;div className={finished ? &#x27;time finished&#x27; : &#x27;time&#x27;}&gt;\n        {String(Math.floor(time / 60)).padStart(2, &#x27;0&#x27;)}:{String(time % 60).padStart(2, &#x27;0&#x27;)}\n      &lt;/div&gt;\n      &lt;div className=&quot;timer-row&quot;&gt;\n        &lt;button className=&quot;rbtn&quot; onClick={() =&gt; setInitial(i =&gt; { const v = Math.min(99, i + 5); if (!active) setTime(v); return v; })}&gt;+5 сек&lt;/button&gt;\n        &lt;button className=&quot;rbtn&quot; onClick={() =&gt; setInitial(i =&gt; { const v = Math.max(5, i - 5); if (!active) setTime(v); return v; })}&gt;−5 сек&lt;/button&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;timer-btns&quot;&gt;\n        &lt;button className=&quot;rbtn green&quot; onClick={start} disabled={ onds]);\n\n  useEffect(() =&gt; {\n    if (!active) return;\n    const id = setInterval(() =&gt; setTime(t =&gt; Math.max(0, t - 1)), 1000);\n    return () =&gt; clearInterval(id);\n  }, [active]);\n\n  useEffect(() =&gt; {\n    if (time === 0 &amp;&amp; active) setActive(false);\n  }, [time, active]);\n\n  return (\n    &lt;div className=&quot;card timer&quot;&gt;\n      &lt;h2&gt;Таймер MM:SS&lt;/h2&gt;\n      &lt;div className=&quot;time&quot;&gt;{String(Math.floor(time / 60)).padStart(2, &#x27;0&#x27;)}:{String(time % 60).padStart(2, &#x27;0&#x27;)}&lt;/div&gt;\n      &lt;div className=&quot;timer-row&quot;&gt;\n        &lt;input\n          type=&quot;number&quot; min=&quot;0&quot; max=&quot;99&quot; value={minutes}\n          onChange={(e) =&gt; setMinutes(Math.max(0, Math.min(99, parseInt(e.target.value) || 0)))}\n          style={{ width: 70, textAlign: &#x27;center&#x27; }}\n        /&gt;\n        &lt;b&gt;:&lt;/b&gt;\n        &lt;input\n          type=&quot;number&quot; min=&quot;0&quot; max=&quot;59&quot; value={seconds}\n          onChange={(e) =&gt; setSeconds(Math.max(0, Math.min(59, parseInt(e.target.value) || 0)))}\n          style={{ width: 70, textAlign: &#x27;center&#x27; }}\n        /&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;timer-btns&quot;&gt;\n        &lt;button className=&quot;rbtn green&quot; onClick={() =&gt; setActive(true)} disabled={active || time === 0}&gt;Старт&lt;/button&gt;\n        &lt;button className=&quot;rbtn gray&quot; onClick={() =&gt; setActive(false)} disabled={!active}&gt;Пауза&lt;/button&gt;\n        &lt;button className=&quot;rbtn red&quot; onClick={() =&gt; { setActive(false); setTime(minutes * 60 + seconds); }}&gt;Сброс&lt;/button&gt;\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Минуты 0–99, секунды 0–59&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"htt ;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2p x27;50% 50%&#x27; }}\n        /&gt;\n        &lt;text x=&quot;110&quot; y=&quot;118&quot; textAnchor=&quot;middle&quot; fontSize=&quot;34&quot; fontWeight=&quot;700&quot; fill=&quot;#1a73e8&quot;&gt;\n          {String(Math.floor(time / 60)).padStart(2, &#x27;0&#x27;)}:{String(time % 60).padStart(2, &#x27;0&#x27;)}\n        &lt;/text&gt;\n      &lt;/svg&gt;\n      &lt;div className=&quot;timer-row&quot;&gt;\n        &lt;input\n          type=&quot;number&quot; min=&quot;5&quot; max=&quot;300&quot; value={initial}\n          onChange={(e) =&gt; { const v = Math.max(5, Math.min(300, parseInt(e.target.value) || 5)); setInitial(v); if (!active) setTime(v); }}\n          style={{ width: 90, textAlign: &#x27;center&#x27; }}\n        /&gt;\n        &lt;span&gt;секунд&lt;/span&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;timer-btns&quot;&gt;\n        &lt;button className=&quot;rbtn green&quot; onClick={() =&gt; { if (time === 0) setTime(initial); setActive(true); }} disabled={active}&gt;Старт&lt;/button&gt;\n        &lt;button className=&quot;rbtn gray&quot; onClick={() =&gt; setActive(false)} disabled={!active}&gt;Пауза&lt;/button&gt;\n        &lt;button className=&quot;rbtn red&quot; onClick={() =&gt; { setActive(false); setTime(initial); }}&gt;Сброс&lt;/button&gt;\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Прогресс: {Math.round(progress)}%&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState, useEffect } = React;\n\nfunction App() {\n  const [initial, setInitial] = useState(30);\n  const se.rest{background:#e0f2fe;color:#075985}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР29 • Зад.7<\/span>\n<h1>React: интервальная тренировка<\/h1>\n<div class=\"desc\">Задание 7: чередование работы и отдыха (30 с / 10 с) по циклу. Текущий этап отображается подписью «Работа» / «Отдых» и меняет цвет.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState, useEffect } = React;\n\nfunction App() {\n  const [workTime, setWorkTime] = useState(30);\n  const [restTime, setRestTime] = useState(10);\n  const [phase, setPhase] = useState(&#x27;work&#x27;);\n  const [time, setTime] = useState(30);\n  const [active, setActive] = useState(false);\n  const [round, setRound] = useState(1);\n\n  useEffect(() =&gt; {\n    if (!active) return;\n    const id = setInterval(() =&gt; {\n      setTime(prev =&gt; {\n        if (prev &lt;= 1) {\n          if (phase === &#x27;work&#x27;) { setPhase(&#x27;rest&#x27;); return restTime; }\n          setPhase(&#x27;work&#x27;);\n          setRound(r =&gt; r + 1);\n          return workTime;\n        }\n        return prev - 1;\n      });\n    }, 1000);\n    return () =&gt; clearInterval(id);\n  }, [active, phase, workTime, restTime]);\n\n  return (\n    &lt;div className=&quot;card timer&quot;&gt;\n      &lt;h2&gt;Интервальная тренировка&lt;/h2&gt;\n      &lt;div className={`phase ${phase}`}&gt;{phase === &#x27;work&#x27; ? &#x27;🏋️ Работа&#x27; : &#x27;😌 Отдых&#x27;}&lt;/div&gt;\n      &lt;div className=&quot;time&quot;&gt;{String(Math.floor(time / 60)).padStart(2, &#x27;0&#x27;)}:{String(time % 60).padStart(2, &#x27;0&#x27;)}&lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Круг: {round} · работа {workTime}с / отдых {restTime}с&lt;/p&gt;\n      &lt;div className=&quot;timer-row&quot;&gt;\n        &lt;label&gt;Работа&lt;/label&gt;\n        &lt;input type=&quot;number&quot; min=&quot;5&quot; max=&quot;300&quot; value={workTime} onChange={(e) =&gt; setWorkTime(Math.max(5, Number(e.target.value) || 5))} style={{ width: 70 }} /&gt;\n        &lt;label&gt;Отдых&lt;/label&gt;\n        &lt;input type=&quot;number&quot; min=&quot;5&quot; max=&quot;300&quot; value={restTime} onChange={(e) =&gt; setRestTime(Math.max(5, Number(e.target.value) || 5))} style={{ width: 70 }} /&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;timer-btns&quot;&gt;\n        &lt;button className=&quot;rbtn green&quot; onClick={() =&gt; setActive(!active)}&gt;{active ? &#x27;Пауза&#x27; : &#x27;Старт&#x27;}&lt;/button&gt;\n        &lt;button className=&quot;rbtn red&quot; onClick={() =&gt; { setActive(false); setPhase(&#x27;work&#x27;); setTime(workTime); setRound(1); }}&gt;Сброс&lt;/button&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState, useEffect } = React;\n\nfunction App() {\n  const [workTime, setWorkTime] = useState(30);\n  const [restTime, setRestTime] = useState(10);\n  const [phase, setPhase] = useState('work');\n  const [time, setTime] = useState(30);\n  const [active, setActive] = useState(false);\n  const [round, setRound] = useState(1);\n\n  useEffect(() => {\n    if (!active) return;\n    const id = setInterval(() => {\n      setTime(prev => {\n        if (prev <= 1) {\n          if (phase === 'work') { setPhase('rest'); return restTime; }\n          setPhase('work');\n          setRound(r => r + 1);\n          return workTime;\n        }\n        return prev - 1;\n      });\n    }, 1000);\n    return () => clearInterval(id);\n  }, [active, phase, workTime, restTime]);\n\n  return (\n    <div className=\"card timer\">\n      <h2>Интервальная тренировка<\/h2>\n      <div className={`phase ${phase}`}>{phase === 'work' ? '🏋️ Работа' : '😌 Отдых'}<\/div>\n      <div className=\"time\">{String(Math.floor(time / 60)).padStart(2, '0')}:{String(time % 60).padStart(2, '0')}<\/div>\n      <p className=\"muted\">Круг: {round} · работа {workTime}с / отдых {restTime}с<\/p>\n      <div className=\"timer-row\">\n        <label>Работа<\/label>\n        <input type=\"number\" min=\"5\" max=\"300\" value={workTime} onChange={(e) => setWorkTime(Math.max(5, Number(e.target.value) || 5))} style={{ width: 70 }} />\n        <label>Отдых<\/label>\n        <input type=\"number\" min=\"5\" max=\"300\" value={restTime} onChange={(e) => setRestTime(Math.max(5, Number(e.target.value) || 5))} style={{ width: 70 }} />\n      <\/div>\n      <div className=\"timer-btns\">\n        <button className=\"rbtn green\" onClick={() => setActive(!active)}>{active ? 'Пауза' : 'Старт'}<\/button>\n        <button className=\"rbtn red\" onClick={() => { setActive(false); setPhase('work'); setTime(workTime); setRound(1); }}>Сброс<\/button>\n      <\/div>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 6;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
