ертированный индекс.<\/div>\n<script>\nconst tagToArticles=new Map();\nfunction addArticleToTagIndex(id,tags){tags.forEach(tag=>{if(!tagToArticles.has(tag))tagToArticles.set(tag,new Set());tagToArticles.get(tag).add(id);});}\nlet n=1;\nfunction addSample(){addArticleToTagIndex(1,['js']);show();}\nfunction addSample2(){addArticleToTagIndex(2,['js','react']);show();}\nfunction show(){const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">tagToArticles (Map)<\/span>\n\n${[...tagToArticles.entries()].map(([t,s])=>`• ${t} → статьи: ${[...s].join(', ')}`).join('\\n')||'пока пусто'}`;}\nfunction query(){const s=tagToArticles.get('js');document.getElementById('out').innerHTML='Статьи с тегом \"js\": <span class=\"ok\">'+(s?[...s].join(', '):'нет')+'<\/span>';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Поиск пересечения тегов", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР15 • Зад.3 • Поиск пересечения тегов<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;curs  class=\"desc\">Реализуйте commonTags(setA, setB), находящую общие теги двух статей (Set); верните новый Set.<\/div>\n\n<div class=\"card\">\n<button class=\"btn\" onclick=\"runInter()\">commonTags(статья1, статья2)<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<\/div>\n<script>\nconst articleA=new Set(['js','react','css','html']);\nconst articleB=new Set(['js','python','react','node']);\nfunction commonTags(a,b){return new Set([...a].filter(t=>b.has(t)));}\nfunction runInter(){const r=commonTags(articleA,articleB);document.getElementById('out').innerHTML=`Статья 1: [${[...articleA].join(', ')}]\nСтатья 2: [${[...articleB].join(', ')}]\n\n<span class=\"hl\">Общие теги:<\/span> <span class=\"ok\">[${[...r].join(', ')}]<\/span> ${r.size} шт.`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "WeakMap — кэш вычислений", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР15 • Зад.4 • WeakMap — кэш вычислений<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР15<\/span>\n<h1>ПР15 • Зад.4 • WeakMap — кэш вычислений<\/h1>\n<div class=\"desc\">Добавьте кэш вычислений для объектов статей через WeakMap: ключ — объект статьи, значение — число тегов (удаляется сборщиком мусора).<\/div>\n\n<div class=\"card\">\n<button class=\"btn\" onclick=\"cache1()\">Вычислить теги ст.1<\/button>\n<button class=\"btn green\" onclick=\"cache2()\">Вычислить теги ст.2<\/button>\n<button class=\"btn orange\" onclick=\"probe()\">Проверить кэш (size у WeakMap скрыт)<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">WeakMap кэширует количество тегов для объекта-статьи.<\/div>\n<script>\nconst articleCache=new WeakMap();\nfunction getTagCount(obj){if(articleCache.has(obj))return articleCache.get(obj);const c=obj.tags.size;articleCache.set(obj,c);return c;}\nconst s1={title:'Изучаю JS',tags:new Set(['js','react','css'])};\nconst s2={title:'Про задачу',tags:new Set(['map','set'])};\nfunction cache1(){document.getElementById('out').innerHTML=`Кэш ст.1 → тегов: <span class=\"ok\">${getTagCount(s1)}<\/span>\n\nПовторный вызов вернёт значение из WeakMap (O(1)).`;}\nfunction cache2(){document.getElementById('out').innerHTML=`Кэш ст.2 → тегов: <span class=\"ok\">${getTagCount(s2)}<\/span>`;}\nfunction probe(){let has=articleCache.has(s1);const got=articleCache.get(s1);document.getElementById('out').innerHTML=`<span class=\"hl\">WeakMap<\/span>: ст.1 в кэше = ${has}, значение = <span class=\"ok\">${got}<\/span>\n\nWeakMap не даёт .size и не перебирается — записи исчезают вместе с объектом (сборщик мусора).`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
</body>
</html>
