g:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР03 • Зад.1<\/span>\n<h1>Простые числа, квадраты, произведение<\/h1>\n<div class=\"desc\">Функции <code>getPrimes()<\/code>, <code>getSquares()<\/code> и <code>getProduct()<\/code> для массива чисел.\n<code>getProduct()<\/code> реализован через <code>reduce<\/code> с начальным значением 1; <code>isPrime()<\/code> корректно\nобрабатывает 0, 1, отрицательные и дробные числа.<\/div>\n\n<div class=\"card\">\n  <h2>Исходный массив<\/h2>\n  <div class=\"row\">\n    <input id=\"arr\" value=\"12, 7, 23, 45, 18, 31, 6, 2, 19, 8\" style=\"flex:1;min-width:260px\">\n    <button class=\"btn\" onclick=\"runAll()\">Пересчитать<\/button>\n    <button class=\"btn gray\" onclick=\"resetArr()\">Сброс<\/button>\n  <\/div>\n  <p class=\"muted\">Числа через запятую или пробел. Можно проверить крайние случаи: 1, 0, −5, 2.<\/p>\n<\/div>\n\n<div class=\"card\">\n  <h2>Результаты<\/h2>\n  <div id=\"result\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n\n<details><summary>Показать код решения<\/summary><pre class=\"code\">function isPrime(num) {\n  if (!Number.isInteger(num) || num &lt; 2) return false;\n  if (num === 2) return true;\n  if (num % 2 === 0) return false;\n  for (let i = 3; i * i &lt;= num; i += 2) {\n    if (num % i === 0) return false;\n  }\n  return true;\n}\n\nfunction getPrimes(arr) {\n  return arr.filter(isPrime);\n}\n\nfunction getSquares(arr) {\n  return arr.map(num =&gt; num * num);\n}\n\nfunction getProduct(arr) {\n  return arr.reduce((acc, current) =&gt; acc * current, 1);\n}\n\nfunction parseArray(text) {\n  return text.split(/[,\\s;]+/).filter(Boolean).map(Number).filter(n =&gt; Number.isFinite(n));\n}\n\nfunction fmt(list) {\n  return &#x27;[&#x27; + list.join(&#x27;, &#x27;) + &#x27;]&#x27;;\n}\n\nfunction runAll() {\n  const numbers = parseArray($(&#x27;arr&#x27;).value);\n  if (numbers.length === 0) {\n    $(&#x27;result&#x27;).innerHTML = &#x27;&#x27;;\n    out(&#x27;&lt;span class=&quot;err&quot;&gt;Введите хотя бы одно число&lt;/span&gt;&#x27;);\n    return;\n  }\n\n  const primes = getPrimes(numbers);\n  const squares = getSquares(numbers);\n  const product = getProduct(numbers);\n  const invalid = $(&#x27;arr&#x27;).value.split(/[,\\s;]+/).filter(Boolean).length - numbers.length;\n\n  $(&#x27;result&#x27;).innerHTML = `\n    &lt;div class=&quot;item&quot;&gt;&lt;span&gt;Исходный массив&lt;/span&gt;&lt;b&gt;${fmt(numbers)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span&gt;getPrimes()&lt;/span&gt;&lt;b&gt;${fmt(primes)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span&gt;getSquares()&lt;/span&gt;&lt;b&gt;${fmt(squares)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span&gt;getProduct()&lt;/span&gt;&lt;b&gt;${product.toLocaleString(&#x27;ru-RU&#x27;)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span&gt;Проверка isPrime()&lt;/span&gt;&lt;b&gt;${numbers.map(n =&gt; n + &#x27; → &#x27; + isPrime(n)).join(&#x27;, &#x27;)}&lt;/b&gt;&lt;/div&gt;`;\n\n  out(`Простых чисел: &lt;span class=&quot;hl&quot;&gt;${primes.length}&lt;/span&gt; из ${numbers.length}\nПроизведение через reduce с начальным значением 1: &lt;span class=&quot;ok&quot;&gt;${product.toLocaleString(&#x27;ru-RU&#x27;)}&lt;/span&gt;\n${invalid ? &#x27;&lt;span class=&quot;err&quot;&gt;Пропущено нечисловых значений: &#x27; + invalid + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;}`);\n}\n\nfunction resetArr() {\n  $(&#x27;arr&#x27;).value = &#x27;12, 7, 23, 45, 18, 31, 6, 2, 19, 8&#x27;;\n  runAll();\n}\n\nrunAll();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\n\nfunction isPrime(num) {\n  if (!Number.isInteger(num) || num < 2) return false;\n  if (num === 2) return true;\n  if (num % 2 === 0) return false;\n  for (let i = 3; i * i <= num; i += 2) {\n    if (num % i === 0) return false;\n  }\n  return true;\n}\n\nfunction getPrimes(arr) {\n  return arr.filter(isPrime);\n}\n\nfunction getSquares(arr) {\n  return arr.map(num => num * num);\n}\n\nfunction getProduct(arr) {\n  return arr.reduce((acc, current) => acc * current, 1);\n}\n\nfunction parseArray(text) {\n  return text.split(/[,\\s;]+/).filter(Boolean).map(Number).filter(n => Number.isFinite(n));\n}\n\nfunction fmt(list) {\n  return '[' + list.join(', ') + ']';\n}\n\nfunction runAll() {\n  const numbers = parseArray($('arr').value);\n  if (numbers.length === 0) {\n    $('result').innerHTML = '';\n    out('<span class=\"err\">Введите хотя бы одно число<\/span>');\n    return;\n  }\n\n  const primes = getPrimes(numbers);\n  const squares = getSquares(numbers);\n  const product = getProduct(numbers);\n  const invalid = $('arr').value.split(/[,\\s;]+/).filter(Boolean).length - numbers.length;\n\n  $('result').innerHTML = `\n    <div class=\"item\"><span>Исходный массив<\/span><b>${fmt(numbers)}<\/b><\/div>\n    <div class=\"item\"><span>getPrimes()<\/span><b>${fmt(primes)}<\/b><\/div>\n    <div class=\"item\"><span>getSquares()<\/span><b>${fmt(squares)}<\/b><\/div>\n    <div class=\"item\"><span>getProduct()<\/span><b>${product.toLocaleString('ru-RU')}<\/b><\/div>\n    <div class=\"item\"><span>Проверка isPrime()<\/span><b>${numbers.map(n => n + ' → ' + isPrime(n)).join(', ')}<\/b><\/div>`;\n\n  out(`Простых чисел: <span class=\"hl\">${primes.length}<\/span> из ${numbers.length}\nПроизведение через reduce с начальным значением 1: <span class=\"ok\">${product.toLocaleString('ru-RU')}<\/span>\n${invalid ? '<span class=\"err\">Пропущено нечисловых значений: ' + invalid + '<\/span>' : ''}`);\n}\n\nfunction resetArr() {\n  $('arr').value = '12, 7, 23, 45, 18, 31, 6, 2, 19, 8';\n  runAll();\n}\n\nrunAll();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Самое длинное/короткое слово и группировка по длине", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР03 • Зад.2 • Самое длинное/короткое слово и группировка по длине<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8 менты: яблоко, банан, апельсин, груша, киви, манго, ананас<\/div>\n<button class=\"btn\" onclick=\"runLong()\">getLongestWord()<\/button>\n<button class=\"btn green\" onclick=\"runShort()\">getShortestWord()<\/button>\n<button class=\"btn orange\" onclick=\"runGroup()\">countWordsByLength()<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<\/div>\n<script>\nconst words=['яблоко','банан','апельсин','груша','киви','манго','ананас'];\nfunction getLongestWord(a){return a.reduce((m,w)=>w.length>m.length?w:m,a[0]);}\nfunction getShortestWord(a){return a.reduce((m,w)=>w.length<m.length?w:m,a[0]);}\nfunction countWordsByLength(a){return a.reduce((acc,w)=>{const l=w.length;acc[l]=(acc[l]||0)+1;return acc;},{});}\nfunction runLong(){const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">getLongestWord()<\/span>\n\nСамое длинное слово: <span class=\"ok\">${getLongestWord(words)}<\/span> (${getLongestWord(words).length} букв)`;}\nfunction runShort(){const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">getShortestWord()<\/span>\n\nСамое короткое слово: <span class=\"ok\">${getShortestWord(words)}<\/span> (${getShortestWord(words).length} букв)`;}\nfunction runGroup(){const g=countWordsByLength(words);const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">countWordsByLength()<\/span>\n\n${Object.entries(g).map(([l,c])=>`Длина ${l}: ${c} слов(а)`).join('\\n')}`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Поиск по группе, обновление и удаление студента", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=d ibution()<\/b>, <b>getPassingStudents(threshold)<\/b>.<\/div>\n\n<div class=\"card\">\n<button class=\"btn\" onclick=\"runTop()\">getTopStudentInGroup()<\/button>\n<button class=\"btn green\" onclick=\"runAge()\">getAgeDistribution()<\/button>\n<button class=\"btn orange\" onclick=\"runPass(80)\">getPassingStudents(80)<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<\/div>\n<script>\nconst S=[{name:'Алексей',age:20,group:'ИС-201',grade:85},{name:'Мария',age:19,group:'ИС-202',grade:92},{name:'Иван',age:21,group:'ИС-201',grade:78},{name:'Екатерина',age:20,group:'ИС-203',grade:95},{name:'Дмитрий',age:22,group:'ИС-201',grade:67}];\nfunction getTopStudentInGroup(){const g={};S.forEach(s=>{if(!g[s.group]||s.grade>g[s.group].grade)g[s.group]=s;});return g;}\nfunction getAgeDistribution(){return S.reduce((a,s)=>{a[s.age]=(a[s.age]||0)+1;return a;},{});}\nfunction getPassingStudents(t){return S.filter(s=>s.grade>=t);}\nfunction runTop(){const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">getTopStudentInGroup()<\/span>\n\n${Object.entries(getTopStudentInGroup()).map(([g,s])=>`🏆 ${g}: ${s.name} — ${s.grade} б.`).join('\\n')}`;}\nfunction runAge(){const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">getAgeDistribution()<\/span>\n\n${Object.entries(getAgeDistribution()).map(([a,c])=>`Возраст ${a}: ${c} чел.`).join('\\n')}`;}\nfunction runPass(t){const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">getPassingStudents(${t})<\/span>\n\n${getPassingStudents(t).map(s=>`- ${s.name} (${s.grade} б.)`).join('\\n')||'— никого'}`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {

    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});
