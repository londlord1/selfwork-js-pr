llowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР17 • Зад.1<\/span>\n<h1>Инкапсуляция. Ограниченный счётчик<\/h1>\n<div class=\"desc\">Фабричная функция <code>createBoundedCounter(min, max)<\/code>: приватная переменная через замыкание, блокировка выхода за пределы диапазона, методы <code>getRange()<\/code>, <code>getValue()<\/code> и <code>reset()<\/code> (сброс до <code>min<\/code>). Некорректный диапазон (min &gt; max) выбрасывает ошибку.<\/div>\n\n<div class=\"card\">\n  <h2>1. Создание счётчика<\/h2>\n  <div class=\"row\">\n    <label>min<\/label><input id=\"min\" type=\"number\" value=\"0\" style=\"width:90px\">\n    <label>max<\/label><input id=\"max\" type=\"number\" value=\"5\" style=\"width:90px\">\n    <button class=\"btn green\" onclick=\"createCounter()\">Создать<\/button>\n    <button class=\"btn red\" onclick=\"resetCounter()\">reset()<\/button>\n  <\/div>\n  <p class=\"muted\">Попробуйте min = 5, max = 0 — фабрика выбросит ошибку.<\/p>\n<\/div>\n\n<div class=\"card\">\n  <h2>2. Публичный API<\/h2>\n  <div class=\"row\">\n    <button class=\"btn\" onclick=\"doIncrement()\">increment()<\/button>\n    <button class=\"btn orange\" onclick=\"doDecrement()\">decrement()<\/button>\n    <button class=\"btn gray\" onclick=\"showValue()\">getValue()<\/button>\n    <button class=\"btn gray\" onclick=\"showRange()\">getRange()<\/button>\n  <\/div>\n  <div class=\"out\" id=\"out\">Сначала создайте счётчик.<\/div>\n<\/div>\n\n<details><summary>Показать код решения<\/summary><pre class=\"code\">function createBoundedCounter(min, max) {\n  min = Number(min);\n  max = Number(max);\n  if (!Number.isFinite(min) || !Number.isFinite(max)) {\n    throw new Error(&#x27;min и max должны быть числами&#x27;);\n  }\n  if (min &gt; max) {\n    throw new Error(`Некорректный диапазон: min (${min}) больше max (${max})`);\n  }\n\n  let count = min;\n\n  function log(operation) {\n    console.log(`[${new Date().toLocaleTimeString()}] ${operation}: ${count} (${min}..${max})`);\n  }\n\n  return {\n    increment() {\n      if (count &gt;= max) {\n        console.warn(`Достигнут максимум: ${max}`);\n        return { value: count, warning: `Достигнут максимум: ${max}` };\n      }\n      count++;\n      log(&#x27;INCREMENT&#x27;);\n      return { value: count };\n    },\n    decrement() {\n      if (count &lt;= min) {\n        console.warn(`Достигнут минимум: ${min}`);\n        return { value: count, warning: `Достигнут минимум: ${min}` };\n      }\n      count--;\n      log(&#x27;DECREMENT&#x27;);\n      return { value: count };\n    },\n    getValue() {\n      return count;\n    },\n    getRange() {\n      return { min, max, current: count };\n    },\n    reset() {\n      count = min;\n      log(&#x27;RESET&#x27;);\n      return { value: count };\n    }\n  };\n}\n\nlet counter = null;\n\nfunction render(extra) {\n  const r = counter.getRange();\n  out(`&lt;span class=&quot;hl&quot;&gt;getRange()&lt;/span&gt; → ${JSON.stringify(r)}\n${extra || &#x27;&#x27;}\n&lt;span class=&quot;ok&quot;&gt;Приватность:&lt;/span&gt; counter.count = ${String(counter.count)} — прямого доступа нет`);\n}\n\nfunction createCounter() {\n  try {\n    counter = createBoundedCounter($(&#x27;min&#x27;).value, $(&#x27;max&#x27;).value);\n    render(`&lt;span class=&quot;ok&quot;&gt;Создан счётчик ${counter.getRange().min}..${counter.getRange().max}, текущее = ${counter.getValue()}&lt;/span&gt;`);\n  } catch (e) {\n    counter = null;\n    out(`&lt;span class=&quot;err&quot;&gt;Ошибка: ${esc(e.message)}&lt;/span&gt;`);\n  }\n}\n\nfunction need() {\n  if (!counter) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Сначала создайте счётчик&lt;/span&gt;&#x27;); return false; }\n  return true;\n}\n\nfunction doIncrement() {\n  if (!need()) return;\n  const res = counter.increment();\n  render(res.warning ? `&lt;span class=&quot;err&quot;&gt;${res.warning}&lt;/span&gt;` : `increment() → &lt;span class=&quot;ok&quot;&gt;${res.value}&lt;/span&gt;`);\n}\n\nfunction doDecrement() {\n  if (!need()) return;\n  const res = counter.decrement();\n  render(res.warning ? `&lt;span class=&quot;err&quot;&gt;${res.warning}&lt;/span&gt;` : `decrement() → &lt;span class=&quot;ok&quot;&gt;${res.value}&lt;/span&gt;`);\n}\n\nfunction showValue() { if (need()) render(`getValue() → &lt;span class=&quot;ok&quot;&gt;${counter.getValue()}&lt;/span&gt;`); }\nfunction showRange() { if (need()) render(&#x27;&#x27;); }\nfunction resetCounter() { if (need()) render(`reset() → &lt;span class=&quot;ok&quot;&gt;${counter.reset().value}&lt;/span&gt;`); }\n\ncreateCounter();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction createBoundedCounter(min, max) {\n  min = Number(min);\n  max = Number(max);\n  if (!Number.isFinite(min) || !Number.isFinite(max)) {\n    throw new Error('min и max должны быть числами');\n  }\n  if (min > max) {\n    throw new Error(`Некорректный диапазон: min (${min}) больше max (${max})`);\n  }\n\n  let count = min;\n\n  function log(operation) {\n    console.log(`[${new Date().toLocaleTimeString()}] ${operation}: ${count} (${min}..${max})`);\n  }\n\n  return {\n    increment() {\n      if (count >= max) {\n        console.warn(`Достигнут максимум: ${max}`);\n        return { value: count, warning: `Достигнут максимум: ${max}` };\n      }\n      count++;\n      log('INCREMENT');\n      return { value: count };\n    },\n    decrement() {\n      if (count <= min) {\n        console.warn(`Достигнут минимум: ${min}`);\n        return { value: count, warning: `Достигнут минимум: ${min}` };\n      }\n      count--;\n      log('DECREMENT');\n      return { value: count };\n    },\n    getValue() {\n      return count;\n    },\n    getRange() {\n      return { min, max, current: count };\n    },\n    reset() {\n      count = min;\n      log('RESET');\n      return { value: count };\n    }\n  };\n}\n\nlet counter = null;\n\nfunction render(extra) {\n  const r = counter.getRange();\n  out(`<span class=\"hl\">getRange()<\/span> → ${JSON.stringify(r)}\n${extra || ''}\n<span class=\"ok\">Приватность:<\/span> counter.count = ${String(counter.count)} — прямого доступа нет`);\n}\n\nfunction createCounter() {\n  try {\n    counter = createBoundedCounter($('min').value, $('max').value);\n    render(`<span class=\"ok\">Создан счётчик ${counter.getRange().min}..${counter.getRange().max}, текущее = ${counter.getValue()}<\/span>`);\n  } catch (e) {\n    counter = null;\n    out(`<span class=\"err\">Ошибка: ${esc(e.message)}<\/span>`);\n  }\n}\n\nfunction need() {\n  if (!counter) { out('<span class=\"err\">Сначала создайте счётчик<\/span>'); return false; }\n  return true;\n}\n\nfunction doIncrement() {\n  if (!need()) return;\n  const res = counter.increment();\n  render(res.warning ? `<span class=\"err\">${res.warning}<\/span>` : `increment() → <span class=\"ok\">${res.value}<\/span>`);\n}\n\nfunction doDecrement() {\n  if (!need()) return;\n  const res = counter.decrement();\n  render(res.warning ? `<span class=\"err\">${res.warning}<\/span>` : `decrement() → <span class=\"ok\">${res.value}<\/span>`);\n}\n\nfunction showValue() { if (need()) render(`getValue() → <span class=\"ok\">${counter.getValue()}<\/span>`); }\nfunction showRange() { if (need()) render(''); }\nfunction resetCounter() { if (need()) render(`reset() → <span class=\"ok\">${counter.reset().value}<\/span>`); }\n\ncreateCounter();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });

});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});
