<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.topnav a:hover{text-decoration:underline}
.navbtns{display:flex;gap:8px;flex-wrap:wrap}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
.navbtns .btn:hover{background:#eef6ff}
.navbtns .btn:disabled{opacity:.4;cursor:default}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.card h2{font-size:17px;color:#333;margin-bottom:10px}
.toc{position:sticky;top:0;z-index:5;background:#f0f2f5;padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e2e8f0;margin-bottom:6px}
.toc b{font-size:13px;color:#475569;margin-right:4px}
.toc a{display:inline-flex;min-width:30px;justify-content:center;background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:3px 9px;text-decoration:none;font-size:13px;color:#0b57d0}
.toc a:hover{background:#eef6ff;border-color:#93c5fd}
.task{margin:20px 0}
.task-head{display:flex;gap:9px;align-items:center;font-weight:600;color:#334155;margin-bottom:8px;font-size:15px}
.task-num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;background:#1a73e8;color:#fff;border-radius:50%;font-size:13px;flex:none}
.task-frame{width:100%;height:620px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;display:block;transition:height .15s ease}
footer{margin-top:24px;font-size:12px;color:#999;text-align:center}
a{color:#0b57d0}
</style>
</head>

o')||'[]');}catch(e){return [];}}\nfunction saveTasks(t){localStorage.setItem('todo',JSON.stringify(t));}\nlet t2=loadTasks();renderS();\nfunction addS(){const v=document.getElementById('ti2').value.trim();if(!v)return;t2.push(v);saveTasks(t2);document.getElementById('ti2').value='';renderS();document.getElementById('out').innerHTML='<span class=\"ok\">✅ Сохранено в localStorage:<\/span> '+v;}\nfunction clearS(){t2=[];saveTasks(t2);renderS();document.getElementById('out').innerHTML='<span class=\"err\">localStorage очищен<\/span>';}\nfunction renderS(){const ul=document.getElementById('tl2');ul.innerHTML='';t2.forEach((v,i)=>{const li=document.createElement('li');li.style.cssText='background:#f8f9fa;border-radius:8px;padding:8px 10px;margin:4px 0';li.textContent=(i+1)+'. '+v;ul.appendChild(li);});}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "To-Do: приоритеты задач", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР06 • Зад.3 • To-Do: приоритеты задач<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;paddi o: приоритеты задач<\/h1>\n<div class=\"desc\">Добавьте приоритет (высокий/средний/низкий) и сортируйте задачи по нему.<\/div>\n\n<div class=\"card\">\n<input id=\"ti3\" placeholder=\"Задача...\">\n<select id=\"pr\"><option value=\"high\">Высокий<\/option><option value=\"mid\" selected>Средний<\/option><option value=\"low\">Низкий<\/option><\/select>\n<button class=\"btn\" onclick=\"addP()\">➕<\/button>\n<button class=\"btn green\" onclick=\"sortP()\">Сортировать по приоритету<\/button>\n<\/div>\n<ul id=\"tl3\" style=\"list-style:none;padding:0\"><\/ul>\n<div class=\"out\" id=\"out\">Добавьте задачи с приоритетом.<\/div>\n<script>\nconst prio={high:1,mid:2,low:3};\nlet t3=[];renderP();\nfunction addP(){const v=document.getElementById('ti3').value.trim();if(!v)return;t3.push({text:v,p:document.getElementById('pr').value});renderP();}\nfunction sortP(){t3.sort((a,b)=>prio[a.p]-prio[b.p]);renderP();document.getElementById('out').innerHTML='<span class=\"hl\">Отсортировано по приоритету<\/span>';}\nfunction renderP(){const ul=document.getElementById('tl3');ul.innerHTML='';const colors={high:'#ffd2d2',mid:'#fff3cd',low:'#d4edda'};t3.forEach(x=>{const li=document.createElement('li');li.style.cssText='background:'+colors[x.p]+';border-radius:8px;padding:8px 10px;margin:4px 0';li.textContent=x.text+'· '+['','высокий','средний','низкий'][prio[x.p]];ul.appendChild(li);});}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "To-Do: срок выполнения и просроченные", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР06 • Зад.4 • To-Do: срок выполнения и просроченные<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР06<\/span>\n<h1>ПР06 • Зад.4 • To-Do: срок выполнения и просроченные<\/h1>\n<div class=\"desc\">Добавьте поле «срок выполнения» и выделяйте просроченные задачи.<\/div>\n\n<div class=\"card\">\n<input id=\"ti4\" placeholder=\"Задача...\">\n<input id=\"dt4\" type=\"date\">\n<button class=\"btn\" onclick=\"addD()\">➕<\/button>\n<\/div>\n<ul id=\"tl4\" style=\"list-style:none;padding:0\"><\/ul>\n<div class=\"out\" id=\"out\">Добавьте задачу со сроком. Просроченные — красные.<\/div>\n<script>\nlet t4=[];renderD();\nfunction addD(){const v=document.getElementById('ti4').value.trim();if(!v)return;t4.push({text:v,dl:document.getElementById('dt4').value});renderD();}\nfunction renderD(){const ul=document.getElementById('tl4');ul.innerHTML='';const now=new Date().toISOString().slice(0,10);t4.forEach(x=>{const overdue=x.dl&&x.dl<now;const li=document.createElement('li');li.style.cssText='border-radius:8px;padding:8px 10px;margin:4px 0;border-left:4px solid '+(overdue?'#dc3545':'#28a745')+';background:'+(overdue?'#ffe9e9':'#eefbf0');li.textContent=x.text+(x.dl?' · срок: '+x.dl:'')+(overdue?' ⚠️ ПРОСРОЧЕНО':'');li.style.color=overdue?'#a00':'#333';ul.appendChild(li);});}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
</body>
</html>
