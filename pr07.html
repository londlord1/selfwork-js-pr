<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПР07 — Валидация форм: все задания</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}.wrap{max-width:640px;margin:0 auto}.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}.navbtns{display:flex;gap:8px}.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}h1{color:#1a73e8;margin:4px 0;font-size:24px}.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:8px}.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:12px 0;color:#1a56a0;font-size:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin:14px 0}.card h2{font-size:15px;color:#333;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.pass-wrap{position:relative;flex:1;min-width:150px}.pass-wrap input{width:100%;padding:10px 40px 10px 12px}.pass-wrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer}.input{padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;flex:1;min-width:150px;font-family:inherit}.input:focus{border-color:#1a73e8;outline:none}.rbtn{padding:10px 16px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}.ok{color:#166534;background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px}.err{color:#991b1b;background:#fee2e2;border:1px solid #fecaca;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px;white-space:pre-wrap}.hint{font-size:12px;color:#64748b;margin-left:8px}.badge{display:inline-block;min-width:32px;text-align:center;padding:3px 10px;border-radius:999px;font-size:13px;border:1px solid #cbd5e1}</style>
</head>
<body><div class="wrap">
<div class="topnav"><a href="index.html">« Все практические</a><div class="navbtns"><button class="btn" onclick="location.href='pr06.html'">← Пред. ПР</button><button class="btn" onclick="location.href='pr08.html'">След. ПР →</button></div></div>
<span class="pr-tag">ПР07</span><h1>ПР07 — Валидация форм (все задания)</h1>
<div class="desc">Одна форма с валидацией: минимум 8 символов (1), хотя бы одна цифра (2), «глаз» показать/скрыть пароль (3), возраст 18+ по дате рождения (4).</div>

<div class="card"><h2>Пароль</h2>
  <div class="row"><div class="pass-wrap"><input id="pass" type="password" placeholder="Пароль" oninput="valid()"><button class="eye" id="eye" onclick="togglePass()">👁</button></div></div>
  <div class="row"><span class="hint">Проверки:</span><span class="badge" id="b1">8+</span><span class="badge" id="b2">цифра</span><span class="badge" id="b3">глаз</span></div>
  <div id="pmsg"></div>
</div>

<div class="card"><h2>Возраст (18+)</h2>
  <div class="row"><input class="input" id="birth" type="date"><button class="rbtn" onclick="age()">Проверить</button></div>
  <div id="amsg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
function valid(){
  const p=$('pass').value;
  const ok1=p.length>=8, ok2=/\d/.test(p);
  $('b1').style.background=ok1?'#86efac':'#e2e8f0';
  $('b2').style.background=ok2?'#86efac':'#e2e8f0';
  $('pmsg').innerHTML=ok1&&ok2?'<div class="ok">✔ Пароль корректный: минимум 8 символов и есть цифра</div>':'<div class="err">Условия:<br>• минимум 8 символов — '+(ok1?'да':'нет')+'<br>• хотя бы одна цифра — '+(ok2?'да':'нет')+'</div>';
}
function togglePass(){
  const p=$('pass'); p.type=p.type==='password'?'text':'password'; $('eye').textContent=p.type==='password'?'👁':'🙈';
}
function age(){
  const d=new Date($('birth').value);
  if(isNaN(d)){ $('amsg').innerHTML='<div class="err">Выберите дату рождения</div>'; return; }
  const y=new Date(); let years=y.getFullYear()-d.getFullYear();
  const m=y.getMonth()-d.getMonth(); if(m<0||(m===0&&y.getDate()<d.getDate()))years--;
  $('amsg').innerHTML=years>=18?'<div class="ok">Вам '+years+' — доступ разрешён (18+)</div>':'<div class="err">Вам '+years+' — доступ запрещён (нужно 18+)</div>';
}
valid();
</script>
</body></html>
