&#x27;Мы то, что мы делаем постоянно. Совершенство — не действие, а привычка.&#x27;, author: &#x27;Аристотель&#x27; },\n  { _id: &#x27;q2&#x27;, content: &#x27;Единственный способ сделать великую работу — любить то, что делаешь.&#x27;, author: &#x27;Стив Джобс&#x27; },\n  { _id: &#x27;q3&#x27;, content: &#x27;Жизнь — это то, что происходит с тобой, пока ты строишь планы.&#x27;, author: &#x27;Джон Леннон&#x27; }\n];\n\nfunction App() {\n  const [index, setIndex] = useState(0);\n  const [message, setMessage] = useState(&#x27;&#x27;);\n  const quote = QUOTES[index];\n\n  const copyText = async (text) =&gt; {\n    try {\n      await navigator.clipboard.writeText(text);\n      return true;\n    } catch (e) {\n      const ta = document.createElement(&#x27;textarea&#x27;);\n      ta.value = text;\n      document.body.appendChild(ta);\n      ta.select();\n      const ok = document.execCommand(&#x27;copy&#x27;);\n      document.body.removeChild(ta);\n      return ok;\n    }\n  };\n\n  const shareQuote = async () =&gt; {\n    const text = `${quote.content} — ${quote.author}`;\n    if (navigator.share) {\n      try {\n        await navigator.share({ title: &#x27;Цитата дня&#x27;, text });\n        setMessage(&#x27;Отправлено через системный Share API&#x27;);\n        return;\n      } catch (e) { /* пользователь отменил */ }\n    }\n    const ok = await copyText(text);\n    setMessage(ok ? &#x27;✅ Цитата скопирована в буфер обмена&#x27; : &#x27;❌ Не удалось скопировать&#x27;);\n  };\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Цитата дня&lt;/h2&gt;\n      &lt;div className=&quot;quote fade&quot; key={quote._id}&gt;\n        &lt;div className=&quot;quote-text&quot;&gt;«{quote.content}»&lt;/div&gt;\n        &lt;div className=&quot;quote-author&quot;&gt;— {quote.author}&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;quote-actions&quot;&gt;\n        &lt;button className=&quot;rbtn&quot; onClick={shareQuote}&gt;📋 Поделиться&lt;/button&gt тменил */ }\n    }\n    const ok = await copyText(text);\n    setMessage(ok ? '✅ Цитата скопирована в буфер обмена' : '❌ Не удалось скопировать');\n  };\n\n  return (\n    <div className=\"card\">\n      <h2>Цитата дня<\/h2>\n      <div className=\"quote fade\" key={quote._id}>\n        <div className=\"quote-text\">«{quote.content}»<\/div>\n        <div className=\"quote-author\">— {quote.author}<\/div>\n      <\/div>\n      <div className=\"quote-actions\">\n        <button className=\"rbtn\" onClick={shareQuote}>📋 Поделиться<\/button>\n        <button className=\"rbtn gray\" onClick={() => setIndex((index + 1) % QUOTES.length)}>Другая цитата<\/button>\n      <\/div>\n      <p className=\"muted\" style={{ marginTop: 10 }}>{message}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: выбор количества цитат", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР30 • Зад.2 • React: выбор количества цитат<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;borde &#x27;]\n];\n\nconst QUOTES = ALL.map(([content, author], i) =&gt; ({ _id: &#x27;q&#x27; + i, content, author }));\n\nfunction fetchQuotes(limit) {\n  return new Promise(resolve =&gt; setTimeout(() =&gt; resolve(QUOTES.slice(0, limit)), 250));\n}\n\nfunction App() {\n  const [count, setCount] = useState(1);\n  const [quotes, setQuotes] = useState([]);\n  const [loading, setLoading] = useState(false);\n\n  const load = async (limit) =&gt; {\n    setLoading(true);\n    const results = await fetchQuotes(limit);\n    setQuotes(results);\n    setLoading(false);\n  };\n\n  useEffect(() =&gt; { load(count); }, []);\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Несколько цитат&lt;/h2&gt;\n      &lt;div className=&quot;row&quot;&gt;\n        &lt;select value={count} onChange={(e) =&gt; setCount(Number(e.target.value))}&gt;\n          {[1, 3, 5, 10].map(n =&gt; &lt;option key={n} value={n}&gt;{n} {n === 1 ? &#x27;цитата&#x27; : &#x27;цитат&#x27;}&lt;/option&gt;)}\n        &lt;/select&gt;\n        &lt;button className=&quot;rbtn&quot; onClick={() =&gt; load(count)} disabled={loading}&gt;{loading ? &#x27;Загрузка...&#x27; : &#x27;Загрузить&#x27;}&lt;/button&gt;\n      &lt;/div&gt;\n      {quotes.map(q =&gt; (\n        &lt;div className=&quot;quote fade&quot; key={q._id}&gt;\n          &lt;div className=&quot;quote-text&quot;&gt;«{q.content}»&lt;/div&gt;\n          &lt;div className=&quot;quote-author&quot;&gt;— {q.author}&lt;/div&gt;\n        &lt;/div&gt;\n      ))}\n      &lt;p className=&quot;muted&quot;&gt;Загружено цитат: {quotes.length}&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState, useEffect } = React;\n\nconst ALL = [\n  ['Мы то, что мы делаем постоянно.', 'Аристотель'],\n  ['Единственный способ сделать великую работу — любить то, что делаешь.', 'Стив Джобс'],\n  ['Жизнь — это то, что происходит с тобой, пока ты строишь планы.', 'Джон Леннон'],\n  ['Успех — это способность идти от неудачи к неудаче, не теряя энтузиазма.', 'Уинстон Черчилль'],\n  ['Знание — сила.', 'Фрэнсис Бэкон'],\n  ['Сложнее всего начать действовать, всё остальное зависит только от упорства.', 'Амелия Эрхарт'],\n  ['Всё, что мы видим, — лишь точка зрения.', 'Анаис Нин'],\n  ['Будь тем изменением, которое хочешь видеть в мире.', 'Махатма Ганди'],\n  ['Воображение важнее знания.', 'Альберт Эйнштейн'],\n  ['Счастье зависит от нас самих.', 'Аристотель']\n];\n\nconst QUOTES = ALL.map(([content, author], i) => ({ _id: 'q' + i, content, author }));\n\nfunction fetchQuotes(limit) {\n  return new Promise(resolve => setTimeout(() => resolve(QUOTES.slice(0, limit)), 250));\n}\n\nfunction App() {\n  const [count, setCount] = useState(1);\n  const [quotes, setQuotes] = useState([]);\n  const [loading, setLoading] = useState(false);\n\n  const load = async (limit) => {\n    setLoading(true);\n    const results = await fetchQuotes(limit);\n    setQuotes(results);\n    setLoading(false);\n  };\n\n  useEffect(() => { load(count); }, []);\n\n  return (\n    <div className=\"card\">\n      <h2>Несколько цитат<\/h2>\n      <div className=\"row\">\n        <select value={count} onChange={(e) => setCount(Number(e.target.value))}>\n          {[1, 3, 5, 10].map(n => <option key={n} value={n}>{n} {n === 1 ? 'цитата' : 'цитат'}<\/option>)}\n        <\/select>\n        <button className=\"rbtn\" onClick={() => load(count)} disabled={loading}>{loading ? 'Загрузка...' : 'Загрузить'}<\/button>\n      <\/div>\n      {quotes.map(q => (\n        <div className=\"quote fade\" key={q._id}>\n          <div className=\"quote-text\">«{q.content}»<\/div>\n          <div className=\"quote-author\">— {q.author}<\/div>\n        <\/div>\n      ))}\n      <p className=\"muted\">Загружено цитат: {quotes.length}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: поиск по авторам", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР30 • Зад.3 • React: поиск по авторам<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-r fadeIn .35s ease both}\n@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР30 • Зад.3<\/span>\n<h1>React: поиск по авторам<\/h1>\n<div class=\"desc\">Задание 3: при вводе текста показываются подходящие авторы; по клику загружается цитата автора.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState } = React;\n\nconst ALL = [\n  { _id: &#x27;1&#x27;, content: &#x27;Мы то, что мы делаем постоянно.&#x27;, author: &#x27;Аристотель&#x27; },\n  { _id: &#x27;2&#x27;, content: &#x27;Счастье зависит от нас самих.&#x27;, author: &#x27;Аристотель&#x27; },\n  { _id: &#x27;3&#x27;, content: &#x27;Воображение важнее знания.&#x27;, author: &#x27;Альберт Эйнштейн&#x27; },\n  { _id: &#x27;4&#x27;, content: &#x27;Успех — это способность идти от неудачи к неудаче.&#x27;, author: &#x27;Уинстон Черчилль&#x27; },\n  { _id: &#x27;5&#x27;, content: &#x27;Знание — сила.&#x27;, author: &#x27;Фрэнсис Бэкон&#x27; },\n  { _id: &#x27;6&#x27;, content: &#x27;Будь тем изменением, которое хочешь видеть в мире.&#x27;, author: &#x27;Махатма Ганди&#x27; }\n];\n\nconst AUTHORS = [...new Set(ALL.map(q =&gt; q.author))];\n\nfunction searchAuthors(query) {\n  const lower = query.toLowerCase();\n  return AUTHORS.filter(a =&gt; a.toLowerCase().includes(lower))\n    .map(name =&gt; ({ name, quoteCount: ALL.filter(q =&gt; q.author === name).length }));\n}\n\nfunction App() {\n  const [author, setAuthor] = useState(&#x27;&#x27;);\n  const [suggestions, setSuggestions] = useState([]);\n  const [quote, setQuote] = useState(null);\n\n  const onChange = (value) =&gt; {\n    setAuthor(value);\n    setSuggestions(value.trim().length &gt;= 2 ? searchAuthors(value.trim()) : []);\n  };\n\n  const pick = (name) =&gt; {\n    setAuthor(name);\n    setSuggestions([]);\n    setQuote(ALL.find(q =&gt; q.author === name));\n  };\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Поиск по авторам&lt;/h2&gt;\n      &lt;div className=&quot;rel&quot;&gt;\n        &lt;input value={author} onChange={(e) =&gt; onChange(e.target.value)} placeholder=&quot;Начните вводить автора...&quot; style={{ width: &#x27;100%&#x27; }} /&gt;\n        {suggestions.length &gt; 0 &amp;&amp; (\n          &lt;div className=&quot;suggest&quot;&gt;\n            {suggestions.map(s =&gt; (\n              &lt;div key={s.name} onClick={() =&gt; pick(s.name)}&gt;{s.name} ({s.quoteCount} цитат)&lt;/div&gt;\n            ))}\n          &lt;/div&gt;\n        )}\n      &lt;/div&gt;\n      {quote &amp;&amp; (\n        &lt;div className=&quot;quote fade&quot; style={{ marginTop: 14 }}&gt;\n          &lt;div className=&quot;quote-text&quot;&gt;«{quote.content}»&lt;/div&gt;\n          &lt;div className=&quot;quote-author&quot;&gt;— {quote.author}&lt;/div&gt;\n        &lt;/div&gt;\n      )}\n      &lt;p className=&quot;muted&quot; style={{ marginTop: 10 }}&gt;Минимум 2 символа для подсказок&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst ALL = [\n  { _id: '1', content: 'Мы то, что мы делаем постоянно.', author: 'Аристотель' },\n  { _id: '2', content: 'Счастье зависит от нас самих.', author: 'Аристотель' },\n  { _id: '3', content: 'Воображение важнее знания.', author: 'Альберт Эйнштейн' },\n  { _id: '4', content: 'Успех — это способность идти от неудачи к неудаче.', author: 'Уинстон Черчилль' },\n  { _id: '5', content: 'Знание — сила.', author: 'Фрэнсис Бэкон' },\n  { _id: '6', content: 'Будь тем изменением, которое хочешь видеть в мире.', author: 'Махатма Ганди' }\n];\n\nconst AUTHORS = [...new Set(ALL.map(q => q.author))];\n\nfunction searchAuthors(query) {\n  const lower = query.toLowerCase();\n  return AUTHORS.filter(a => a.toLowerCase().includes(lower))\n    .map(name => ({ name, quoteCount: ALL.filter(q => q.author === name).length }));\n}\n\nfunction App() {\n  const [author, setAuthor] = useState('');\n  const [suggestions, setSuggestions] = useState([]);\n  const [quote, setQuote] = useState(null);\n\n  const onChange = (value) => {\n    setAuthor(value);\n    setSuggestions(value.trim().length >= 2 ? searchAuthors(value.trim()) : []);\n  };\n\n  const pick = (name) => {\n    setAuthor(name);\n    setSuggestions([]);\n    setQuote(ALL.find(q => q.author === name));\n  };\n\n  return (\n    <div className=\"card\">\n      <h2>Поиск по авторам<\/h2>\n      <div className=\"rel\">\n        <input value={author} onChange={(e) => onChange(e.target.value)} placeholder=\"Начните вводить автора...\" style={{ width: '100%' }} />\n        {suggestions.length > 0 && (\n          <div className=\"suggest\">\n            {suggestions.map(s => (\n              <div key={s.name} onClick={() => pick(s.name)}>{s.name} ({s.quoteCount} цитат)<\/div>\n            ))}\n          <\/div>\n        )}\n      <\/div>\n      {quote && (\n        <div className=\"quote fade\" style={{ marginTop: 14 }}>\n          <div className=\"quote-text\">«{quote.content}»<\/div>\n          <div className=\"quote-author\">— {quote.author}<\/div>\n        <\/div>\n      )}\n      <p className=\"muted\" style={{ marginTop: 10 }}>Минимум 2 символа для подсказок<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: избранные цитаты", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР30 • Зад.4 • React: избранные цитаты<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.quote{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin:10px 0;position:relative}\n.quote-text{font-size:16px;line-height:1.6;font-style:italic}\n.quote-author{margin-top:8px;color:#64748b;font-size:14px;text-align:right}\n.quote-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}\n.suggest{position:absolute;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:5;max-height:220px;overflow:auto;min-width:240px}\n.suggest div{padding:8px 12px;cursor:pointer;font-size:14px}\n.suggest div:hover{background:#eef6ff}\n.rel{position:relative}\n.fade{animation:fadeIn .35s ease both}\n@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР30 • Зад.4<\/span>\n<h1>React: избранные цитаты<\/h1>\n<div class=\"desc\">Задание 4: кнопка «⭐» добавляет цитату в избранное, список хранится в <code>localStorage<\/code>, повторное нажатие удаляет цитату.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState, useEffect } = React;\n\nconst QUOTES = [\n  { _id: &#x27;q1&#x27;, content: &#x27;Мы то, что мы делаем постоянно.&#x27;, author: &#x27;Аристотель&#x27; },\n  { _id: &#x27;q2&#x27;, content: &#x27;Единственный способ сделать великую работу — любить то, что делаешь.&#x27;, author: &#x27;Стив Джобс&#x27; },\n  { _id: &#x27;q3&#x27;, content: &#x27;Жизнь — это то, что происходит с тобой, пока ты строишь планы.&#x27;, author: &#x27;Джон Леннон&#x27; }\n];\n\nfunction App() {\n  const [favorites, setFavorites] = useState(() =&gt; {\n    try { return JSON.parse(localStorage.getItem(&#x27;pr30_favorites&#x27;) || &#x27;[]&#x27;); }\n    catch (e) { return []; }\n  });\n\n  useEffect(() =&gt; {\n    localStorage.setItem(&#x27;pr30_favorites&#x27;, JSON.stringify(favorites));\n  }, [favorites]);\n\n  const toggleFavorite = (quote) =&gt; {\n    const isFavorite = favorites.some(f =&gt; f._id === quote._id);\n    setFavorites(isFavorite ? favorites.filter(f =&gt; f._id !== quote._id) : [...favorites, quote]);\n  };\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Цитаты и избранное&lt;/h2&gt;\n      {QUOTES.map(q =&gt; (\n        &lt;div className=&quot;quote&quot; key={q._id}&gt;\n          &lt;div className=&quot;quote-text&quot;&gt;«{q.content}»&lt;/div&gt;\n          &lt;div className=&quot;quote-author&quot;&gt;— {q.author}&lt;/div&gt;\n          &lt;div className=&quot;quote-actions&quot;&gt;\n            &lt;button className=&quot;rbtn gray&quot; onClick={() =&gt; toggleFavorite(q)}&gt;\n              {favorites.some(f =&gt; f._id === q._id) ? &#x27;⭐ В избранном&#x27; : &#x27;☆ В избранное&#x27;}\n            &lt;/button&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      ))}\n      &lt;h3 style={{ marginTop: 16 }}&gt;Избранное ({favorites.length})&lt;/h3&gt;\n      {favorites.length === 0 &amp;&amp; &lt;p className=&quot;muted&quot;&gt;Пока пусто.&lt;/p&gt;}\n      {favorites.map(q =&gt; (\n        &lt;div className=&quot;item&quot; key={q._id}&gt;\n          &lt;span&gt;«{q.content}» — {q.author}&lt;/span&gt;\n          &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; toggleFavorite(q)}&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n      ))}\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState, useEffect } = React;\n\nconst QUOTES = [\n  { _id: 'q1', content: 'Мы то, что мы делаем постоянно.', author: 'Аристотель' },\n  { _id: 'q2', content: 'Единственный способ сделать великую работу — любить то, что делаешь.', author: 'Стив Джобс' },\n  { _id: 'q3', content: 'Жизнь — это то, что происходит с тобой, пока ты строишь планы.', author: 'Джон Леннон' }\n];\n\nfunction App() {\n  const [favorites, setFavorites] = useState(() => {\n    try { return JSON.parse(localStorage.getItem('pr30_favorites') || '[]'); }\n    catch (e) { return []; }\n  });\n\n  useEffect(() => {\n    localStorage.setItem('pr30_favorites', JSON.stringify(favorites));\n  }, [favorites]);\n\n  const toggleFavorite = (quote) => {\n    const isFavorite = favorites.some(f => f._id === quote._id);\n    setFavorites(isFavorite ? favorites.filter(f => f._id !== quote._id) : [...favorites, quote]);\n  };\n\n  return (\n    <div className=\"card\">\n      <h2>Цитаты и избранное<\/h2>\n      {QUOTES.map(q => (\n        <div className=\"quote\" key={q._id}>\n          <div className=\"quote-text\">«{q.content}»<\/div>\n          <div className=\"quote-author\">— {q.author}<\/div>\n          <div className=\"quote-actions\">\n            <button className=\"rbtn gray\" onClick={() => toggleFavorite(q)}>\n              {favorites.some(f => f._id === q._id) ? '⭐ В избранном' : '☆ В избранное'}\n            <\/button>\n          <\/div>\n        <\/div>\n      ))}\n      <h3 style={{ marginTop: 16 }}>Избранное ({favorites.length})<\/h3>\n      {favorites.length === 0 && <p className=\"muted\">Пока пусто.<\/p>}\n      {favorites.map(q => (\n        <div className=\"item\" key={q._id}>\n          <span>«{q.content}» — {q.author}<\/span>\n          <button className=\"icon-btn\" onClick={() => toggleFavorite(q)}>×<\/button>\n        <\/div>\n      ))}\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: пагинация цитат", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР30 • Зад.5 • React: пагинация цитат<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity ote-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}\n.suggest{position:absolute;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:5;max-height:220px;overflow:auto;min-width:240px}\n.suggest div{padding:8px 12px;cursor:pointer;font-size:14px}\n.suggest div:hover{background:#eef6ff}\n.rel{position:relative}\n.fade{animation:fadeIn .35s ease both}\n@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР30 • Зад.5<\/span>\n<h1>React: пагинация цитат<\/h1>\n<div class=\"desc\">Задание 5: постраничная загрузка (по 3 цитаты) с кнопками «Назад» и «Вперёд» и счётчиком страниц.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState, useEffect } = React;\n\nconst ALL = Array.from({ length: 13 }, (_, i) =&gt; ({\n  _id: &#x27;q&#x27; + i,\n  content: `Цитата №${i + 1}: небольшая мысль, которая иллюстрирует пагинацию.`,\n  author: [&#x27;Аристотель&#x27;, &#x27;Стив Джобс&#x27;, &#x27;Джон Леннон&#x27;, &#x27;Альберт Эйнштейн&#x27;][i % 4]\n}));\nconst LIMIT = 3;\n\nfunction fetchPage(page) {\n  const start = (page - 1) * LIMIT;\n  return new Promise(resolve =&gt; setTimeout(() =&gt; resolve({\n    results: ALL.slice(start, start + LIMIT),\n    totalPages: Math.ceil(ALL.length / LIMIT)\n  }), 200));\n}\n\nfunction App() {\n  const [page, setPage] = useState(1);\n  const [totalPages, setTotalPages] = useState(1);\n  const [quotes, setQuotes] = useState([]);\n  const [loading, setLoading] = useState(false);\n\n  const loadPage = async (pageNum) =&gt; {\n    setLoading(true);\n    const data = await fetchPage(pageNum);\n    setQuotes(data.results);\n    setTotalPages(data.totalPages);\n    setPage(pageNum);\n    setLoading(false);\n  };\n\n  useEffect(() =&gt; { loadPage(1); }, []);\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n  [page, setPage] = useState(1);\n  const [totalPages, setTotalPages] = useState(1);\n  const [quotes, setQuotes] = useState([]);\n  const [loading, setLoading] = useState(false);\n\n  const loadPage = async (pageNum) => {\n    setLoading(true);\n    const data = await fetchPage(pageNum);\n    setQuotes(data.results);\n    setTotalPages(data.totalPages);\n    setPage(pageNum);\n    setLoading(false);\n  };\n\n  useEffect(() => { loadPage(1); }, []);\n\n  return (\n    <div className=\"card\">\n      <h2>Цитаты по страницам<\/h2>\n      {loading && <p className=\"muted\">Загрузка...<\/p>}\n      {quotes.map(q => (\n        <div className=\"quote fade\" key={q._id}>\n          <div className=\"quote-text\">«{q.content}»<\/div>\n          <div className=\"quote-author\">— {q.author}<\/div>\n        <\/div>\n      ))}\n      <div className=\"row\" style={{ justifyContent: 'center' }}>\n        <button className=\"rbtn gray\" onClick={() => loadPage(page - 1)} disabled={page === 1 || loading}>← Назад<\/button>\n        <span style={{ alignSelf: 'center' }}>Страница {page} из {totalPages}<\/span>\n        <button className=\"rbtn\" onClick={() => loadPage(page + 1)} disabled={page === totalPages || loading}>Вперёд →<\/button>\n      <\/div>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: кэширование запросов", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР30 • Зад.6 • React: кэширование запросов<\/title>\n<style>*{margin:0;paddin  {\n      if (i &lt; text.length) {\n        setDisplayText(prev =&gt; prev + text[i]);\n        i++;\n      } else {\n        clearInterval(id);\n      }\n    }, 30);\n    return () =&gt; clearInterval(id);\n  }, [index]);\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;div className=&quot;scene&quot; style={{ background: THEMES[theme].bg }}&gt;\n        &lt;p&gt;\n          «{displayText}&lt;span className=&quot;cursor&quot;&gt;&lt;/span&gt;»\n        &lt;/p&gt;\n        &lt;div className=&quot;author&quot;&gt;— Цитата дня&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;row&quot; style={{ marginTop: 12 }}&gt;\n        &lt;button className=&quot;rbtn&quot; onClick={() =&gt; setIndex((index + 1) % QUOTES.length)}&gt;Следующая цитата&lt;/button&gt;\n        {THEMES.map((t, i) =&gt; (\n          &lt;button key={t.name} className=&quot;rbtn gray&quot; onClick={() =&gt; setTheme(i)}&gt;{t.name}&lt;/button&gt;\n        ))}\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Тема оформления: {THEMES[theme].name}&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState, useEffect } = React;\n\nconst QUOTES = [\n  'Мы то, что мы делаем постоянно. Совершенство — не действие, а привычка.',\n  'Единственный способ сделать великую работу — любить то, что делаешь.',\n  'Жизнь — это то, что происходит с тобой, пока ты строишь планы.'\n];\n\nconst THEMES = [\n  { name: 'Закат', bg: 'linear-gradient(135deg,#ff7e5f,#feb47b)' },\n  { name: 'Океан', bg: 'linear-gradient(135deg,#2193b0,#6dd5ed)' },\n  { name: 'Ночь', bg: 'linear-gradient(135deg,#0f2027,#203a43,#2c5364)' }\n];\n\nfunction App() {\n  const [index, setIndex] = useState(0);\n  const [theme, setTheme] = useState(0);\n  const [displayText, setDisplayText] = useState('');\n\n  useEffect(() => {\n    const text = QUOTES[index];\n    let i = 0;\n    setDisplayText('');\n    const id = setInterval(() => {\n      if (i < text.length) {\n        setDisplayText(prev => prev + text[i]);\n        i++;\n      } else {\n        clearInterval(id);\n      }\n    }, 30);\n    return () => clearInterval(id);\n  }, [index]);\n\n  return (\n    <div className=\"card\">\n      <div className=\"scene\" style={{ background: THEMES[theme].bg }}>\n        <p>\n          «{displayText}<span className=\"cursor\"><\/span>»\n        <\/p>\n        <div className=\"author\">— Цитата дня<\/div>\n      <\/div>\n      <div className=\"row\" style={{ marginTop: 12 }}>\n        <button className=\"rbtn\" onClick={() => setIndex((index + 1) % QUOTES.length)}>Следующая цитата<\/button>\n        {THEMES.map((t, i) => (\n          <button key={t.name} className=\"rbtn gray\" onClick={() => setTheme(i)}>{t.name}<\/button>\n        ))}\n      <\/div>\n      <p className=\"muted\">Тема оформления: {THEMES[theme].name}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
