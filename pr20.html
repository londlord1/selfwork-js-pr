 return digits.replace(/(.{4})/g, &#x27;$1 &#x27;).trim();\n}\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, &#x27;&#x27;);\n  let out = &#x27;&#x27;;\n  for (let i = 0; i &lt; 16; i++) {\n    out += digits[i] || &#x27;•&#x27;;\n    if (i % 4 === 3 &amp;&amp; i &lt; 15) out += &#x27; &#x27;;\n  }\n  return out;\n}\n\nfunction update() {\n  const digits = $(&#x27;number&#x27;).value.replace(/\\D/g, &#x27;&#x27;);\n  const type = getCardType(digits);\n  const info = CARD_INFO[type];\n  $(&#x27;num&#x27;).textContent = maskNumber(digits);\n  $(&#x27;brand&#x27;).textContent = info.icon + &#x27; &#x27; + info.name;\n  $(&#x27;card&#x27;).className = &#x27;card3d &#x27; + type;\n  $(&#x27;holder&#x27;).textContent = ($(&#x27;holder-input&#x27;).value || &#x27;ИМЯ ФАМИЛИЯ&#x27;).toUpperCase();\n  $(&#x27;expiry&#x27;).textContent = $(&#x27;expiry-input&#x27;).value || &#x27;MM/YY&#x27;;\n  $(&#x27;cvv&#x27;).textContent = &#x27;•&#x27;.repeat($(&#x27;cvv-input&#x27;).value.length) || &#x27;•••&#x27;;\n  out(`Префикс: &lt;span class=&quot;hl&quot;&gt;${esc(digits.slice(0, 2) || &#x27;—&#x27;)}&lt;/span&gt; → тип карты: &lt;span class=&quot;ok&quot;&gt;${esc(info.name)}&lt;/span&gt;`);\n}\n\n[&#x27;number&#x27;, &#x27;holder-input&#x27;, &#x27;expiry-input&#x27;, &#x27;cvv-input&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;input&#x27;, update));\n$(&#x27;number&#x27;).addEventListener(&#x27;input&#x27;, function () { this.value = formatNumber(this.value); update(); });\n$(&#x27;expiry-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  const d = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 4);\n  this.value = d.length &gt; 2 ? d.slice(0, 2) + &#x27;/&#x27; + d.slice(2) : d;\n});\n$(&#x27;number&#x27;).value = &#x27;6212 3456 7890 1234&#x27;;\nupdate();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction getCardType(digits) {\n  if (!digits) return 'unknown';\n  if (digits[0] === '4') return 'visa';\n  if (digits.startsWith('62')) return 'unionpay';\n  if (/^5[1-5]/.test(digits)) return 'mastercard';\n  if (/^220[0-4]/.test(digits)) return 'mir';\n  return 'unknown';\n}\n\nconst CARD_INFO = {\n  visa: { icon: '💳', name: 'VISA' },\n  mastercard: { icon: '💳', name: 'MasterCard' },\n  mir: { icon: '💳', name: 'МИР' },\n  unionpay: { icon: '💳', name: 'UnionPay' },\n  unknown: { icon: '💳', name: 'CARD' }\n};\n\nfunction formatNumber(value) {\n  const digits = value.replace(/\\D/g, '').slice(0, 19);\n  return digits.replace(/(.{4})/g, '$1 ').trim();\n}\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, '');\n  let out = '';\n  for (let i = 0; i < 16; i++) {\n    out += digits[i] || '•';\n    if (i % 4 === 3 && i < 15) out += ' ';\n  }\n  return out;\n}\n\nfunction update() {\n  const digits = $('number').value.replace(/\\D/g, '');\n  const type = getCardType(digits);\n  const info = CARD_INFO[type];\n  $('num').textContent = maskNumber(digits);\n  $('brand').textContent = info.icon + ' ' + info.name;\n  $('card').className = 'card3d ' + type;\n  $('holder').textContent = ($('holder-input').value || 'ИМЯ ФАМИЛИЯ').toUpperCase();\n  $('expiry').textContent = $('expiry-input').value || 'MM/YY';\n  $('cvv').textContent = '•'.repeat($('cvv-input').value.length) || '•••';\n  out(`Префикс: <span class=\"hl\">${esc(digits.slice(0, 2) || '—')}<\/span> → тип карты: <span class=\"ok\">${esc(info.name)}<\/span>`);\n}\n\n['number', 'holder-input', 'expiry-input', 'cvv-input'].forEach(id => $(id).addEventListener('input', update));\n$('number').addEventListener('input', function () { this.value = formatNumber(this.value); update(); });\n$('expiry-input').addEventListener('input', function () {\n  const d = this.valu 0; i &lt; 16; i++) {\n    out += digits[i] || &#x27;•&#x27;;\n    if (i % 4 === 3 &amp;&amp; i &lt; 15) out += &#x27; &#x27;;\n  }\n  return out;\n}\n\nlet actualCvv = &#x27;&#x27;;\n\nfunction updateCard() {\n  $(&#x27;holder&#x27;).textContent = ($(&#x27;holder-input&#x27;).value || &#x27;ИМЯ ФАМИЛЯ&#x27;).toUpperCase();\n  $(&#x27;expiry&#x27;).textContent = $(&#x27;expiry-input&#x27;).value || &#x27;MM/YY&#x27;;\n  $(&#x27;cvv&#x27;).textContent = &#x27;•&#x27;.repeat(actualCvv.length) || &#x27;•••&#x27;;\n  const digits = $(&#x27;number&#x27;).value.replace(/\\D/g, &#x27;&#x27;);\n  $(&#x27;num&#x27;).textContent = maskNumber(digits);\n  $(&#x27;brand&#x27;).textContent = &#x27;💳 CARD&#x27;;\n  out(`В поле ввода: &lt;span class=&quot;hl&quot;&gt;${&#x27;•&#x27;.repeat(actualCvv.length) || &#x27;—&#x27;}&lt;/span&gt;\nРеальных цифр сохранено: &lt;span class=&quot;ok&quot;&gt;${actualCvv.length}&lt;/span&gt; (в DOM они не попадают)`);\n}\n\n$(&#x27;cvv-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  actualCvv = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 4);\n  this.value = actualCvv;\n  updateCard();\n});\n\n$(&#x27;number&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  this.value = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 19).replace(/(.{4})/g, &#x27;$1 &#x27;).trim();\n  updateCard();\n});\n[&#x27;holder-input&#x27;, &#x27;expiry-input&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;input&#x27;, updateCard));\n\nfunction revealCvv() {\n  out(`Реальное значение CVV: &lt;span class=&quot;hl&quot;&gt;${esc(actualCvv || &#x27;—&#x27;)}&lt;/span&gt; (хранится только в переменной)`);\n}\n\nfunction clearCvv() {\n  actualCvv = &#x27;&#x27;;\n  $(&#x27;cvv-input&#x27;).value = &#x27;&#x27;;\n  updateCard();\n}\n\nupdateCard();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, '');\n  let out = '';\n  for (let i = 0; i < 16; i++) {\n    out += digits[i] || '•';\n    if (i % 4 === 3 && i < 15) out += ' ';\n  }\n  return out;\n}\n\nlet actualCvv = '';\n\nfunction updateCard() {\n  $('holder').textContent = ($('holder-input').value || 'ИМЯ ФАМИЛЯ').toUpperCase();\n  $('expiry').textContent = $('expiry-input').value || 'MM/YY';\n  $('cvv').textContent = '•'.repeat(actualCvv.length) || '•••';\n  const digits = $('number').value.replace(/\\D/g, '');\n  $('num').textContent = maskNumber(digits);\n  $('brand').textContent = '💳 CARD';\n  out(`В поле ввода: <span class=\"hl\">${'•'.repeat(actualCvv.length) || '—'}<\/span>\nРеальных цифр сохранено: <span class=\"ok\">${actualCvv.length}<\/span> (в DOM они не попадают)`);\n}\n\n$('cvv-input').addEventListener('input', function () {\n  actualCvv = this.value.replace(/\\D/g, '').slice(0, 4);\n  this.value = actualCvv;\n  updateCard();\n});\n\n$('number').addEventListener('input', function () {\n  this.value = this.value.replace(/\\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim();\n  updateCard();\n});\n['holder-input', 'expiry-input'].forEach(id => $(id).addEventListener('input', updateCard));\n\nfunction revealCvv() {\n  out(`Реальное значение CVV: <span class=\"hl\">${esc(actualCvv || '—')}<\/span> (хранится только в переменной)`);\n}\n\nfunction clearCvv() {\n  actualCvv = '';\n  $('cvv-input').value = '';\n  updateCard();\n}\n\nupdateCard();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title" 7;input&#x27;, function () {\n  this.value = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 19).replace(/(.{4})/g, &#x27;$1 &#x27;).trim();\n  $(&#x27;num&#x27;).textContent = maskNumber(this.value);\n  if (this.value.length === 19) {\n    $(&#x27;holder-input&#x27;).focus();\n  }\n});\n\n$(&#x27;holder-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  $(&#x27;holder&#x27;).textContent = (this.value || &#x27;ИМЯ ФАМИЛИЯ&#x27;).toUpperCase();\n});\n\n$(&#x27;expiry-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  const d = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 4);\n  this.value = d.length &gt; 2 ? d.slice(0, 2) + &#x27;/&#x27; + d.slice(2) : d;\n  $(&#x27;expiry&#x27;).textContent = this.value || &#x27;MM/YY&#x27;;\n});\n\n$(&#x27;cvv-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  const d = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 3);\n  this.value = d;\n  $(&#x27;cvv&#x27;).textContent = &#x27;•&#x27;.repeat(d.length) || &#x27;•••&#x27;;\n  if (d.length === 3) $(&#x27;number&#x27;).focus();\n});<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, '');\n  let out = '';\n  for (let i = 0; i < 16; i++) {\n    out += digits[i] || '•';\n    if (i % 4 === 3 && i < 15) out += ' ';\n  }\n  return out;\n}\n\nlet focusLog = [];\n\nfunction noteFocus(field) {\n  focusLog.push(field);\n  out(`Фокус перешёл на: <span class=\"hl\">${esc(field)}<\/span>\nИстория переходов: ${focusLog.map(esc).join(' → ')}`);\n}\n\n['number', 'holder-input', 'expiry-input', 'cvv-input'].forEach(id => {\n  $(id).addEventListener('focus', () => noteFocus(id));\n});\n\n$('number').addEventListener('input', >ИМЯ ФАМИЛИЯ<\/div><\/div>\n      <div><div class=\"lbl\">Срок<\/div><div id=\"expiry\">MM/YY<\/div><\/div>\n      <div><div class=\"lbl\">CVV<\/div><div id=\"cvv\">•••<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"row\">\n  <input id=\"number\" placeholder=\"0000 0000 0000 0000\" maxlength=\"19\" style=\"flex:1;min-width:220px\">\n  <input id=\"holder-input\" placeholder=\"IVAN IVANOV\" style=\"flex:1;min-width:160px\">\n  <input id=\"expiry-input\" placeholder=\"MM/YY\" maxlength=\"5\" style=\"width:100px\">\n  <input id=\"cvv-input\" type=\"password\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"CVV\" maxlength=\"4\" style=\"width:80px\">\n<\/div>\n\n<\/div>\n<div class=\"out\" id=\"out\">Тема: светлая<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">function maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, &#x27;&#x27;);\n  let out = &#x27;&#x27;;\n  for (let i = 0; i &lt; 16; i++) {\n    out += digits[i] || &#x27;•&#x27;;\n    if (i % 4 === 3 &amp;&amp; i &lt; 15) out += &#x27; &#x27;;\n  }\n  return out;\n}\n\nfunction updateCard() {\n  const digits = $(&#x27;number&#x27;).value.replace(/\\D/g, &#x27;&#x27;);\n  $(&#x27;num&#x27;).textContent = maskNumber(digits);\n  $(&#x27;holder&#x27;).textContent = ($(&#x27;holder-input&#x27;).value || &#x27;ИМЯ ФАМИЛИЯ&#x27;).toUpperCase();\n  $(&#x27;expiry&#x27;).textContent = $(&#x27;expiry-input&#x27;).value || &#x27;MM/YY&#x27;;\n  $(&#x27;cvv&#x27;).textContent = &#x27;•&#x27;.repeat($(&#x27;cvv-input&#x27;).value.length) || &#x27;•••&#x27;;\n  $(&#x27;brand&#x27;).textContent = &#x27;💳 CARD&#x27;;\n}\n\nfunction toggleTheme() {\n  const wrap = $(&#x27;form-wrap&#x27;);\n  wrap.classList.toggle(&#x27;dark-theme&#x27;);\n  const dark = wrap.classList.contains(&#x27;dark-theme&#x27;);\n  $(&#x27;theme-toggle&#x27;).textContent = dark ? &#x27;☀️ Светлая тема&#x27; : &#x27;🌙 Тёмная тема&#x27;;\n  out(`Тема: &lt;span class=&quot;hl&quot;&gt;${dark ? &#x27;тёмная&#x27; : &#x27;светлая&#x27;}&lt;/span&gt;`);\n}\n\n[&#x27;number&#x27;, &#x27;holder-input&#x27;, &#x27;expiry-input&#x27;, &#x27;cvv-input&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;input&#x27;, updateCard));\n$(&#x27;number&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  this.value = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 19).replace(/(.{4})/g, &#x27;$1 &#x27;).trim();\n});\n$(&#x27;cvv-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  const d = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 4);\n  this.value = d;\n});\nupdateCard();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, '');\n  let out = '';\n  for (let i = 0; i < 16; i++) {\n    out += digits[i] || '•';\n    if (i % 4 === 3 && i < 15) out += ' ';\n  }\n  return out;\n}\n\nfunction updateCard() {\n  const digits = $('number').value.replace(/\\D/g, '');\n  $('num').textContent = maskNumber(digits);\n  $('holder').textContent = ($('holder-input').value || 'ИМЯ ФАМИЛИЯ').toUpperCase();\n  $('expiry').textContent = $('expiry-input').value || 'MM/YY';\n  $('cvv').textContent = '•'.repeat($('cvv-input').value.length) || '•••';\n  $('brand').textContent = '💳 CARD';\n}\n\nfunction toggleTheme() {\n  const wrap = $('form-wrap');\n  wrap.classList.toggle('dark-theme');\n  const dark = wrap.classList.contains('dark-theme');\n  $('theme-toggle').textContent = dark ? '☀️ Светлая тема' : '🌙 Тёмная тема';\n  out(`Тема: <span class=\"hl\">${dark ? 'тёмная' : 'светлая'}<\/span>`);\n}\n\n['number', 'holder-input', 'expiry-input', 'cvv-input'].forEach(id => $(id).addEventListener('input', updateCard));\n$('number').addEventListener('input', function () {\n  this.value = this.value.replace(/\\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim();\n});\n$('cvv-input').addEventListener('input', function () {\n  const d = this.value.replace(/\\D/g, '').slice(0, 4);\n  this.value = d;\n});\nupdateCard();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Сохранение данных в localStorage", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР20 • Зад.5 • Сохранение данных в localStorage<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius gin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.card3d{width:100%;max-width:360px;aspect-ratio:1.586;border-radius:16px;padding:20px;color:#fff;\nbackground:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);box-shadow:0 12px 30px rgba(0,0,0,.25);\ndisplay:flex;flex-direction:column;justify-content:space-between;transition:transform .6s,background .3s;transform-style:preserve-3d}\n.card3d.visa{background:linear-gradient(135deg,#1a1a2e,#0f3460)}\n.card3d.mastercard{background:linear-gradient(135deg,#3a1c1c,#8e2de2)}\n.card3d.mir{background:linear-gradient(135deg,#0f5132,#1e7e34)}\n.card3d.unionpay{background:linear-gradient(135deg,#d52b1e,#b71c1c)}\n.card3d.flip{transform:rotateY(180deg)}\n.card3d .num{font:600 20px/1.4 Consolas,monospace;letter-spacing:2px}\n.card3d .lbl{font-size:10px;letter-spacing:2px;opacity:.7;text-transform:uppercase}\n.card3d .brand{font-size:22px;font-weight:700;text-align:right}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР20 • Зад.5<\/span>\n<h1>Сохранение данных в localStorage<\/h1>\n<div class=\"desc\">Задание 5: введённые данные карты сохраняются в <code>localStorage<\/code> и восстанавливаются после перезагрузки страницы. CVV в хранилище не пишется.<\/div>\n\n<div class=\"row\">\n  <div class=\"card3d\" id=\"card\">\n    <div class=\"row\" style=\"justify-content:space-between;margin:0\">\n      <span class=\"brand\" id=\"brand\">CARD<\/span>\n      <span class=\"brand\" id=\"currency-badge\"><\/span>\n    <\/div>\n    <div>\n      <div class=\"lbl\">Номер карты<\/div>\n      <div class=\"num\" id=\"num\">•••• •••• •••• ••••<\/div>\n    <\/div>\n    <div class=\"row\" style=\"justify-content:space-between;margin:0\">\n      <div><div class=\"lbl\">Владелец<\/div><div id=\"holder\">ИМЯ ФАМИЛИЯ<\/div><\/div>\n      <div><div class=\"lbl\">Срок<\/div><div id=\"expiry\">MM/YY<\/div><\/div>\n      <div><div class=\"lbl\">CVV<\/div><div id=\"cvv\">•••<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"row\">\n  <input id=\"number\" placeholder=\"0000 0000 0000 0000\" maxlength=\"19\" style=\"flex:1;min-width:220px\">\n  <input id=\"holder-input\" placeholder=\"IVAN IVANOV\" style=\"flex:1;min-width:160px\">\n  <input id=\"expiry-input\" placeholder=\"MM/YY\" maxlength=\"5\" style=\"width:100px\">\n  <input id=\"cvv-input\" type=\"password\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"CVV\" maxlength=\"4\" style=\"width:80px\">\n<\/div>\n\n<div class=\"row\">\n  <button class=\"btn green\" onclick=\"saveCardData()\">💾 Сохранить<\/button>\n  <button class=\"btn red\" onclick=\"clearCardData()\">Удалить сохранённое<\/button>\n<\/div>\n<div class=\"out\" id=\"out\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">function maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, &#x27;&#x27;);\n  let out = &#x27;&#x27;;\n  for (let i = 0; i &lt; 16; i++) {\n    out += digits[i] || &#x27;•&#x27;;\n    if (i % 4 === 3 &amp;&amp; i &lt; 15) out += &#x27; &#x27;;\n  }\n  return out;\n}\n\nconst CARD_KEY = &#x27;pr20_cardData&#x27;;\n\nfunction updateCard() {\n  const digits = $(&#x27;number&#x27;).value.replace(/\\D/g, &#x27;&#x27;);\n  $(&#x27;num&#x27;).textContent = maskNumber(digits);\n  $(&#x27;holder&#x27;).textContent = ($(&#x27;holder-input&#x27;).value || &#x27;ИМЯ ФАМИЛИЯ&#x27;).toUpperCase();\n  $(&#x27;expiry&#x27;).textContent = $(&#x27;expiry-input&#x27;).value || &#x27;MM/YY&#x27;;\n  $(&#x27;cvv&#x27;).textContent = &#x27;•&#x27;.repeat($(&#x27;cvv-input&#x27;).value.length) || &#x27;•••&#x27;;\n  $(&#x27;brand&#x27;).textContent = &#x27;💳 CARD&#x27;;\n}\n\nfunction saveCardData() {\n  const data = {\n    number: $(&#x27;number&#x27;).value,\n    holder: $(&#x27;holder-input&#x27;).value,\n    expiry: $(&#x27;expiry-input&#x27;).value\n  };\n  localStorage.setItem(CARD_KEY, JSON.stringify(data));\n  out(`&lt;span class=&quot;ok&quot;&gt;Сохранено в localStorage:&lt;/span&gt; ${esc(JSON.stringify(data))}\n&lt;span class=&quot;muted&quot;&gt;CVV намеренно не сохраняется.&lt;/span&gt;`);\n}\n\nfunction loadCardData() {\n  try {\n    const data = JSON.parse(localStorage.getItem(CARD_KEY) || &#x27;null&#x27;);\n    if (!data) return;\n    $(&#x27;number&#x27;).value = data.number || &#x27;&#x27;;\n    $(&#x27;holder-input&#x27;).value = data.holder || &#x27;&#x27;;\n    $(&#x27;expiry-input&#x27;).value = data.expiry || &#x27;&#x27;;\n    updateCard();\n    out(&#x27;&lt;span class=&quot;ok&quot;&gt;Данные восстановлены из localStorage&lt;/span&gt;&#x27;);\n  } catch (e) {\n    localStorage.removeItem(CARD_KEY);\n  }\n}\n\nfunction clearCardData() {\n  localStorage.removeItem(CARD_KEY);\n  [&#x27;number&#x27;, &#x27;holder-input&#x27;, &#x27;expiry-input&#x27;, &#x27;cvv-input&#x27;].forEach(id =&gt; $(id).value = &#x27;&#x27;);\n  updateCard();\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;Сохранённые данные удалены&lt;/span&gt;&#x27;);\n}\n\n[&#x27;number&#x27;, &#x27;holder-input&#x27;, &#x27;expiry-input&#x27;, &#x27;cvv-input&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;input&#x27;, updateCard));\n$(&#x27;number&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  this.value = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 19).replace(/(.{4})/g, &#x27;$1 &#x27;).trim();\n});\nloadCardData();\nupdateCard();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, '');\n  let out = '';\n  for (let i = 0; i < 16; i++) {\n    out += digits[i] || '•';\n    if (i % 4 === 3 && i < 15) out += ' ';\n  }\n  return out;\n}\n\nconst CARD_KEY = 'pr20_cardData';\n\nfunction updateCard() {\n  const digits = $('number').value.replace(/\\D/g, '');\n  $('num').textContent = maskNumber(digits);\n  $('holder').textContent = ($('holder-input').value || 'ИМЯ ФАМИЛИЯ').toUpperCase();\n  $('expiry').textContent = $('expiry-input').value || 'MM/YY';\n  $('cvv').textContent = '•'.repeat($('cvv-input').value.length) || '•••';\n  $('brand').textContent = '💳 CARD';\n}\n\nfunction saveCardData() {\n  const data = {\n    number: $('number').value,\n    holder: $('holder-input').value,\n    expiry: $('expiry-input').value\n  };\n  localStorage.setItem(CARD_KEY, JSON.stringify(data));\n  out(`<span class=\"ok\">Сохранено в localStorage:<\/span> ${esc(JSON.stringify(data))}\n<span class=\"muted\">CVV намеренно не сохраняется.<\/span>`);\n}\n\nfunction loadCardData() {\n  try {\n    const data = JSON.parse(localStorage.getItem(CARD_KEY) || 'null');\n    if (!data) return;\n    $('number').value = data.number || '';\n    $('holder-input').value = data.holder || '';\n    $('expiry-input').value = data.expiry || '';\n    updateCard();\n    out('<span class=\"ok\">Данные восстановлены из localStorage<\/span>');\n  } catch (e) {\n    localStorage.removeItem(CARD_KEY);\n  }\n}\n\nfunction clearCardData() {\n  localStorage.removeItem(CARD_KEY);\n  ['number', 'holder-input', 'expiry-input', 'cvv-input'].forEach(id => $(id).value = '');\n  updateCard();\n  out('<span class=\"ok\">Сохранённые данные удалены<\/span>');\n}\n\n['number', 'holder-input', 'expiry-input', 'cvv-input'].forEach(id => $(id).addEventListener('input', updateCard));\n$('number').addEventListener('input', function () {\n  this.value = this.value.replace(/\\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim();\n});\nloadCardData();\nupdateCard();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Поддержка нескольких валют", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР20 • Зад.6 • Поддержка нескольких валют<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoratio ht}\n\n.card3d{transform-style:preserve-3d;perspective:1000px}\n#card:hover{transform:rotateY(12deg) rotateX(6deg) scale(1.02)}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР20 • Зад.7<\/span>\n<h1>3D-анимация карточки<\/h1>\n<div class=\"desc\">Задание 7: карточка поворачивается в 3D при наведении и переворачивается на 180° по кнопке (показывает «оборот» с CVV).<\/div>\n\n<div class=\"row\">\n  <button class=\"btn\" onclick=\"flip()\">🔄 Перевернуть карточку<\/button>\n  <button class=\"btn gray\" onclick=\"reset()\">Сброс<\/button>\n<\/div>\n\n<div class=\"row\">\n  <div class=\"card3d\" id=\"card\">\n    <div class=\"row\" style=\"justify-content:space-between;margin:0\">\n      <span class=\"brand\" id=\"brand\">CARD<\/span>\n      <span class=\"brand\" id=\"currency-badge\"><\/span>\n    <\/div>\n    <div>\n      <div class=\"lbl\">Номер карты<\/div>\n      <div class=\"num\" id=\"num\">•••• •••• •••• ••••<\/div>\n    <\/div>\n    <div class=\"row\" style=\"justify-content:space-between;margin:0\">\n      <div><div class=\"lbl\">Владелец<\/div><div id=\"holder\">ИМЯ ФАМИЛИЯ<\/div><\/div>\n      <div><div class=\"lbl\">Срок<\/div><div id=\"expiry\">MM/YY<\/div><\/div>\n      <div><div class=\"lbl\">CVV<\/div><div id=\"cvv\">•••<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"row\">\n  <input id=\"number\" placeholder=\"0000 0000 0000 0000\" maxlength=\"19\" style=\"flex:1;min-width:220px\">\n  <input id=\"holder-input\" placeholder=\"IVAN IVANOV\" style=\"flex:1;min-width:160px\">\n  <input id=\"expiry-input\" placeholder=\"MM/YY\" maxlength=\"5\" style=\"width:100px\">\n  <input id=\"cvv-input\" type=\"password\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"CVV\" maxlength=\"4\" style=\"width:80px\">\n<\/div>\n\n<div class=\"out\" id=\"out\">Наведите курсор на карточку или нажмите «Перевернуть».<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">function maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, &#x27;&#x27;);\n  let out = &#x27;&#x27;;\n  for (let i = 0; i &lt; 16; i++) {\n    out += digits[i] || &#x27;•&#x27;;\n    if (i % 4 === 3 &amp;&amp; i &lt; 15) out += &#x27; &#x27;;\n  }\n  return out;\n}\n\nlet flipped = false;\n\nfunction flip() {\n  flipped = !flipped;\n  $(&#x27;card&#x27;).classList.toggle(&#x27;flip&#x27;, flipped);\n  out(`Карточка перевёрнута: &lt;span class=&quot;hl&quot;&gt;${flipped ? &#x27;да&#x27; : &#x27;нет&#x27;}&lt;/span&gt;`);\n}\n\nfunction reset() {\n  flipped = false;\n  $(&#x27;card&#x27;).classList.remove(&#x27;flip&#x27;);\n  $(&#x27;card&#x27;).style.transform = &#x27;&#x27;;\n  out(&#x27;Анимация сброшена&#x27;);\n}\n\nfunction updateCard() {\n  const digits = $(&#x27;number&#x27;).value.replace(/\\D/g, &#x27;&#x27;);\n  $(&#x27;num&#x27;).textContent = maskNumber(digits);\n  $(&#x27;holder&#x27;).textContent = ($(&#x27;holder-input&#x27;).value || &#x27;ИМЯ ФАМИЛИЯ&#x27;).toUpperCase();\n  $(&#x27;expiry&#x27;).textContent = $(&#x27;expiry-input&#x27;).value || &#x27;MM/YY&#x27;;\n  $(&#x27;cvv&#x27;).textContent = &#x27;•&#x27;.repeat($(&#x27;cvv-input&#x27;).value.length) || &#x27;•••&#x27;;\n  $(&#x27;brand&#x27;).textContent = &#x27;💳 CARD&#x27;;\n}\n\n[&#x27;number&#x27;, &#x27;holder-input&#x27;, &#x27;expiry-input&#x27;, &#x27;cvv-input&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;input&#x27;, updateCard));\n$(&#x27;number&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  this.value = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 19).replace(/(.{4})/g, &#x27;$1 &#x27;).trim();\n});\n$(&#x27;cvv-input&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  const d = this.value.replace(/\\D/g, &#x27;&#x27;).slice(0, 4);\n  this.value = d;\n});\nupdateCard();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction maskNumber(value) {\n  const digits = String(value).replace(/\\D/g, '');\n  let out = '';\n  for (let i = 0; i < 16; i++) {\n    out += digits[i] || '•';\n    if (i % 4 === 3 && i < 15) out += ' ';\n  }\n  return out;\n}\n\nlet flipped = false;\n\nfunction flip() {\n  flipped = !flipped;\n  $('card').classList.toggle('flip', flipped);\n  out(`Карточка перевёрнута: <span class=\"hl\">${flipped ? 'да' : 'нет'}<\/span>`);\n}\n\nfunction reset() {\n  flipped = false;\n  $('card').classList.remove('flip');\n  $('card').style.transform = '';\n  out('Анимация сброшена');\n}\n\nfunction updateCard() {\n  const digits = $('number').value.replace(/\\D/g, '');\n  $('num').textContent = maskNumber(digits);\n  $('holder').textContent = ($('holder-input').value || 'ИМЯ ФАМИЛИЯ').toUpperCase();\n  $('expiry').textContent = $('expiry-input').value || 'MM/YY';\n  $('cvv').textContent = '•'.repeat($('cvv-input').value.length) || '•••';\n  $('brand').textContent = '💳 CARD';\n}\n\n['number', 'holder-input', 'expiry-input', 'cvv-input'].forEach(id => $(id).addEventListener('input', updateCard));\n$('number').addEventListener('input', function () {\n  this.value = this.value.replace(/\\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim();\n});\n$('cvv-input').addEventListener('input', function () {\n  const d = this.value.replace(/\\D/g, '').slice(0, 4);\n  this.value = d;\n});\nupdateCard();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
</script>
