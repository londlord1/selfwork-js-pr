<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПР26 — React: счётчик (все задания)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.navbtns{display:flex;gap:8px}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px;text-align:center}
.value{font-size:60px;font-weight:700;color:#1a73e8;line-height:1.1;margin:8px 0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.rbtn{padding:10px 16px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}
.rbtn.green{background:#28a745}.rbtn.red{background:#dc3545}.rbtn.gray{background:#64748b}
.rbtn:disabled{opacity:.45;cursor:not-allowed}
input{padding:8px 10px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;width:140px;text-align:center}
input:focus{border-color:#1a73e8;outline:none}
.progress{height:18px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;transition:width .3s,background .3s}
.hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.hist span{background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:4px 10px;font-size:13px}
.muted{color:#64748b;font-size:13px;margin-top:8px}
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="topnav">
  <a href="index.html">« Все практические</a>
  <div class="navbtns"><button class="btn" onclick="location.href='pr25.html'">← Пред. ПР</button><button class="btn" onclick="location.href='pr27.html'">След. ПР →</button></div>
</div>
<span class="pr-tag">ПР26</span>
<h1>ПР26 — React: счётчик кликов (все задания)</h1>
<div class="desc">Один счётчик со всеми заданиями: кнопка ×2, произвольное число, история изменений, настраиваемый шаг и прогресс-бар (0–20).</div>
<div id="root"></div>
</div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const MAX = 20;

function App() {
  const [count, setCount] = useState(0);
  const [step, setStep] = useState(1);
  const [inputValue, setInputValue] = useState('');
  const [history, setHistory] = useState([0]);

  const setValue = (v) => {
    const next = Math.max(0, Math.min(MAX, v));
    setCount(next);
    setHistory((h) => [...h.slice(-14), next]);
  };

  const progress = (count / MAX) * 100;

  return (
    <div className="card">
      <div className="value">{count} <span style={{fontSize:22,color:'#94a3b8'}}>/ {MAX}</span></div>

      <div className="btn-row">
        <button className="rbtn green" disabled={count >= MAX} onClick={() => setValue(count + step)}>+{step}</button>
        <button className="rbtn red" disabled={count <= 0} onClick={() => setValue(count - step)}>−{step}</button>
        <button className="rbtn" onClick={() => setValue(count * 2)}>×2</button>
        <button className="rbtn gray" onClick={() => { setValue(0); setHistory([0]); }}>Сброс</button>
      </div>

      <div className="btn-row">
        <button className="rbtn gray" onClick={() => setStep(Math.max(1, step - 1))}>Шаг −1</button>
        <span style={{alignSelf:'center',fontSize:14}}>Шаг: <b>{step}</b></span>
        <button className="rbtn gray" onClick={() => setStep(step + 1)}>Шаг +1</button>
      </div>

      <div style={{marginTop:10}}>
        <input type="number" value={inputValue} placeholder="Введите число"
          onChange={(e) => { setInputValue(e.target.value); setValue(Number(e.target.value) || 0); }} />
      </div>

      <div className="progress"><div style={{width: progress + '%', backgroundColor: count > 15 ? '#f44336' : '#4CAF50'}} /></div>
      <p className="muted">{count >= MAX ? 'Достигнут максимум — «+» заблокирована' : 'Осталось: ' + (MAX - count)}</p>

      <h3 style={{marginTop:14,fontSize:15}}>История изменений:</h3>
      <div className="hist">{history.map((v, i) => <span key={i}>{v}</span>)}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
