>\n  <\/div>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const KEY = &#x27;pr25_books&#x27;;\n\nclass LibraryManager {\n  constructor() {\n    this.books = this.loadFromStorage();\n    this.lastSaved = null;\n  }\n\n  loadFromStorage() {\n    try { return JSON.parse(localStorage.getItem(KEY) || &#x27;[]&#x27;); }\n    catch (e) { return []; }\n  }\n\n  addBook(title, author) {\n    this.books.push({ title, author, date: new Date().toISOString() });\n    this.saveToStorage();\n  }\n\n  saveToStorage() {\n    localStorage.setItem(KEY, JSON.stringify(this.books));\n    this.lastSaved = new Date();\n    this.updateSaveIndicator();\n  }\n\n  updateSaveIndicator() {\n    const el = $(&#x27;saved&#x27;);\n    if (!this.lastSaved) { el.textContent = &#x27;ещё не сохранено&#x27;; return; }\n    el.textContent = &#x27;Сохранено в &#x27; + this.lastSaved.toLocaleTimeString(&#x27;ru-RU&#x27;);\n  }\n}\n\nconst library = new LibraryManager();\n\nfunction render() {\n  $(&#x27;books&#x27;).innerHTML = library.books.length\n    ? library.books.map(b =&gt; `&lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.title)}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;${esc(b.author)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;Книг пока нет.&lt;/p&gt;&#x27;;\n}\n\nfunction addBook() {\n  const title = $(&#x27;title&#x27;).value.trim();\n  const author = $(&#x27;author&#x27;).value.trim() || &#x27;Неизвестный автор&#x27;;\n  if (!title) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Введите название&lt;/span&gt;&#x27;); return; }\n  library.addBook(title, author);\n  $(&#x27;title&#x27;).value = &#x27;&#x27;;\n  $(&#x27;author&#x27;).value = &#x27;&#x27;;\n  render();\n  out(`&lt;span class=&quot;ok&quot;&gt;Книга добавлена и сохранена&lt;/span&gt;`);\n}\n\nfunction resetAll() {\n  localStorage.removeItem(KEY);\n  library.books = [];\n  library.lastSaved = null;\n  library.updateSaveIndicator();\n  render();\n  out(&#x27;Хранилище очищено&#x27;);\n}\n\nrender();\nlibrary.updateSaveIndicator();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst KEY = 'pr25_books';\n\nclass LibraryManager {\n  constructor() {\n    this.books = this.loadFromStorage();\n    this.lastSaved = null;\n  }\n\n  loadFromStorage() {\n    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }\n    catch (e) { return []; }\n  }\n\n  addBook(title, author) {\n    this.books.push({ title, author, date: new Date().toISOString() });\n    this.saveToStorage();\n  }\n\n  saveToStorage() {\n    localStorage.setItem(KEY, JSON.stringify(this.books));\n    this.lastSaved = new Date();\n    this.updateSaveIndicator();\n  }\n\n  updateSaveIndicator() {\n    const el = $('saved');\n    if (!this.lastSaved) { el.textContent = 'ещё не сохранено'; return; }\n    el.textContent = 'Сохранено в ' + this.lastSaved.toLocaleTimeString('ru-RU');\n  }\n}\n\nconst library = new LibraryManager();\n\nfunction render() {\n  $('books').innerHTML = library.books.length\n    ? library.books.map(b => `<div class=\"book\"><b>${esc(b.title)}<\/b><div class=\"meta\">${esc(b.author)}<\/div><\/div>`).join('')\n    : '<p class=\"muted\">Книг пока нет.<\/p>';\n}\n\nfunction addBook() {\n  const title = $('title').value.trim();\n  const author = $('author').value.trim() || 'Неизвестный автор';\n  if (!title) { out('<span class=\"err\">Введите название<\/span>'); return; }\n  library.addBook(title, author);\n  $('title').value = '';\n  $('author').value = '';\n  render();\n  out(`<span class=\"ok\">Книга добавлена и сохранена<\/span>`);\n}\n\nfunction resetAll() {\n  localStorage.removeItem(KEY);\n  library.books = [];\n  library.lastSaved = null;\n  library.updateSaveIndicator();\n  render();\n  out('Хранилище очищено');\n}\n\nrender();\nlibrary.updateSaveIndicator();\n\n<\/script>\n<script>\n(function () {\n  var index = 0;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Отмена последнего действия (Undo)", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР25 • Зад.2 • Отмена последнего действия (Undo)<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card ывает на одно действие назад.<\/div>\n\n<div class=\"card\">\n  <div class=\"status-line\">\n    <b>Книги<\/b>\n    <span class=\"saved\" id=\"saved\">история: 1 состояние<\/span>\n  <\/div>\n  <div class=\"row\">\n    <input id=\"title\" placeholder=\"Название новой книги\" style=\"flex:1;min-width:220px\">\n    <button class=\"btn green\" onclick=\"addBook()\">Добавить<\/button>\n    <button class=\"btn orange\" onclick=\"undo()\">↩ Отменить<\/button>\n    <button class=\"btn red\" onclick=\"resetAll()\">Сброс<\/button>\n  <\/div>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const KEY = &#x27;pr25_books_undo&#x27;;\n\nclass LibraryManager {\n  constructor() {\n    this.books = [];\n    this.history = [];\n    this.historyIndex = -1;\n    this.loadFromStorage();\n    if (this.history.length === 0) this.saveToStorage();\n  }\n\n  loadFromStorage() {\n    try {\n      const data = JSON.parse(localStorage.getItem(KEY) || &#x27;null&#x27;);\n      if (data &amp;&amp; Array.isArray(data.books)) {\n        this.books = data.books;\n        this.history = data.history || [data.books];\n        this.historyIndex = typeof data.historyIndex === &#x27;number&#x27; ? data.historyIndex : this.history.length - 1;\n      }\n    } catch (e) { /* ignore */ }\n  }\n\n  saveToStorage() {\n    localStorage.setItem(KEY, JSON.stringify({\n      books: this.books,\n      history: this.history,\n      historyIndex: this.historyIndex\n    }));\n  }\n\n  snapshot() {\n    const copy = JSON.parse(JSON.stringify(this.books));\n    this.history = this.history.slice(0, this.historyIndex + 1);\n    this.history.push(copy);\n    this.historyIndex = this.history.length - 1;\n    this.saveToStorage();\n  }\n\n  addBook(title) {\n    this.books.push({ title });\n    this.snapshot();\n  }\n\n  removeBook(index) {\n    this.books.splice(index, 1);\n    this.snapshot();\n  }\n\n  undo() {\n    if (this.historyIndex &gt; 0) {\n      this.historyIndex--;\n      this.books = JSON.parse(JSON.stringify(this.history[this.historyIndex]));\n      this.saveToStorage();\n      return true;\n    }\n    return false;\n  }\n\n  reset() {\n    this.books = [];\n    this.history = [];\n    this.historyIndex = -1;\n    this.snapshot();\n  }\n}\n\nconst library = new LibraryManager();\n\nfunction render() {\n  $(&#x27;books&#x27;).innerHTML = library.books.length\n    ? library.books.map((b, i) =&gt; `&lt;div class=&quot;item&quot;&gt;&lt;span&gt;${esc(b.title)}&lt;/span&gt;&lt;button class=&quot;btn red&quot; onclick=&quot;removeBook(${i})&quot;&gt;×&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;Книг нет.&lt;/p&gt;&#x27;;\n  $(&#x27;saved&#x27;).textContent = `история: ${library.history.length} состояний, текущее #${library.historyIndex + 1}`;\n}\n\nfunction addBook() {\n  const title = $(&#x27;title&#x27;).value.trim();\n  if (!title) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Введите название&lt;/span&gt;&#x27;); return; }\n  library.addBook(title);\n  $(&#x27;title&#x27;).value = &#x27;&#x27;;\n  render();\n  out(`&lt;span class=&quot;ok&quot;&gt;Добавлено:&lt;/span&gt; ${esc(title)}`);\n}\n\nfunction removeBook(index) {\n  library.removeBook(index);\n  render();\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;Удалено, можно отменить&lt;/span&gt;&#x27;);\n}\n\nfunction undo() {\n  const ok = library.undo();\n  render();\n  out(ok ? &#x27;&lt;span class=&quot;ok&quot;&gt;Последнее действие отменено&lt;/span&gt;&#x27; : &#x27;&lt;span class=&quot;err&quot;&gt;Отменять больше нечего&lt;/span&gt;&#x27;);\n}\n\nfunction resetAll() {\n  library.reset();\n  render();\n  out(&#x27;Библиотека сброшена&#x27;);\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst KEY = 'pr25_books_undo';\n\nclass LibraryManager {\n  constructor() {\n    this.books = [];\n    this.history = [];\n    this.historyIndex = -1;\n    this.loadFromStorage();\n    if (this.history.length === 0) this.saveToStorage();\n  }\n\n  loadFromStorage() {\n    try {\n      const data = JSON.parse(localStorage.getItem(KEY) || 'null');\n      if (data && Array.isArray(data.books)) {\n        this.books = data.books;\n        this.history = data.history || [data.books];\n        this.historyIndex = typeof data.historyIndex === 'number' ? data.historyIndex : this.history.length - 1;\n      }\n    } catch (e) { /* ignore */ }\n  }\n\n  saveToStorage() {\n    localStorage.setItem(KEY, JSON.stringify({\n      books: this.books,\n      history: this.history,\n      historyIndex: this.historyIndex\n    }));\n  }\n\n  snapshot() {\n    const copy = JSON.parse(JSON.stringify(this.books));\n    this.history = this.history.slice(0, this.historyIndex + 1);\n    this.history.push(copy);\n    this.historyIndex = this.history.length - 1;\n    this.saveToStorage();\n  }\n\n  addBook(title) {\n    this.books.push({ title });\n    this.snapshot();\n  }\n\n  removeBook(index) {\n    this.books.splice(index, 1);\n    this.snapshot();\n  }\n\n  undo() {\n    if (this.historyIndex > 0) {\n      this.historyIndex--;\n      this.books = JSON.parse(JSON.stringify(this.history[this.historyIndex]));\n      this.saveToStorage();\n      return true;\n    }\n    return false;\n  }\n\n  reset() {\n    this.books = [];\n    this.history = [];\n    this.historyIndex = -1;\n    this.snapshot();\n  }\n}\n\nconst library = new LibraryManager();\n\nfunction render() {\n  $('books').innerHTML = library.books.length\n    ? library.books.map((b, i) => `<div class=\"item\"><span>${esc(b.title)}<\/span><button class=\"btn red\" onclick=\"removeBook(${i})\">×<\/button><\/div>`).join('')\n    : '<p class=\"muted\">Книг нет.<\/p>';\n  $('saved').textContent = `история: ${library.history.length} состояний, текущее #${library.historyIndex + 1}`;\n}\n\nfunction addBook() {\n  const title = $('title').value.trim();\n  if (!title) { out('<span class=\"err\">Введите название<\/span>'); return; }\n  library.addBook(title);\n  $('title').value = '';\n  render();\n  out(`<span class=\"ok\">Добавлено:<\/span> ${esc(title)}`);\n}\n\nfunction removeBook(index) {\n  library.removeBook(index);\n  render();\n  out('<span class=\"ok\">Удалено, можно отменить<\/span>');\n}\n\nfunction undo() {\n  const ok = library.undo();\n  render();\n  out(ok ? '<span class=\"ok\">Последнее действие отменено<\/span>' : '<span class=\"err\">Отменять больше нечего<\/span>');\n}\n\nfunction resetAll() {\n  library.reset();\n  render();\n  out('Библиотека сброшена');\n}\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Синхронизация между вкладками", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР25 • Зад.3 • Синхронизация между вкладками<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{backgr d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.book{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #1a73e8;border-radius:10px;padding:12px 14px;margin:8px 0}\n.book b{color:#0f172a}\n.book .meta{font-size:13px;color:#64748b;margin-top:4px}\n.stars{color:#f59e0b;letter-spacing:1px}\n\n.saved{font-size:13px;color:#16a34a;background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:6px 12px;display:inline-block}\n.status-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР25 • Зад.3<\/span>\n<h1>Синхронизация между вкладками<\/h1>\n<div class=\"desc\">Задание 3: событие <code>storage<\/code> — при изменении данных в одной вкладке вторая вкладка перезагружает данные. Откройте страницу во втором окне и добавьте книгу.<\/div>\n\n<div class=\"card\">\n  <div class=\"status-line\">\n    <b>Синхронизация localStorage<\/b>\n    <span class=\"saved\" id=\"saved\">вкладка активна<\/span>\n  <\/div>\n  <div class=\"row\">\n    <input id=\"title\" placeholder=\"Название книги\" style=\"flex:1;min-width:220px\">\n    <button class=\"btn green\" onclick=\"addBook()\">Добавить<\/button>\n    <button class=\"btn\" onclick=\"openSecondTab()\">Открыть вторую вкладку<\/button>\n    <button class=\"btn red\" onclick=\"resetAll()\">Сброс<\/button>\n  <\/div>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\">Измените данные в другой вкладке — эта обновится автоматически.<\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const KEY = &#x27;pr25_sync_books&#x27;;\n\nfunction load() {\n  try { return JSON.parse(localStorage.getItem(KEY) || &#x27;[]&#x27;); }\n  catch (e) { return []; }\n}\n\nfunction save(books) {\n  localStorage.setItem(KEY, JSON.stringify(books));\n}\n\nfunction render(books = load()) {\n  $(&#x27;books&#x27;).innerHTML = books.length\n    ? books.map(b =&gt; `&lt;div class=&quot;book&quot;&gt;&lt;b&gt;${esc(b.title)}&lt;/b&gt;&lt;div class=&quot;meta&quot;&gt;${b.date ? new Date(b.date).toLocaleTimeString(&#x27;ru-RU&#x27;) : &#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;Книг нет.&lt;/p&gt;&#x27;;\n}\n\nfunction addBook() {\n  const title = $(&#x27;title&#x27;).value.trim();\n  if (!title) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Введите название&lt;/span&gt;&#x27;); return; }\n  const books = load();\n  books.push({ title, date: new Date().toISOString() });\n  save(books);\n  $(&#x27;title&#x27;).value = &#x27;&#x27;;\n  render(books);\n  out(`&lt;span class=&quot;ok&quot;&gt;Добавлено:&lt;/span&gt; ${esc(title)} &lt;span class=&quot;muted&quot;&gt;(вкладка 1)&lt;/span&gt;`);\n}\n\nfunction resetAll() {\n  localStorage.removeItem(KEY);\n  render([]);\n  out(&#x27;Данные очищены&#x27;);\n}\n\nfunction openSecondTab() {\n  window.open(location.href, &#x27;_blank&#x27;);\n  out(&#x27;Открыта вторая вкладка. Добавляйте книги в любой из них.&#x27;);\n}\n\nwindow.addEventListener(&#x27;storage&#x27;, (e) =&gt; {\n  if (e.key === KEY) {\n    render(load());\n    $(&#x27;saved&#x27;).textContent = &#x27;обновлено из другой вкладки&#x27;;\n    out(`&lt;span class=&quot;ok&quot;&gt;🔄 Данные синхронизированы с другой вкладки&lt;/span&gt;\nНовых записей: ${load().length}`);\n  }\n});\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst KEY = 'pr25_sync_books';\n\nfunction load() {\n  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }\n  catch (e) { return []; }\n}\n\nfunction save(books) {\n  localStorage.setItem(KEY, JSON.stringify(books));\n}\n\nfunction render(books = load()) {\n  $('books').innerHTML = books.length\n    ? books.map(b => `<div class=\"book\"><b>${esc(b.title)}<\/b><div class=\"meta\">${b.date ? new Date(b.date).toLocaleTimeString('ru-RU') : ''}<\/div><\/div>`).join('')\n    : '<p class=\"muted\">Книг нет.<\/p>';\n}\n\nfunction addBook() {\n  const title = $('title').value.trim();\n  if (!title) { out('<span class=\"err\">Введите название<\/span>'); return; }\n  const books = load();\n  books.push({ title, date: new Date().toISOString() });\n  save(books);\n  $('title').value = '';\n  render(books);\n  out(`<span class=\"ok\">Добавлено:<\/span> ${esc(title)} <span class=\"muted\">(вкладка 1)<\/span>`);\n}\n\nfunction resetAll() {\n  localStorage.removeItem(KEY);\n  render([]);\n  out('Данные очищены');\n}\n\nfunction openSecondTab() {\n  window.open(location.href, '_blank');\n  out('Открыта вторая вкладка. Добавляйте книги в любой из них.');\n}\n\nwindow.addEventListener('storage', (e) => {\n  if (e.key === KEY) {\n    render(load());\n    $('saved').textContent = 'обновлено из другой вкладки';\n    out(`<span class=\"ok\">🔄 Данные синхронизированы с другой вкладки<\/span>\nНовых записей: ${load().length}`);\n  }\n});\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Избранные книги", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР25 • Зад.4 • Избранные книги<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.book{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #1a73e8;border-radius:10px;padding:12px 14px;margin:8px 0}\n.book b{color:#0f172a}\n.book .meta{font-size:13px;color:#64748b;margin-top:4px}\n.stars{color:#f59e0b;letter-spacing:1px}\n\n.saved{font-size:13px;color:#16a34a;background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:6px 12px;display:inline-block}\n.status-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР25 • Зад.4<\/span>\n<h1>Избранные книги<\/h1>\n<div class=\"desc\">Задание 4: свойство <code>isFavorite<\/code>, переключатель «⭐» и отдельный фильтр «Избранное». Состояние сохраняется в <code>localStorage<\/code>.<\/div>\n\n<div class=\"card\">\n  <div class=\"row\">\n    <button class=\"pill active\" id=\"f-all\" onclick=\"setFilter('all')\">Все книги<\/button>\n    <button class=\"pill\" id=\"f-fav\" onclick=\"setFilter('fav')\">⭐ Избранное<\/button>\n  <\/div>\n  <div id=\"books\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const KEY = &#x27;pr25_favorites&#x27;;\nlet filter = &#x27;all&#x27;;\n\nconst DEFAULT_BOOKS = [\n  { title: &#x27;Война и мир&#x27;, author: &#x27;Л. Н. Толстой&#x27;, isFavorite: false },\n  { title: &#x27;Мастер и Маргарита&#x27;, author: &#x27;М. А. Булгаков&#x27;, isFavorite: true },\n  { title: &#x27;Дюна&#x27;, author: &#x27;Ф. Герберт&#x27;, isFavorite: false },\n  { title: &#x27;Пикник на обочине&#x27;, author: &#x27;А. и Б. Стругацкие&#x27;, isFavorite: true }\n];\n\nfunction load() {\n  try { return JSON.parse(localStorage.getItem(KEY) || &#x27;null&#x27;) || JSON.parse(JSON.stringify(DEFAULT_BOOKS)); }\n  catch (e) { return JSON.parse(JSON.stringify(DEFAULT_BOOKS)); }\n}\n\nlet books = load();\n\nfunction save() { localStorage.setItem(KEY, JSON.stringify(books)); }\n\nfunction render() {\n  const list = filter === &#x27;fav&#x27; ? books.filter(b =&gt; b.isFavorite) : books;\n  $(&#x27;books&#x27;).innerHTML = list.length\n    ? list.map((b) =&gt; `&lt;div class=&quot;book&quot;&gt;\n        &lt;b&gt;${esc(b.title)}&lt;/b&gt; &lt;button class=&quot;btn&quot; style=&quot;padding:4px 10px&quot; onclick=&quot;toggleFavorite(${books.indexOf(b)})&quot;&gt;${b.isFavorite ? &#x27;⭐&#x27; : &#x27;☆&#x27;}&lt;/button&gt;\n        &lt;div class=&quot;meta&quot;&gt;${esc(b.author)}&lt;/div&gt;\n      &lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&lt;p class=&quot;muted&quot;&gt;В избранном пока пусто.&lt;/p&gt;&#x27;;\n  out(`Фильтр: &lt;span class=&quot;hl&quot;&gt;${filter === &#x27;fav&#x27; ? &#x27;Избранное&#x27; : &#x27;Все книги&#x27;}&lt;/span&gt; · показано ${list.length} из ${books.length}`);\n}\n\nfunction toggleFavorite(index) {\n  const b = books[index];\n  if (!b) return;\n  b.isFavorite = !b.isFavorite;\n  save();\n  render();\n}\n\nfunction setFilter(value) {\n  filter = value;\n  $(&#x27;f-all&#x27;).classList.toggle(&#x27;active&#x27;, value === &#x27;all&#x27;);\n  $(&#x27;f-fav&#x27;).classList.toggle(&#x27;active&#x27;, value === &#x27;fav&#x27;);\n  render();\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst KEY = 'pr25_favorites';\nlet filter = 'all';\n\nconst DEFAULT_BOOKS = [\n  { title: 'Война и мир', author: 'Л. Н. Толстой', isFavorite: false },\n  { title: 'Мастер и Маргарита', author: 'М. А. Булгаков', isFavorite: true },\n  { title: 'Дюна', author: 'Ф. Герберт', isFavorite: false },\n  { title: 'Пикник на обочине', author: 'А. и Б. Стругацкие', isFavorite: true }\n];\n\nfunction load() {\n  try { return JSON.parse(localStorage.getItem(KEY) || 'null') || JSON.parse(JSON.stringify(DEFAULT_BOOKS)); }\n  catch (e) { return JSON.parse(JSON.stringify(DEFAULT_BOOKS)); }\n}\n\nlet books = load();\n\nfunction save() { localStorage.setItem(KEY, JSON.stringify(books)); }\n\nfunction render() {\n  const list = filter === 'fav' ? books.filter(b => b.isFavorite) : books;\n  $('books').innerHTML = list.length\n    ? list.map((b) => `<div class=\"book\">\n        <b>${esc(b.title)}<\/b> <button class=\"btn\" style=\"padding:4px 10px\" onclick=\"toggleFavorite(${books.indexOf(b)})\">${b.isFavorite ? '⭐' : '☆'}<\/button>\n        <div class=\"meta\">${esc(b.author)}<\/div>\n      <\/div>`).join('')\n    : '<p class=\"muted\">В избранном пока пусто.<\/p>';\n  out(`Фильтр: <span class=\"hl\">${filter === 'fav' ? 'Избранное' : 'Все книги'}<\/span> · показано ${list.length} из ${books.length}`);\n}\n\nfunction toggleFavorite(index) {\n  const b = books[index];\n  if (!b) return;\n  b.isFavorite = !b.isFavorite;\n  save();\n  render();\n}\n\nfunction setFilter(value) {\n  filter = value;\n  $('f-all').classList.toggle('active', value === 'all');\n  $('f-fav').classList.toggle('active', value === 'fav');\n  render();\n}\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
