\"desc\">Реализуйте функции, которые сохраняют текущее состояние списка задач в localStorage и восстанавливают его при загрузке страницы.<\/div>\n\n<div class=\"card\">\n<div><input id=\"ti10\" placeholder=\"Новая задача...\"><button class=\"btn\" onclick=\"addT10()\">➕<\/button>\n<button class=\"btn orange\" onclick=\"reset10()\">Сброс<\/button><\/div>\n<ul id=\"tl10\" style=\"list-style:none;padding:0\"><\/ul>\n<\/div>\n<div class=\"out\" id=\"out\">Задачи сохраняются в localStorage (переживают перезагрузку). Обновите страницу — список вернётся.<\/div>\n<script>\nconst KEY='pr10_tasks';\nfunction saveT(){localStorage.setItem(KEY,JSON.stringify(tasks10));}\nfunction loadT(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}}\nlet tasks10=loadT();render10();\nfunction addT10(){const v=document.getElementById('ti10').value.trim();if(!v)return;tasks10.push(v);saveT();document.getElementById('ti10').value='';render10();document.getElementById('out').innerHTML='<span class=\"ok\">✅ Сохранено (localStorage):<\/span> '+v;}\nfunction reset10(){tasks10=[];saveT();render10();document.getElementById('out').innerHTML='<span class=\"err\">Состояние очищено<\/span>';}\nfunction render10(){const ul=document.getElementById('tl10');ul.innerHTML='';tasks10.forEach((v,i)=>{const li=document.createElement('li');li.style.cssText='background:#f8f9fa;border-radius:8px;padding:8px 10px;margin:4px 0';li.textContent=(i+1)+'. '+v;ul.appendChild(li);});}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Глубокое клонирование элемента", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset= 0(){document.getElementById('clones10').innerHTML='';document.getElementById('out').innerHTML='Копии удалены';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Анимация появления новых элементов", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР10 • Зад.5 • Анимация появления новых элементов<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР10<\/span>\n<h1>ПР10 • Зад.5 • Анимация появления новых элементов<\/h1>\n<div class=\"desc\">Добавьте CSS-анимацию появления для новых элементов в галерее и списке.<\/div>\n\n<style>@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}\n.anim-in{animation:pop .35s ease}<\/style>\n<div class=\"card\">\n<input id=\"ai10\" placeholder=\"Элемент галереи...\"><button class=\"btn\" onclick=\"addItem10()\">➕ Добавить<\/button>\n<div id=\"gal10\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:12px\"><\/div>\n<\/div>\n<div class=\"out\" id=\"out\">Добавьте элементы — они появляются с CSS-анимацией появления.<\/div>\n<script>\nconst colors=['#667eea','#27ae60','#f39c12','#e74c3c','#9b59b6','#1abc9c'];\nlet c10=0;\nfunction addItem10(){const v=document.getElementById('ai10').value.trim()||('Элемент '+(++c10));document.getElementById('ai10').value='';\nconst d=document.createElement('div');d.className='anim-in';d.style.cssText='background:'+colors[c10%colors.length]+';color:#fff;border-radius:10px;padding:14px 20px;font-weight:bold';\n  d.textContent='🖼️ '+v;document.getElementById('gal10').appendChild(d);document.getElementById('out').innerHTML='<span class=\"ok\">✅ Элемент добавлен<\/span> — появился с анимацией (keyframes pop).';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 4;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
