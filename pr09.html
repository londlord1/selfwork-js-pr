mentById('ctx');\nzone.addEventListener('contextmenu',e=>{e.preventDefault();ctx.style.display='block';ctx.style.left=e.clientX+'px';ctx.style.top=e.clientY+'px';document.getElementById('out').innerHTML='<span class=\"err\">Стандартное меню заблокировано<\/span> → показано кастомное.';});\ndocument.addEventListener('click',()=>ctx.style.display='none');\ndocument.addEventListener('contextmenu',e=>{if(!zone.contains(e.target))ctx.style.display='none';});\nfunction ctxAct(a){document.getElementById('out').innerHTML='<span class=\"ok\">Кастомное меню → <\/span>'+a;ctx.style.display='none';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Drag & Drop (перетаскивание)", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР09 • Зад.2 • Drag & Drop (перетаскивание)<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{displa x;overflow:hidden;border:2px solid #e2e8f0;border-radius:12px\">\n  <div id=\"box\" style=\"position:absolute;left:10px;top:10px;width:80px;height:80px;background:#667eea;border-radius:12px;cursor:grab;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;user-select:none\">DRAG<\/div>\n<\/div>\n<div class=\"out\" id=\"out\">Потяните квадрат мышью.<\/div>\n<script>\nconst box=document.getElementById('box');\nbox.addEventListener('mousedown',e=>{box.style.cursor='grabbing';box.style.border='2px solid #fff';const offX=e.clientX-box.offsetLeft,offY=e.clientY-box.offsetTop;\n function move(ev){box.style.left=(ev.clientX-offX)+'px';box.style.top=(ev.clientY-offY)+'px';}\n function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);box.style.cursor='grab';box.style.border='none';document.getElementById('out').innerHTML='<span class=\"ok\">Квадрат отпущен<\/span> на ('+box.style.left+', '+box.style.top+')';}\n document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);\n});\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Фильтр списка задач", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР09 • Зад.3 • Фильтр списка задач<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;fle \nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР09<\/span>\n<h1>ПР09 • Зад.3 • Фильтр списка задач<\/h1>\n<div class=\"desc\">Добавьте поле ввода, которое фильтрует задачи в списке по мере ввода текста (событие input).<\/div>\n\n<div class=\"card\">\n<input id=\"fi\" placeholder=\"Фильтр задач...\" oninput=\"filterTasks()\">\n<ul id=\"fl\" style=\"list-style:none;padding:0\"><\/ul>\n<\/div>\n<div class=\"out\" id=\"out\">Введите текст для фильтрации списка.<\/div>\n<script>\nconst all=['Изучить события JavaScript','Написать практическую работу','Сделать перерыв','Подготовить отчёт','Загрузить на GitHub'];\nfunction render(list){const ul=document.getElementById('fl');ul.innerHTML='';list.forEach(t=>{const li=document.createElement('li');li.style.cssText='background:#f8f9fa;border-radius:8px;padding:8px 12px;margin:4px 0';li.textContent='☑️ '+t;ul.appendChild(li);});}\nfunction filterTasks(){const q=document.getElementById('fi').value.toLowerCase();const res=all.filter(t=>t.toLowerCase().includes(q));render(res);document.getElementById('out').innerHTML='<span class=\"hl\">Фильтр:<\/span> найдено '+res.length+' из '+all.length; if(!q)document.getElementById('out').innerHTML='<span class=\"hl\">Фильтрация<\/span> по мере ввода (событие input)';}\nrender(all);\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Таймер активности", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР -space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР09<\/span>\n<h1>ПР09 • Зад.4 • Таймер активности<\/h1>\n<div class=\"desc\">Реализуйте таймер, который показывает, сколько времени прошло с последнего действия пользователя (события mousemove и keydown на document).<\/div>\n\n<div class=\"card\">\n<div class=\"out\" id=\"out\" style=\"text-align:center;font-size:18px\">Последнее действие было...<\/div>\n<p style=\"color:#888;font-size:13px;text-align:center\">Подвигайте мышью или нажмите любую клавишу<\/p>\n<\/div>\n<script>\nlet last=new Date().getTime();\nfunction resetTimer(){last=new Date().getTime();document.getElementById('out').innerHTML='<span class=\"ok\">✅ Активность!<\/span> (таймер сброшен)';}\ndocument.addEventListener('mousemove',resetTimer);\ndocument.addEventListener('keydown',resetTimer);\nsetInterval(()=>{const sec=Math.floor((new Date().getTime()-last)/1000);const o=document.getElementById('out');o.innerHTML='⏱️ Прошло бездействия: <span class=\"ok\">'+sec+'<\/span> сек.';},1000);\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
</script>
</body>
</html>
