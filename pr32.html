r:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.people{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}\n.person{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;animation:fadeIn .3s ease both}\n.person b{display:block}\n.person span{font-size:13px;color:#64748b}\n.letters{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}\n.letters button{width:30px;height:30px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}\n.letters button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n@keyframes fadeIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР32 • Зад.4<\/span>\n<h1>React: поиск по нескольким полям<\/h1>\n<div class=\"desc\">Задание 4: массив объектов с полями имя, фамилия, возраст, город. Поиск по всем полям или по выбранному полю.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState } = React;\n\nconst PEOPLE = [\n  { firstName: &#x27;Анна&#x27;, lastName: &#x27;Иванова&#x27;, age: 25, city: &#x27;Москва&#x27; },\n  { firstName: &#x27;Борис&#x27;, lastName: &#x27;Петров&#x27;, age: 30, city: &#x27;Санкт-Петербург&#x27; },\n  { firstName: &#x27;Мария&#x27;, lastName: &#x27;Федорова&#x27;, age: 22, city: &#x27;Москва&#x27; },\n  { firstName: &#x27;Алексей&#x27;, lastName: &#x27;Смирнов&#x27;, age: 41, city: &#x27;Новосибирск&#x27; },\n  { firstName: &#x27;Ирина&#x27;, lastName: &#x27;Соколова&#x27;, age: 35, city: &#x27;Казань&#x27; },\n  { firstName: &#x27;John&#x27;, lastName: &#x27;Smith&#x27;, age: 28, city: &#x27;London&#x27; }\n];\n\nconst FIELDS = [\n  { value: &#x27;all&#x27;, label: &#x27;Все поля&#x27; },\n  { value: &#x27;firstName&#x27;, label: &#x27;Имя&#x27; },\n  { value: &#x27;lastName&#x27;, label: &#x27;Фамилия&#x27; },\n  { value: &#x27;age&#x27;, label: &#x27;Возраст&#x27; },\n  { value: &#x27;city&#x27;, label: &#x27;Город&#x27; }\n];\n\nfunction App() {\n  const [allItems] = useState(PEOPLE);\n  const [searchTerm, setSearchTerm] = useState(&#x27;&#x27;);\n  const [searchField, setSearchField] = useState(&#x27;all&#x27;);\n\n  let result = allItems;\n  if (searchTerm.trim()) {\n    const term = searchTerm.trim().toLowerCase();\n    result = allItems.filter(item =&gt; {\n      if (searchField === &#x27;all&#x27;) {\n        return Object.values(item).some(value =&gt; String(value).toLowerCase().includes(term));\n      }\n      return String(item[searchField]).toLowerCase().includes(term);\n    });\n  }\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Расширенный поиск&lt;/h2&gt;\n      &lt;div className=&quot;row&quot;&gt;\n        &lt;input value={searchTerm} onChange={(e) =&gt; setSearchTerm(e.target.value)} placeholder=&quot;Что ищем?&quot; style={{ flex: 1, minWidth: 200 }} /&gt;\n        &lt;select value={searchField} onChange={(e) =&gt; setSearchField(e.target.value)}&gt;\n          {FIELDS.map(f =&gt; &lt;option key={f.value} value={f.value}&gt;{f.label}&lt;/option&gt;)}\n        &lt;/select&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;people&quot; style={{ marginTop: 12 }}&gt;\n        {result.map(p =&gt; (\n          &lt;div className=&quot;person&quot; key={p.firstName + p.lastName}&gt;\n            &lt;b&gt;{p.firstName} {p.lastName}&lt;/b&gt;\n            &lt;span&gt;{p.age} лет · {p.city}&lt;/span&gt;\n          &lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Найдено: {result.length} из {allItems.length}&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst PEOPLE = [\n  { firstName: 'Анна', lastName: 'Иванова', age: 25, city: 'Москва' },\n  { firstName: 'Борис', lastName: 'Петров', age: 30, city: 'Санкт-Петербург' },\n  { firstName: 'Мария', lastName: 'Федорова', age: 22, city: 'Москва' },\n  { firstName: 'Алексей', lastName: 'Смирнов', age: 41, city: 'Новосибирск' },\n  { firstName: 'Ирина', lastName: 'Соколова', age: 35, city: 'Казань' },\n  { firstName: 'John', lastName: 'Smith', age: 28, city: 'London' }\n];\n\nconst FIELDS = [\n  { value: 'all', label: 'Все поля' },\n  { value: 'firstName', label: 'Имя' },\n  { value: 'lastName', label: 'Фамилия' },\n  { value: 'age', label: 'Возраст' },\n  { value: 'city', label: 'Город' }\n];\n\nfunction App() {\n  const [allItems] = useState(PEOPLE);\n  const [searchTerm, setSearchTerm] = useState('');\n  const [searchField, setSearchField] = useState('all');\n\n  let result = allItems;\n  if (searchTerm.trim()) {\n    const term = searchTerm.trim().toLowerCase();\n    result = allItems.filter(item => {\n      if (searchField === 'all') {\n        return Object.values(item).some(value => String(value).toLowerCase().includes(term));\n      }\n      return String(item[searchField]).toLowerCase().includes(term);\n    });\n  }\n\n  return (\n    <div className=\"card\">\n      <h2>Расширенный поиск<\/h2>\n      <div className=\"row\">\n        <input value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder=\"Что ищем?\" style={{ flex: 1, minWidth: 200 }} />\n        <select value={searchField} onChange={(e) => setSearchField(e.target.value)}>\n          {FIELDS.map(f => <option key={f.value} value={f.value}>{f.label}<\/option>)}\n        <\/select>\n      <\/div>\n      <div className=\"people\" style={{ marginTop: 12 }}>\n        {result.map(p => (\n          <div className=\"person\" key={p.firstName + p.lastName}>\n            <b>{p.firstName} {p.lastName}<\/b>\n            <span>{p.age} лет · {p.city}<\/span>\n          <\/div>\n        ))}\n      <\/div>\n      <p className=\"muted\">Найдено: {result.length} из {allItems.length}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/bo e: &#x27;Мария Федорова&#x27;, age: 22, city: &#x27;Москва&#x27; },\n  { name: &#x27;Алексей Смирнов&#x27;, age: 41, city: &#x27;Новосибирск&#x27; },\n  { name: &#x27;Ирина Соколова&#x27;, age: 35, city: &#x27;Казань&#x27; },\n  { name: &#x27;John Smith&#x27;, age: 28, city: &#x27;Москва&#x27; }\n];\n\nconst FILTERS = [\n  { id: &#x27;young&#x27;, label: &#x27;Моложе 30&#x27; },\n  { id: &#x27;adult&#x27;, label: &#x27;30 и старше&#x27; },\n  { id: &#x27;moscow&#x27;, label: &#x27;Москва&#x27; },\n  { id: &#x27;long&#x27;, label: &#x27;Длинное имя (&gt;10)&#x27; }\n];\n\nfunction App() {\n  const [activeFilters, setActiveFilters] = useState([]);\n\n  const toggleFilter = (id) =&gt; {\n    setActiveFilters(prev =&gt; prev.includes(id) ? prev.filter(f =&gt; f !== id) : [...prev, id]);\n  };\n\n  let result = PEOPLE;\n  if (activeFilters.includes(&#x27;young&#x27;)) result = result.filter(p =&gt; p.age &lt; 30);\n  if (activeFilters.includes(&#x27;adult&#x27;)) result = result.filter(p =&gt; p.age &gt;= 30);\n  if (activeFilters.includes(&#x27;moscow&#x27;)) result = result.filter(p =&gt; p.city === &#x27;Москва&#x27;);\n  if (activeFilters.includes(&#x27;long&#x27;)) result = result.filter(p =&gt; p.name.replace(/\\s/g, &#x27;&#x27;).length &gt; 10);\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Множественные фильтры&lt;/h2&gt;\n      &lt;div className=&quot;row&quot;&gt;\n        {FILTERS.map(f =&gt; (\n          &lt;label key={f.id} className=&quot;pill&quot; style={{ cursor: &#x27;pointer&#x27; }}&gt;\n            &lt;input type=&quot;checkbox&quot; checked={activeFilters.includes(f.id)} onChange={() =&gt; toggleFilter(f.id)} /&gt;\n            {f.label}\n          &lt;/label&gt;\n        ))}\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Активные фильтры: {activeFilters.length ? activeFilters.join(&#x27;, &#x27;) : &#x27;нет&#x27;}&lt;/p&gt;\n      &lt;div className=&quot;people&quot;&gt;\n        {result.map(p =&gt; (\n          &lt;div className=&quot;person&quot; key={p.name}&gt;\n            &lt;b&gt;{p.name}&lt;/b&gt;&lt;span&gt;{p.age} лет · {p.city}&lt;/span&gt;\n          &lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Найдено: {result.length} из {PEOPLE.length}&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst PEOPLE = [\n  { name: 'Анна Иванова', age: 25, city: 'Москва' },\n  { name: 'Борис Петров', age: 30, city: 'Санкт-Петербург' },\n  { name: 'Мария Федорова', age: 22, city: 'Москва' },\n  { name: 'Алексей Смирнов', age: 41, city: 'Новосибирск' },\n  { name: 'Ирина Соколова', age: 35, city: 'Казань' },\n  { name: 'John Smith', age: 28, city: 'Москва' }\n];\n\nconst FILTERS = [\n  { id: 'young', label: 'Моложе 30' },\n  { id: 'adult', label: '30 и старше' },\n  { id: 'moscow', label: 'Москва' },\n  { id: 'long', label: 'Длинное имя (>10)' }\n];\n\nfunction App() {\n  const [activeFilters, setActiveFilters] = useState([]);\n\n  const toggleFilter = (id) => {\n    setActiveFilters(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);\n  };\n\n  let result = PEOPLE;\n  if (activeFilters.includes('young')) result = result.filter(p => p.age < 30);\n  if (activeFilters.includes('adult')) result = result.filter(p => p.age >= 30);\n  if (activeFilters.includes('moscow')) result = result.filter(p => p.city === 'Москва');\n  if (activeFilters.includes('long')) result = result.filter(p => p.name.replace(/\\s/g, '').length > 10);\n\n  return (\n #x27;) + &#x27;&quot;&#x27;).join(&#x27;\\n&#x27;);\n      type = &#x27;text/csv;charset=utf-8&#x27;;\n      ext = &#x27;csv&#x27;;\n    }\n    const blob = new Blob([&#x27;\\ufeff&#x27; + content], { type });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement(&#x27;a&#x27;);\n    a.href = url;\n    a.download = `filtered_results.${ext}`;\n    a.click();\n    URL.revokeObjectURL(url);\n  };\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Экспорт результатов&lt;/h2&gt;\n      &lt;div className=&quot;row&quot;&gt;\n        &lt;input value={query} onChange={(e) =&gt; setQuery(e.target.value)} placeholder=&quot;Фильтр перед экспортом...&quot; style={{ flex: 1, minWidth: 200 }} /&gt;\n        &lt;select value={format} onChange={(e) =&gt; setFormat(e.target.value)}&gt;\n          &lt;option value=&quot;csv&quot;&gt;CSV&lt;/option&gt;\n          &lt;option value=&quot;json&quot;&gt;JSON&lt;/option&gt;\n        &lt;/select&gt;\n        &lt;button className=&quot;rbtn green&quot; onClick={exportResults} disabled={filtered.length === 0}&gt;\n          📥 Экспортировать ({filtered.length})\n        &lt;/button&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;people&quot; style={{ marginTop: 12 }}&gt;\n        {filtered.map(name =&gt; &lt;div className=&quot;person&quot; key={name}&gt;&lt;b&gt;{name}&lt;/b&gt;&lt;/div&gt;)}\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Файл скачивается средствами браузера, сервер не нужен.&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst NAMES = [\"Анна Иванова\", \"Борис Петров\", \"Мария Федорова\", \"Алексей Смирнов\", \"Екатерина Кузнецова\", \"Владимир Попов\", \"Ирина Соколова\", \"Андрей Морозов\", \"Наталья Волкова\", \"Максим Алексеев\"];\n\nfunction App() {\n  const [allItems] = useState(NAMES);\n  const [query, setQuery] = useState('');\n  const [format, setFormat] = useState('csv');\n\n  const filtered = allItems.filter(name => name.toLowerCase().includes(query.trim().toLowerCase()));\n\n  const exportResults = () => {\n    let content, type, ext;\n    if (format === 'json') {\n      content = JSON.stringify(filtered, null, 2);\n      type = 'application/json';\n      ext = 'json';\n    } else {\n      content = 'Имя\\n' + filtered.map(n => '\"' + n.replace(/\"/g, '\"\"') + '\"').join('\\n');\n      type = 'text/csv;charset=utf-8';\n      ext = 'csv';\n    }\n    const blob = new Blob(['\\ufeff' + content], { type });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `filtered_results.${ext}`;\n    a.click();\n    URL.revokeObjectURL(url);\n  };\n\n  return (\n    <div className=\"card\">\n      <h2>Экспорт результатов<\/h2>\n      <div className=\"row\">\n        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder=\"Фильтр перед экспортом...\" style={{ flex: 1, minWidth: 200 }} />\n        <select value={format} onChange={(e) => setFormat(e.target.value)}>\n          <option value=\"csv\">CSV<\/option>\n          <option value=\"json\">JSON<\/option>\n        <\/select>\n        <button className=\"rbtn green\" onClick={exportResults} disabled={filtered.length === 0}>\n          📥 Экспортировать ({filtered.length})\n        <\/button>\n      <\/div>\n      <div className=\"people\" style={{ marginTop: 12 }}>\n        {filtered.map(name => <div className=\"person\" key={name}><b>{name}<\/b><\/div>)}\n      <\/div>\n      <p className=\"muted\">Файл скачивается средствами браузера, сервер не нужен.<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 5;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: анимация при фильтрации", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР32 • Зад.7 • React: анимация при фильтрации<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.people{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}\n.person{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;animation:fadeIn .3s ease both}\n.person b{display:block}\n.person span{font-size:13px;color:#64748b}\n.letters{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}\n.letters button{width:30px;height:30px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}\n.letters button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n@keyframes fadeIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР32 • Зад.7<\/span>\n<h1>React: анимация при фильтрации<\/h1>\n<div class=\"desc\">Задание 7: элементы списка плавно появляются при смене фильтра — CSS-анимация перезапускается за счёт смены <code>key<\/code> у контейнера и элементов.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState } = React;\n\nconst NAMES = [&quot;Анна Иванова&quot;, &quot;Борис Петров&quot;, &quot;Мария Федорова&quot;, &quot;Алексей Смирнов&quot;, &quot;Екатерина Кузнецова&quot;, &quot;Владимир Попов&quot;, &quot;Ирина Соколова&quot;, &quot;Андрей Морозов&quot;, &quot;Наталья Волкова&quot;, &quot;Максим Алексеев&quot;, &quot;Юлия Лебедева&quot;, &quot;Константин Козлов&quot;];\n\nfunction App() {\n  const [query, setQuery] = useState(&#x27;&#x27;);\n  const [lengthFilter, setLengthFilter] = useState(&#x27;all&#x27;);\n\n  let result = NAMES.filter(name =&gt; name.toLowerCase().includes(query.trim().toLowerCase()));\n  if (lengthFilter === &#x27;short&#x27;) result = result.filter(n =&gt; n.replace(/\\s/g, &#x27;&#x27;).length &lt;= 10);\n  if (lengthFilter === &#x27;long&#x27;) result = result.filter(n =&gt; n.replace(/\\s/g, &#x27;&#x27;).length &gt; 10);\n\n  const animationKey = `${query}|${lengthFilter}`;\n\n  return (\n    &lt;div className=&quot;card&quot;&gt;\n      &lt;h2&gt;Анимация фильтрации&lt;/h2&gt;\n      &lt;div className=&quot;row&quot;&gt;\n        &lt;input value={query} onChange={(e) =&gt; setQuery(e.target.value)} placeholder=&quot;Поиск...&quot; style={{ flex: 1, minWidth: 180 }} /&gt;\n        &lt;select value={lengthFilter} onChange={(e) =&gt; setLengthFilter(e.target.value)}&gt;\n          &lt;option value=&quot;all&quot;&gt;Все&lt;/option&gt;\n          &lt;option value=&quot;short&quot;&gt;Короткие (≤10)&lt;/option&gt;\n          &lt;option value=&quot;long&quot;&gt;Длинные (&amp;gt;10)&lt;/option&gt;\n        &lt;/select&gt;\n      &lt;/div&gt;\n      &lt;div className=&quot;people&quot; style={{ marginTop: 12 }} key={animationKey}&gt;\n        {result.map(name =&gt; (\n          &lt;div className=&quot;person&quot; key={animationKey + name}&gt;&lt;b&gt;{name}&lt;/b&gt;&lt;/div&gt;\n        ))}\n      &lt;/div&gt;\n      &lt;p className=&quot;muted&quot;&gt;Элементы появляются заново при каждом изменении фильтра · найдено: {result.length}&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst NAMES = [\"Анна Иванова\", \"Борис Петров\", \"Мария Федорова\", \"Алексей Смирнов\", \"Екатерина Кузнецова\", \"Владимир Попов\", \"Ирина Соколова\", \"Андрей Морозов\", \"Наталья Волкова\", \"Максим Алексеев\", \"Юлия Лебедева\", \"Константин Козлов\"];\n\nfunction App() {\n  const [query, setQuery] = useState('');\n  const [lengthFilter, setLengthFilter] = useState('all');\n\n  let result = NAMES.filter(name => name.toLowerCase().includes(query.trim().toLowerCase()));\n  if (lengthFilter === 'short') result = result.filter(n => n.replace(/\\s/g, '').length <= 10);\n  if (lengthFilter === 'long') result = result.filter(n => n.replace(/\\s/g, '').length > 10);\n\n  const animationKey = `${query}|${lengthFilter}`;\n\n  return (\n    <div className=\"card\">\n      <h2>Анимация фильтрации<\/h2>\n      <div className=\"row\">\n        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder=\"Поиск...\" style={{ flex: 1, minWidth: 180 }} />\n        <select value={lengthFilter} onChange={(e) => setLengthFilter(e.target.value)}>\n          <option value=\"all\">Все<\/option>\n          <option value=\"short\">Короткие (≤10)<\/option>\n          <option value=\"long\">Длинные (&gt;10)<\/option>\n        <\/select>\n      <\/div>\n      <div className=\"people\" style={{ marginTop: 12 }} key={animationKey}>\n        {result.map(name => (\n          <div className=\"person\" key={animationKey + name}><b>{name}<\/b><\/div>\n        ))}\n      <\/div>\n      <p className=\"muted\">Элементы появляются заново при каждом изменении фильтра · найдено: {result.length}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 6;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
