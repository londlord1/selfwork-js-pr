Even()\">getEvenNumbers()<\/button>\n<button class=\"btn green\" onclick=\"runAvg()\">getAverage()<\/button>\n<button class=\"btn orange\" onclick=\"runRev()\">reverseArray()<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<\/div>\n<script>\nconst a=[12,7,23,45,18,31,6,2];\nfunction getEvenNumbers(x){return x.filter(n=>n%2===0);}\nfunction getAverage(x){return x.reduce((s,n)=>s+n,0)/x.length;}\nfunction reverseArray(x){return x.slice().reverse();}\nfunction runEven(){document.getElementById('out').innerHTML='<span class=\"hl\">getEvenNumbers()<\/span> → ['+getEvenNumbers(a).join(', ')+']';}\nfunction runAvg(){document.getElementById('out').innerHTML='<span class=\"hl\">getAverage()<\/span> → <span class=\"ok\">'+getAverage(a).toFixed(2)+'<\/span>';}\nfunction runRev(){document.getElementById('out').innerHTML='<span class=\"hl\">reverseArray()<\/span> → ['+reverseArray(a).join(', ')+']';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 1;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Функции для объектов: имена, фильтр по городу, самый старший", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР04 • Зад.3 • Функции для объектов: имена, фильтр по городу, самый старший<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decor ecoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР04<\/span>\n<h1>ПР04 • Зад.3 • Функции для объектов: имена, фильтр по городу, самый старший<\/h1>\n<div class=\"desc\">Реализуйте: <b>getUserNames(arr)<\/b>, <b>getUsersByCity(arr, city)<\/b>, <b>getOldestUser(arr)<\/b>.<\/div>\n\n<div class=\"card\">\n<label>Город:<\/label><input id=\"city\" value=\"Москва\">\n<button class=\"btn\" onclick=\"runNames()\">getUserNames()<\/button>\n<button class=\"btn green\" onclick=\"runByCity()\">getUsersByCity(city)<\/button>\n<button class=\"btn orange\" onclick=\"runOldest()\">getOldestUser()<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<span hidden id=\"probe\">data<\/span><\/div>\n<script>\nconst U=[{name:'Анна',age:25,city:'Москва'},{name:'Иван',age:30,city:'СПб'},{name:'Мария',age:22,city:'Москва'},{name:'Петр',age:35,city:'Казань'}];\nfunction getUserNames(x){return x.map(u=>u.name);}\nfunction getUsersByCity(x,c){return x.filter(u=>u.city===c);}\nfunction getOldestUser(x){return x.reduce((m,u)=>u.age>m.age?u:m);}\nfunction runNames(){document.getElementById('out').innerHTML=`<span class=\"hl\">getUserNames()<\/span>\n\n${getUserNames(U).join(', ')}`;}\nfunction runByCity(){const c=document.getElementById('city').value;const r=getUsersByCity(U,c);document.getElementById('out').innerHTML=`<span class=\"hl\">getUsersByCity(\"${c}\")<\/span>\n\n${r.length?r.map(u=>`- ${u.name} (${u.age} лет)`).join('\\n'):'— никто не найден'}`;}\nfunction runOldest(){const u=getOldestUser(U);document.getElementById('out').innerHTML=`<span class=\"hl\">getOldestUser()<\/span>\n\nСамый старший: <span class=\"ok\">${u.name}<\/span> — ${u.age} лет (${u.city})`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 2;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Практические: скидка, пароль, погода", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР04 • Зад.4 • Практические: скидка, пароль, погода<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР04<\/span>\n<h1>ПР04 • Зад.4 • Практические: скидка, пароль, погода<\/h1>\n<div class=\"desc\">Реализуйте: <b>calculateDiscount(price, %)<\/b>, <b>isPasswordValid(pass)<\/b> (≥6 символов), <b>getWeatherDescription(temp)<\/b>.<\/div>\n\n<div class=\"card\">\n<label>Цена:<\/label><input id=\"price\" type=\"number\" value=\"2000\">\n<label>Скидка %:<\/label><input id=\"disc\" type=\"number\" value=\"10\"><br>\n<label>Пароль:<\/label><input id=\"pass\" value=\"abc123\">\n<label>Температура:<\/label><input id=\"temp\" type=\"number\" value=\"25\"><br>\n<button class=\"btn\" onclick=\"runDisc()\">calculateDiscount()<\/button>\n<button class=\"btn green\" onclick=\"runPass()\">isPasswordValid()<\/button>\n<button class=\"btn orange\" onclick=\"runWeather()\">getWeatherDescription()<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<\/div>\n<script>\nfunction calculateDiscount(p,d){return p-p*d/100;}\nfunction isPasswordValid(p){return p.length>=6;}\nfunction getWeatherDescription(t){if(t<0)return 'Холодно ❄️';if(t<20)return 'Прохладно 🌤️';if(t<30)return 'Тепло ☀️';return 'Жарко 🔥';}\nfunction num(id){return parseFloat(document.getElementById(id).value);}\nfunction runDisc(){document.getElementById('out').innerHTML='<span class=\"hl\">calculateDiscount('+num('price')+', '+num('disc')+'%)<\/span> = <span class=\"ok\">'+calculateDiscount(num('price'),num('disc'))+'<\/span>';}\nfunction runPass(){const p=document.getElementById('pass').value;document.getElementById('out').innerHTML='<span class=\"hl\">isPasswordValid(\"'+p+'\")<\/span> = '+(isPasswordValid(p)?'<span class=\"ok\">true<\/span>':'<span class=\"err\">false (пароль короче 6 символов)<\/span>');}\nfunction runWeather(){document.getElementById('out').innerHTML='<span class=\"hl\">getWeatherDescription('+num('temp')+')<\/span> = <span class=\"ok\">'+getWeatherDescription(num('temp'))+'<\/span>';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
</body>
</html>
