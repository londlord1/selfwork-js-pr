<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПР12 — Строки и регулярные выражения</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.topnav a:hover{text-decoration:underline}
.navbtns{display:flex;gap:8px;flex-wrap:wrap}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
.navbtns .btn:hover{background:#eef6ff}
.navbtns .btn:disabled{opacity:.4;cursor:default}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.card h2{font-size:17px;color:#333;margin-bottom:10px}
.toc{position:sticky;top:0;z-index:5;background:#f0f2f5;padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e2e8f0;margin-bottom:6px}
.toc b{font-size:13px;color:#475569;margin-right:4px}
.toc a{display:inline-flex;min-width:30px;justify-content:center;background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:3px 9px;text-decoration:none;font-size:13px;color:#0b57d0}
.toc a:hover{background:#eef6ff;border-color:#93c5fd}
.task{margin:20px 0}
.task-head{display:flex;gap:9px;align-items:center;font-weight:600;color:#334155;margin-bottom:8px;font-size:15px}
.task-num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;background:#1a73e8;color:#fff;border-radius:50%;font-size:13px;flex:none}
.task-frame{width:100%;height:620px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;display:block;transition:height .15s ease}
footer{margin-top:24px;font-size:12px;color:#999;text-align:center}
a{color:#0b57d0}
</style>
</head>
<body>
<div class="wrap">
<div class="topnav">
  <a href="index.html">« Все практические</a>
  <div class="navbtns">
    <button class="btn" onclick="location.href='pr11.html'">← Пред. ПР</button>
    <button class="btn" onclick="location.href='pr13.html'">След. ПР →</button>
  </div>
</div>
<span class="pr-tag">ПР12</span>
<h1>ПР12 — Строки и регулярные выражения</h1>
<div class="desc">Все самостоятельные задания этой практической на одной странице — выполняются вместе. Задания идут по порядку, ниже.</div>
<nav class="toc" id="toc"><b>Задания:</b></nav>
<div id="tasks"></div>
<footer>ПР12 · заданий: 1 · <a href="index.html">все практические</a></footer>
</div>
<script>
const TASKS = [{"title": "Генератор хештегов", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР12 • Зад.1 • Генератор хештегов<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР12<\/span>\n<h1>ПР12 • Зад.1 • Генератор хештегов<\/h1>\n<div class=\"desc\">Разработайте приложение «Генератор хештегов»: split/join, map/filter, регистры + валидация (стоп-слова, длина, пустая фраза).<\/div>\n\n<div class=\"card\">\n<label>Фраза:<\/label><input id=\"phrase\" placeholder=\"Лучшие практики JavaScript\" style=\"flex:1;max-width:100%\">\n<button class=\"btn\" onclick=\"generate()\"># Сгенерировать хештег<\/button>\n<\/div>\n<div class=\"card\">\n<button class=\"btn green\" onclick=\"test('Привет мир')\">Тест: «Привет мир»<\/button>\n<button class=\"btn green\" onclick=\"test('лучшие практики JavaScript')\">Тест: «Лучшие практики JS»<\/button>\n<button class=\"btn green\" onclick=\"test('в лесу родилась елочка')\">Тест: стоп-слова<\/button>\n<button class=\"btn green\" onclick=\"test('и на и по с')\">Тест: только предлоги<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Введите фразу и нажмите «Сгенерировать хештег».<\/div>\n<script>\nconst stopWords=['в','и','на','по','с','из','от','для','не','как'];\nfunction buildHashtag(rawInput){\n const cleaned=rawInput.trim().toLowerCase();                     // шаг 1\n const wordsArray=cleaned.split(' ').filter(w=>w.length>0);       // шаг 2\n const meaningful=wordsArray.filter(w=>!stopWords.includes(w));   // шаг 3\n if(meaningful.length===0)return {err:'Невозможно создать хештег. Слишком короткая фраза'};\n const capitalized=meaningful.map(w=>w.charAt(0).toUpperCase()+w.slice(1)); // шаг 4\n const hashtag='#'+capitalized.join('');                          // шаг 5\n const isLong=hashtag.length>20;\n return {hashtag:hashtag, warn:isLong, len:hashtag.length};\n}\nfunction renderResult(r){\n const o=document.getElementById('out');\n if(r.err){o.innerHTML='<span class=\"err\">❌ '+r.err+'<\/span>';return;}\n o.innerHTML=`<span class=\"hl\">Результат:<\/span> <span class=\"ok\">${r.hashtag}<\/span>`+ (r.warn?'<br><span class=\"err\">⚠ Хештег слишком длинный ('+r.len+' симв.)<\/span>':'')+'<br>Длина хештега: '+r.len+' симв.';\n}\nfunction generate(){renderResult(buildHashtag(document.getElementById('phrase').value));}\nfunction test(t){document.getElementById('phrase').value=t;renderResult(buildHashtag(t));}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  var index = 0;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
</body>
</html>
