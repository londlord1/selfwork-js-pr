"ok\">${JSON.stringify(r)}<\/span>\n\nОжидалось: [\"Ноутбук\", \"Монитор\"]`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Подсчёт товаров по категориям (reduce)", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР13 • Зад.2 • Подсчёт товаров по категориям (reduce)<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border :7,name:'Монитор',price:700,quantity:5,category:'tech'}\n];\nfunction countByCategory(){return warehouse.reduce((acc,i)=>{acc[i.category]=(acc[i.category]||0)+1;return acc;},{});}\nfunction runCount(){const r=countByCategory();const o=document.getElementById('out');o.innerHTML=`<span class=\"hl\">reduce → { категория: количество }<\/span>\n\n${Object.entries(r).map(([k,v])=>`• ${k}: <span class=\"ok\">${v}<\/span>`).join('\\n')}\n\nОжидалось: { tech: 4, furniture: 2, lighting: 1 }`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "some / every / findIndex", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР13 • Зад.3 • some / every / findIndex<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px <button class=\"btn orange\" onclick=\"runFind()\">findIndex('Стул')<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Нажмите кнопку.<\/div>\n<script>\nconst warehouse=[\n {id:1,name:'Ноутбук',price:1000,quantity:4,category:'tech'},\n {id:2,name:'Мышь',price:50,quantity:15,category:'tech'},\n {id:3,name:'Клавиатура',price:80,quantity:10,category:'tech'},\n {id:4,name:'Стол',price:300,quantity:2,category:'furniture'},\n {id:5,name:'Стул',price:150,quantity:8,category:'furniture'},\n {id:6,name:'Лампа',price:40,quantity:20,category:'lighting'},\n {id:7,name:'Монитор',price:700,quantity:5,category:'tech'}\n];\nfunction runSome(){const r=warehouse.some(i=>i.price>2000);document.getElementById('out').innerHTML=`<span class=\"hl\">some(price>2000)<\/span> = <span class=\"${r?'ok':'err'}\">${r}<\/span>\n\nЕсть ли товар дороже 2000 ₽?`;}\nfunction runEvery(){const r=warehouse.every(i=>i.price<2000);document.getElementById('out').innerHTML=`<span class=\"hl\">every(price<2000)<\/span> = <span class=\"${r?'ok':'err'}\">${r}<\/span>\n\nВсе ли товары дешевле 2000 ₽?`;}\nfunction runFind(){const idx=warehouse.findIndex(i=>i.name.toLowerCase()==='стул');document.getElementById('out').innerHTML=`<span class=\"hl\">findIndex(\"Стул\")<\/span> = <span class=\"ok\">${idx}<\/span>\n\nЭлемент на индексе ${idx}: «${warehouse[idx].name}»`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
</script>
