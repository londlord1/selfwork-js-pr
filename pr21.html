rsor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.service{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;transition:.2s}\n.service:hover{border-color:#1a73e8;background:#eef6ff}\n.service.active{border-color:#1a73e8;box-shadow:0 0 0 2px #c7d2fe}\n.badge-status{font-size:12px;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985}\n.badge-status.done{background:#dcfce7;color:#166534}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР21 • Зад.1<\/span>\n<h1>Новая услуга в каталоге<\/h1>\n<div class=\"desc\">Задание 1: в <code>servicesDB<\/code> добавлена услуга «Запись к врачу» с описанием, статусом, списком поликлиник и количеством свободных слотов.<\/div>\n\n<div class=\"card\">\n  <h2>Вход через Госуслуги<\/h2>\n  <div class=\"row\">\n    <input id=\"login\" placeholder=\"Логин\" value=\"user123\" style=\"min-width:150px\">\n    <input id=\"password\" placeholder=\"Пароль\" type=\"password\" value=\"password\" style=\"min-width:150px\">\n    <button class=\"btn\" onclick=\"login()\">Войти<\/button>\n    <span id=\"auth-status\" class=\"muted\">не авторизован<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Каталог услуг<\/h2>\n  <div id=\"services\"><\/div>\n  <div class=\"out\" id=\"out\">Выберите услугу.<\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">let authorized = false;\n\nconst servicesDB = {\n  passport: {\n    name: &#x27;Замена паспорта&#x27;,\n    description: &#x27;Замена паспорта гражданина РФ по достижении 20 или 45 лет&#x27;,\n    status: &#x27;доступно&#x27;,\n    offices: [&#x27;МФЦ Центральный&#x27;, &#x27;МФЦ Северный&#x27;],\n    free_slots: 8\n  },\n  doctor: {\n    name: &#x27;Запись к врачу&#x27;,\n    description: &#x27;Запись на приём к врачу через электронную регистратуру&#x27;,\n    status: &#x27;доступно&#x27;,\n    clinics: [&#x27;Поликлиника №1&#x27;, &#x27;Поликлиника №2&#x27;],\n    free_slots: 15\n  },\n  driver: {\n    name: &#x27;Замена водительского удостоверения&#x27;,\n    description: &#x27;Замена водительского удостоверения по истечении срока действия&#x27;,\n    status: &#x27;доступно&#x27;,\n    offices: [&#x27;МРЭО ГИБДД №1&#x27;],\n    free_slots: 4\n  }\n};\n\nfunction renderServices() {\n  $(&#x27;services&#x27;).innerHTML = Object.entries(servicesDB).map(([id, s]) =&gt; `\n    &lt;div class=&quot;service&quot; onclick=&quot;showService(&#x27;${id}&#x27;)&quot; id=&quot;svc-${id}&quot;&gt;\n      &lt;b&gt;${esc(s.name)}&lt;/b&gt;\n      &lt;span class=&quot;badge-status&quot;&gt;${esc(s.status)}&lt;/span&gt;\n      &lt;div class=&quot;muted&quot;&gt;Свободных слотов: ${s.free_slots}&lt;/div&gt;\n    &lt;/div&gt;`).join(&#x27;&#x27;);\n}\n\nfunction login() {\n  authorized = $(&#x27;login&#x27;).value === &#x27;user123&#x27; &amp;&amp; $(&#x27;password&#x27;).value === &#x27;password&#x27;;\n  $(&#x27;auth-status&#x27;).textContent = authorized ? &#x27;авторизован&#x27; : &#x27;не авторизован&#x27;;\n  $(&#x27;auth-status&#x27;).className = authorized ? &#x27;ok&#x27; : &#x27;muted&#x27;;\n  out(authorized ? &#x27;&lt;span class=&quot;ok&quot;&gt;Вход выполнен&lt;/span&gt;&#x27; : &#x27;&lt;span class=&quot;err&quot;&gt;Неверный логин или пароль&lt;/span&gt;&#x27;);\n}\n\nfunction showService(id) {\n :.2s}\n.service:hover{border-color:#1a73e8;background:#eef6ff}\n.service.active{border-color:#1a73e8;box-shadow:0 0 0 2px #c7d2fe}\n.badge-status{font-size:12px;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985}\n.badge-status.done{background:#dcfce7;color:#166534}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР21 • Зад.2<\/span>\n<h1>Отображение статуса заявок<\/h1>\n<div class=\"desc\">Задание 2: при выборе услуги показывается не только описание, но и статус заявки из <code>historyDB<\/code>, если заявка по этой услуге уже есть.<\/div>\n\n<div class=\"card\">\n  <h2>Вход через Госуслуги<\/h2>\n  <div class=\"row\">\n    <input id=\"login\" placeholder=\"Логин\" value=\"user123\" style=\"min-width:150px\">\n    <input id=\"password\" placeholder=\"Пароль\" type=\"password\" value=\"password\" style=\"min-width:150px\">\n    <button class=\"btn\" onclick=\"login()\">Войти<\/button>\n    <span id=\"auth-status\" class=\"muted\">не авторизован<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Услуги и статус заявок<\/h2>\n  <div id=\"services\"><\/div>\n  <div class=\"out\" id=\"out\">Выберите услугу.<\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">let authorized = false;\n\nconst servicesDB = {\n  passport: { name: &#x27;Замена паспорта&#x27;, description: &#x27;Замена паспорта гражданина РФ&#x27;, status: &#x27;доступно&#x27; },\n  doctor: { name: &#x27;Запись к врачу&#x27;, description: &#x27;Запись через электронную регистратуру&#x27;, status: &#x27;доступно&#x27; },\n  benefits: { name: &#x27;Детские выплаты&#x27;, description: &#x27;Ежемесячная выплата на ребёнка&#x27;, status: &#x27;доступно&#x27; }\n};\n\nconst historyDB = [\n  { id: 1, service: &#x27;Замена паспорта&#x27;, date: &#x27;12.10.2026&#x27;, status: &#x27;в обработке&#x27; },\n  { id: 2, service: &#x27;Детские выплаты&#x27;, date: &#x27;01.10.2026&#x27;, status: &#x27;исполнено&#x27; }\n];\n\nfunction renderServices() {\n  $(&#x27;services&#x27;).innerHTML = Object.entries(servicesDB).map(([id, s]) =&gt; {\n    const app = historyDB.find(h =&gt; h.service === s.name);\n    return `&lt;div class=&quot;service&quot; onclick=&quot;showService(&#x27;${id}&#x27;)&quot;&gt;\n      &lt;b&gt;${esc(s.name)}&lt;/b&gt;\n      ${app ? `&lt;span class=&quot;badge-status ${app.status === &#x27;исполнено&#x27; ? &#x27;done&#x27; : &#x27;&#x27;}&quot;&gt;${esc(app.status)}&lt;/span&gt;` : &#x27;&lt;span class=&quot;muted&quot;&gt;заявок нет&lt;/span&gt;&#x27;}\n    &lt;/div&gt;`;\n  }).join(&#x27;&#x27;);\n}\n\nfunction login() {\n  authorized = $(&#x27;login&#x27;).value === &#x27;user123&#x27; &amp;&amp; $(&#x27;password&#x27;).value === &#x27;password&#x27;;\n  $(&#x27;auth-status&#x27;).textContent = authorized ? &#x27;авторизован&#x27; : &#x27;не авторизован&#x27;;\n  $(&#x27;auth-status&#x27;).className = authorized ? &#x27;ok&#x27; : &#x27;muted&#x27;;\n}\n\nfunction showService(id) {\n  const s = servicesDB[id];\n  const apps = historyDB.filter(h =&gt; h.service === s.name);\n  out(`&lt;b&gt;${esc(s.name)}&lt;/b&gt;\n${esc(s.description)}\n\n&lt;span class=&quot;hl&quot;&gt;Заявки по услуге:&lt;/span&gt;\n${apps.length ? apps.map(a =&gt; `№${a.id} от ${a.date} — &lt;span class=&quot;ok&quot;&gt;${esc(a.status)}&lt;/span&gt;`).join(&#x27;\\n&#x27;) : &#x27;Заявок пока нет.&#x27;}`);\n}\n\nrenderServices();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nlet authorized = false;\n\nconst servicesDB = {\n  passport: { name: 'Замена паспорта', description: 'Замена паспорта гражданина РФ', status: 'доступно' },\n  doctor: { name: 'Запись к врачу', description: 'Запись через электронную регистратуру', status: 'доступно' },\n  benefits: { name: 'Детские выплаты', description: 'Ежемесячная выплата на ребёнка', status: 'доступно' }\n};\n\nconst historyDB = [\n  { id: 1, service: 'Замена паспорта', date: '12.10.2026', status: 'в обработке' },\n  { id: 2, service: 'Детские выплаты', date: '01.10.2026', status: 'исполнено' }\n];\n\nfunction renderServices() {\n  $('services').innerHTML = Object.entries(servicesDB).map(([id, s]) => {\n    const app = historyDB.find(h => h.service === s.name);\n    return `<div class=\"service\" onclick=\"showService('${id}')\">\n      <b>${esc(s.name)}<\/b>\n      ${app ? `<span class=\"badge-status ${app.status === 'исполнено' ? 'done' : ''}\">${esc(app.status)}<\/span>` : '<span class=\"muted\">заявок нет<\/span>'}\n    <\/div>`;\n  }).join('');\n}\n\nfunction login() {\n  authorized = $('login').value === 'user123' && $('password').value === 'password';\n  $('auth-status').textContent = authorized ? 'авторизован' : 'не авторизован';\n  $('auth-status').className = authorized ? 'ok' : 'muted';\n}\n\nfunction showService(id) {\n  const s = servicesDB[id];\n  const apps = historyDB.filter(h => h.service === s.name);\n  out(`<b>${esc(s.name)}<\/b>\n${esc(s.description)}\n\n<span class=\"hl\">Заявки по услуге:<\/span>\n${apps.length ? apps.map(a => `№${a.id} от ${a.date} — <span class=\"ok\">${esc(a.status)}<\/span>`).join('\\n') : 'Заявок пока нет.'}`);\n}\n\nrenderServices();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Отправка заявления", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР21 • Зад.3 • Отправка заявления .stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.service{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;transition:.2s}\n.service:hover{border-color:#1a73e8;background:#eef6ff}\n.service.active{border-color:#1a73e8;box-shadow:0 0 0 2px #c7d2fe}\n.badge-status{font-size:12px;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985}\n.badge-status.done{background:#dcfce7;color:#166534}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР21 • Зад.3<\/span>\n<h1>Отправка заявления<\/h1>\n<div class=\"desc\">Задание 3: в деталях услуги есть кнопка «Подать заявление». Проверяется авторизация, запись добавляется в <code>historyDB<\/code>, показывается уведомление об успехе.<\/div>\n\n<div class=\"card\">\n  <h2>Вход через Госуслуги<\/h2>\n  <div class=\"row\">\n    <input id=\"login\" placeholder=\"Логин\" value=\"user123\" style=\"min-width:150px\">\n    <input id=\"password\" placeholder=\"Пароль\" type=\"password\" value=\"password\" style=\"min-width:150px\">\n    <button class=\"btn\" onclick=\"login()\">Войти<\/button>\n    <span id=\"auth-status\" class=\"muted\">не авторизован<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Услуги<\/h2>\n  <div id=\"services\"><\/div>\n  <div id=\"details\"><\/div>\n  <div class=\"out\" id=\"out\">Войдите и выберите услугу.<\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">let authorized = false;\nlet selected = null;\n\nconst servicesDB = {\n  passport: { name: &#x27;Замена паспорта&#x27;, description: &#x27;Замена паспорта гражданина РФ&#x27; },\n  doctor: { name: &#x27;Запись к врачу&#x27;, description: &#x27;Запись через электронную регистратуру&#x27; },\n  benefits: { name: &#x27;Детские выплаты&#x27;, description: &#x27;Ежемесячная выплата на ребёнка&#x27; }\n};\n\nconst historyDB = [\n  { id: 1, service: &#x27;Детские выплаты&#x27;, date: &#x27;01.10.2026&#x27;, status: &#x27;исполнено&#x27; }\n];\n\nfunction renderServices() {\n  $(&#x27;services&#x27;).innerHTML = Object.entries(servicesDB).map(([id, s]) =&gt;\n    `&lt;div class=&quot;service&quot; onclick=&quot;selectService(&#x27;${id}&#x27;)&quot;&gt;&lt;b&gt;${esc(s.name)}&lt;/b&gt;&lt;div class=&quot;muted&quot;&gt;${esc(s.description)}&lt;/div&gt;&lt;/div&gt;`\n  ).join(&#x27;&#x27;);\n}\n\nfunction login() {\n  authorized = $(&#x27;login&#x27;).value === &#x27;user123&#x27; &amp;&amp; $(&#x27;password&#x27;).value === &#x27;password&#x27;;\n  $(&#x27;auth-status&#x27;).textContent = authorized ? &#x27;авторизован&#x27; : &#x27;не авторизован&#x27;;\n  $(&#x27;auth-status&#x27;).className = authorized ? &#x27;ok&#x27; : &#x27;muted&#x27;;\n  if (selected) selectService(selected);\n}\n\nfunction selectService(id) {\n  selected = id;\n  const s = servicesDB[id];\n  $(&#x27;details&#x27;).innerHTML = `\n    &lt;div class=&quot;item&quot;&gt;\n      &lt;div&gt;&lt;b&gt;${esc(s.name)}&lt;/b&gt;&lt;div class=&quot;muted&quot;&gt;${esc(s.description)}&lt;/div&gt;&lt;/div&gt;\n      &lt;button class=&quot;btn green&quot; onclick=&quot;submitApplication(&#x27;${id}&#x27;)&quot;&gt;Подать заявление&lt;/button&gt;\n    &lt;/div&gt;`;\n  out(`Выбрана услуга: &lt;span class=&quot;hl&quot;&gt;${esc(s.name)}&lt;/span&gt;`);\n}\n\nfunction submitApplication(id) {\n  if (!authorized) {\n    out(&#x27;&lt;span class=&quot;err&quot;&gt;Сначала авторизуйтесь через Госуслуги&lt;/span&gt;&#x27;);\n    return;\n  }\n  const app = {\n    id: Date.now(),\n    service: servicesDB[id].name,\n    date: new Date().toLocaleDateString(&#x27;ru-RU&#x27;),\n    status: &#x27;подано&#x27;\n  };\n  historyDB.unshift(app);\n  out(`&lt;span class=&quot;ok&quot;&gt;✅ Заявление подано!&lt;/span&gt;\n${esc(app.service)} · №${app.id} · ${app.date} · статус: ${esc(app.status)}`);\n}\n\nrenderServices();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nlet authorized = false;\nlet selected = null;\n\nconst servicesDB = {\n  passport: { name: 'Замена паспорта', description: 'Замена паспорта гражданина РФ' },\n  doctor: { name: 'Запись к врачу', description: 'Запись через электронную регистратуру' },\n  benefits: { name: 'Детские выплаты', description: 'Ежемесячная выплата на ребёнка' }\n};\n\nconst historyDB = [\n  { id: 1, service: 'Детские выплаты', date: '01.10.2026', status: 'исполнено' }\n];\n\nfunction renderServices() {\n  $('services').innerHTML = Object.entries(servicesDB).map(([id, s]) =>\n    `<div class=\"service\" onclick=\"selectService('${id}')\"><b>${esc(s.name)}<\/b><div class=\"muted\">${esc(s.description)}<\/div><\/div>`\n  ).join('');\n}\n\nfunction login() {\n  authorized = $('login').value === 'user123' && $('password').value === 'password';\n  $('auth-status').textContent = authorized ? 'авторизован' : 'не авторизован';\n  $('auth-status').className = authorized ? 'ok' : 'muted';\n  if (selected) selectService(selected);\n}\n\nfunction selectService(id) {\n  selected = id;\n  const s = servicesDB[id];\n  $('details').innerHTML = `\n    <div class=\"item\">\n      <div><b>${esc(s.name)}<\/b><div class=\"muted\">${esc(s.description)}<\/div><\/div>\n      <button class=\"btn green\" onclick=\"submitApplication('${id}')\">Подать заявление<\/button>\n    <\/div>`;\n  out(`Выбрана услуга: <span class=\"hl\">${esc(s.name)}<\/span>`);\n}\n\nfunction submitApplication(id) {\n  if (!authorized) {\n    out('<span class=\"err\">Сначала авторизуйтесь через Госуслуги<\/span>');\n    return;\n  }\n  const app = {\n    id: Date.now(),\n    service: servicesDB[id].name,\n    date: new Date().toLocaleDateString('ru-RU'),\n    status: 'подано'\n  };\n  historyDB.unshift(app);\n  out(`<span class=\"ok\">✅ Заявление подано!<\/span>\n${esc(app.service)} · №${app.id} · ${app.date} · статус: ${esc(app.status)}`);\n}\n\nrenderServices();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Вход по СНИЛС", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР21 • Зад.4 • Вход по СНИЛС<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.service{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;transition:.2s}\n.service:hover{border-color:#1a73e8;background:#eef6ff}\n.service.active{border-color:#1a73e8;box-shadow:0 0 0 2px #c7d2fe}\n.badge-status{font-size:12px;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985}\n.badge-status.done{background:#dcfce7;color:#166534}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР21 • Зад.4<\/span>\n<h1>Вход по СНИЛС<\/h1>\n<div class=\"desc\">Задание 4: альтернативная форма входа по СНИЛС вместо логина и пароля. Номер проверяется по маске и контрольной сумме (упрощённо — по эталону).<\/div>\n\n<div class=\"card\">\n  <h2>Вход по СНИЛС<\/h2>\n  <div class=\"row\">\n    <input id=\"snils\" placeholder=\"123-456-789 00\" value=\"123-456-789 00\" style=\"min-width:220px\">\n    <button class=\"btn\" onclick=\"loginSnils()\">Войти по СНИЛС<\/button>\n  <\/div>\n  <p class=\"muted\">Эталон для демо: 123-456-789 00<\/p>\n  <div class=\"out\" id=\"out\">Введите СНИЛС.<\/div>\n<\/div>\n<div class=\"card\">\n  <h2>Доступные услуги<\/h2>\n  <div id=\"services\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const ETALON = &#x27;123-456-789 00&#x27;;\nlet authorized = false;\n\nconst services = [&#x27;Замена паспорта&#x27;, &#x27;Запись к врачу&#x27;, &#x27;Детские выплаты&#x27;];\n\nfunction formatSnils(value) {\n  const d = value.replace(/\\D/g, &#x27;&#x27;).slice(0, 11);\n  if (d.length &lt;= 3) return d;\n  if (d.length &lt;= 6) return d.slice(0, 3) + &#x27;-&#x27; + d.slice(3);\n  if (d.length &lt;= 9) return d.slice(0, 3) + &#x27;-&#x27; + d.slice(3, 6) + &#x27;-&#x27; + d.slice(6);\n  return d.slice(0, 3) + &#x27;-&#x27; + d.slice(3, 6) + &#x27;-&#x27; + d.slice(6, 9) + &#x27; &#x27; + d.slice(9);\n}\n\n$(&#x27;snils&#x27;).addEventListener(&#x27;input&#x27;, function () {\n  this.value = formatSnils(this.value);\n});\n\nfunction loginSnils() {\n  const value = $(&#x27;snils&#x27;).value.trim();\n  authorized = value === ETALON;\n  $(&#x27;services&#x27;).innerHTML = authorized\n    ? services.map(s =&gt; `&lt;div class=&quot;item&quot;&gt;&lt;span&gt;${esc(s)}&lt;/span&gt;&lt;span class=&quot;ok&quot;&gt;доступно&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)\n    : &#x27;&#x27;;\n  out(authorized\n    ? &#x27;&lt;span class=&quot;ok&quot;&gt;Авторизация по СНИЛС успешна&lt;/span&gt;&#x27;\n    : &#x27;&lt;span class=&quot;err&quot;&gt;СНИЛС не найден в ЕСИА (для демо: 123-456-789 00)&lt;/span&gt;&#x27;);\n}<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst ETALON = '123-456-789 00';\nlet authorized = false;\n\nconst services = ['Замена паспорта', 'Запись к врачу', 'Детские выплаты'];\n\nfunction formatSnils(value) {\n  const d = value.replace(/\\D/g, '').slice(0, 11);\n  if (d.length <= 3) return d;\n  if (d.length <= 6) return d.slice(0, 3) + '-' + d.slice(3);\n  if (d.length <= 9) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);\n  return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6, 9) + ' ' + d.slice(9);\n}\n\n$('snils').addEventListener('input', function () {\n  this.value = formatSnils(this.value);\n});\n\nfunction loginSnils() {\n  const value = $('snils').value.trim();\n  authorized = value === ETALON;\n  $('services').innerHTML = authorized\n    ? services.map(s => `<div class=\"item\"><span>${esc(s)}<\/span><span class=\"ok\">доступно<\/span><\/div>`).join('')\n    : '';\n  out(authorized\n    ? '<span class=\"ok\">Авторизация по СНИЛС успешна<\/span>'\n    : '<span class=\"err\">СНИЛС не найден в ЕСИА (для демо: 123-456-789 00)<\/span>');\n}\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Личный кабинет пользователя", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-wi enter;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.service{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;transition:.2s}\n.service:hover{border-color:#1a73e8;background:#eef6ff}\n.service.active{border-color:#1a73e8;box-shadow:0 0 0 2px #c7d2fe}\n.badge-status{font-size:12px;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985}\n.badge-status.done{background:#dcfce7;color:#166534}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР21 • Зад.5<\/span>\n<h1>Личный кабинет пользователя<\/h1>\n<div class=\"desc\">Задание 5: блок с личными данными — ФИО, контакты, СНИЛС, паспортные данные и история обращений из <code>userDB<\/code> и <code>historyDB<\/code>.<\/div>\n\n<div class=\"card\">\n  <h2>Вход через Госуслуги<\/h2>\n  <div class=\"row\">\n    <input id=\"login\" placeholder=\"Логин\" value=\"user123\" style=\"min-width:150px\">\n    <input id=\"password\" placeholder=\"Пароль\" type=\"password\" value=\"password\" style=\"min-width:150px\">\n    <button class=\"btn\" onclick=\"login()\">Войти<\/button>\n    <span id=\"auth-status\" class=\"muted\">не авторизован<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"card\" id=\"cabinet\" style=\"display:none\">\n  <h2>Личный кабинет<\/h2>\n  <div id=\"user\"><\/div>\n  <h2 style=\"margin-top:16px\">История обращений<\/h2>\n  <div id=\"history\"><\/div>\n<\/div>\n<div class=\"out\" id=\"out\">Войдите, чтобы увидеть личный кабинет.<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const userDB = {\n  fio: &#x27;Иванов Иван Иванович&#x27;,\n  birth: &#x27;15.03.1990&#x27;,\n  email: &#x27;ivanov@example.ru&#x27;,\n  phone: &#x27;+7 (900) 123-45-67&#x27;,\n  snils: &#x27;123-456-789 00&#x27;,\n  passport: &#x27;45 12 № 345678, выдан ОВД Тверского района 20.04.2010&#x27;\n};\n\nconst historyDB = [\n  { id: 101, service: &#x27;Замена паспорта&#x27;, date: &#x27;12.10.2026&#x27;, status: &#x27;в обработке&#x27; },\n  { id: 102, service: &#x27;Детские выплаты&#x27;, date: &#x27;01.10.2026&#x27;, status: &#x27;исполнено&#x27; },\n  { id: 103, service: &#x27;Запись к врачу&#x27;, date: &#x27;25.09.2026&#x27;, status: &#x27;исполнено&#x27; }\n];\n\nfunction login() {\n  const ok = $(&#x27;login&#x27;).value === &#x27;user123&#x27; &amp;&amp; $(&#x27;password&#x27;).value === &#x27;password&#x27;;\n  $(&#x27;auth-status&#x27;).textContent = ok ? &#x27;авторизован&#x27; : &#x27;не авторизован&#x27;;\n  $(&#x27;auth-status&#x27;).className = ok ? &#x27;ok&#x27; : &#x27;muted&#x27;;\n  if (!ok) {\n    $(&#x27;cabinet&#x27;).style.display = &#x27;none&#x27;;\n    out(&#x27;&lt;span class=&quot;err&quot;&gt;Неверный логин или пароль&lt;/span&gt;&#x27;);\n    return;\n  }\n  $(&#x27;cabinet&#x27;).style.display = &#x27;block&#x27;;\n  $(&#x27;user&#x27;).innerHTML = `\n    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;muted&quot;&gt;ФИО&lt;/span&gt;&lt;b&gt;${esc(userDB.fio)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;muted&quot;&gt;Дата рождения&lt;/span&gt;&lt;b&gt;${esc(userDB.birth)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;muted&quot;&gt;Телефон&lt;/span&gt;&lt;b&gt;${esc(userDB.phone)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;muted&quot;&gt;E-mail&lt;/span&gt;&lt;b&gt;${esc(userDB.email)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;muted&quot;&gt;СНИЛС&lt;/span&gt;&lt;b&gt;${esc(userDB.snils)}&lt;/b&gt;&lt;/div&gt;\n    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;muted&quot;&gt;Паспорт&lt;/span&gt;&lt;b&gt;${esc(userDB.passport)}&lt;/b&gt;&lt;/div&gt;`;\n  $(&#x27;history&#x27;).innerHTML = historyDB.map(h =&gt;\n    `&lt;div class=&quot;item&quot;&gt;&lt;span&gt;№${h.id} · ${esc(h.service)} · ${h.date}&lt;/span&gt;&lt;span class=&quot;badge-status ${h.status === &#x27;исполнено&#x27; ? &#x27;done&#x27; : &#x27;&#x27;}&quot;&gt;${esc(h.status)}&lt;/span&gt;&lt;/div&gt;`\n  ).join(&#x27;&#x27;);\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;Личный кабинет загружен&lt;/span&gt;&#x27;);\n}<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst userDB = {\n  fio: 'Иванов Иван Иванович',\n  birth: '15.03.1990',\n  email: 'ivanov@example.ru',\n  phone: '+7 (900) 123-45-67',\n  snils: '123-456-789 00',\n  passport: '45 12 № 345678, выдан ОВД Тверского района 20.04.2010'\n};\n\nconst historyDB = [\n  { id: 101, service: 'Замена паспорта', date: '12.10.2026', status: 'в обработке' },\n  { id: 102, service: 'Детские выплаты', date: '01.10.2026', status: 'исполнено' },\n  { id: 103, service: 'Запись к врачу', date: '25.09.2026', status: 'исполнено' }\n];\n\nfunction login() {\n  const ok = $('login').value === 'user123' && $('password').value === 'password';\n  $('auth-status').textContent = ok ? 'авторизован' : 'не авторизован';\n  $('auth-status').className = ok ? 'ok' : 'muted';\n  if (!ok) {\n    $('cabinet').style.display = 'none';\n    out('<span class=\"err\">Неверный логин или пароль<\/span>');\n    return;\n  }\n  $('cabinet').style.display = 'block';\n  $('user').innerHTML = `\n    <div class=\"item\"><span class=\"muted\">ФИО<\/span><b>${esc(userDB.fio)}<\/b><\/div>\n    <div class=\"item\"><span class=\"muted\">Дата рождения<\/span><b>${esc(userDB.birth)}<\/b><\/div>\n    <div class=\"item\"><span class=\"muted\">Телефон<\/span><b>${esc(userDB.phone)}<\/b><\/div>\n    <div class=\"item\"><span class=\"muted\">E-mail<\/span><b>${esc(userDB.email)}<\/b><\/div>\n    <div class=\"item\"><span class=\"muted\">СНИЛС<\/span><b>${esc(userDB.snils)}<\/b><\/div>\n    <div class=\"item\"><span class=\"muted\">Паспорт<\/span><b>${esc(userDB.passport)}<\/b><\/div>`;\n  $('history').innerHTML = historyDB.map(h =>\n    `<div class=\"item\"><span>№${h.id} · ${esc(h.service)} · ${h.date}<\/span><span class=\"badge-status ${h.status === 'исполнено' ? 'done' : ''}\">${esc(h.status)}<\/span><\/div>`\n  ).join('');\n  out('<span class=\"ok\">Личный кабинет загружен<\/span>');\n}\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Система оповещений", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР21 • Зад.6 • Система оповещений<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size: vice:hover{border-color:#1a73e8;background:#eef6ff}\n.service.active{border-color:#1a73e8;box-shadow:0 0 0 2px #c7d2fe}\n.badge-status{font-size:12px;padding:2px 10px;border-radius:999px;background:#e0f2fe;color:#075985}\n.badge-status.done{background:#dcfce7;color:#166534}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР21 • Зад.6<\/span>\n<h1>Система оповещений<\/h1>\n<div class=\"desc\">Задание 6: имитация уведомлений Госуслуг — о новой заявке и об изменении статуса, со счётчиком непрочитанных и отметкой «прочитано».<\/div>\n\n<div class=\"card\">\n  <h2>Вход через Госуслуги<\/h2>\n  <div class=\"row\">\n    <input id=\"login\" placeholder=\"Логин\" value=\"user123\" style=\"min-width:150px\">\n    <input id=\"password\" placeholder=\"Пароль\" type=\"password\" value=\"password\" style=\"min-width:150px\">\n    <button class=\"btn\" onclick=\"login()\">Войти<\/button>\n    <span id=\"auth-status\" class=\"muted\">не авторизован<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Уведомления <span class=\"badge-status\" id=\"unread\">0<\/span><\/h2>\n  <div class=\"row\">\n    <button class=\"btn\" onclick=\"pushNotification('new')\">Новая заявка<\/button>\n    <button class=\"btn orange\" onclick=\"pushNotification('status')\">Изменение статуса<\/button>\n    <button class=\"btn gray\" onclick=\"readAll()\">Прочитать все<\/button>\n  <\/div>\n  <div id=\"list\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const notifications = [];\nlet seq = 0;\n\nconst templates = {\n  new: () =&gt; ({ title: &#x27;Новая заявка&#x27;, text: &#x27;Заявление №&#x27; + (1000 + seq) + &#x27; зарегистрировано&#x27; }),\n  status: () =&gt; ({ title: &#x27;Статус изменён&#x27;, text: &#x27;Заявление №&#x27; + (1000 + seq) + &#x27; перешло в статус «в обработке»&#x27; })\n};\n\nfunction render() {\n  const unread = notifications.filter(n =&gt; !n.read).length;\n  $(&#x27;unread&#x27;).textContent = unread;\n  $(&#x27;unread&#x27;).className = &#x27;badge-status&#x27; + (unread ? &#x27;&#x27; : &#x27; done&#x27;);\n  $(&#x27;list&#x27;).innerHTML = notifications.length ? notifications.map(n =&gt; `\n    &lt;div class=&quot;item&quot; style=&quot;${n.read ? &#x27;opacity:.6&#x27; : &#x27;&#x27;}&quot;&gt;\n      &lt;div&gt;&lt;b&gt;${esc(n.title)}&lt;/b&gt;&lt;div class=&quot;muted&quot;&gt;${esc(n.text)} · ${n.time}&lt;/div&gt;&lt;/div&gt;\n      ${n.read ? &#x27;&lt;span class=&quot;ok&quot;&gt;прочитано&lt;/span&gt;&#x27; : `&lt;button class=&quot;btn&quot; onclick=&quot;markRead(${n.id})&quot;&gt;Прочитать&lt;/button&gt;`}\n    &lt;/div&gt;`).join(&#x27;&#x27;) : &#x27;&lt;p class=&quot;muted&quot;&gt;Уведомлений нет.&lt;/p&gt;&#x27;;\n}\n\nfunction pushNotification(kind) {\n  seq++;\n  const t = templates[kind]();\n  notifications.unshift({ id: seq, ...t, read: false, time: new Date().toLocaleTimeString(&#x27;ru-RU&#x27;) });\n  render();\n  out(`&lt;span class=&quot;ok&quot;&gt;Добавлено уведомление: ${esc(t.title)}&lt;/span&gt;`);\n}\n\nfunction markRead(id) {\n  const n = notifications.find(x =&gt; x.id === id);\n  if (n) n.read = true;\n  render();\n}\n\nfunction readAll() {\n  notifications.forEach(n =&gt; n.read = true);\n  render();\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;Все уведомления прочитаны&lt;/span&gt;&#x27;);\n}\n\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst notifications = [];\nlet seq = 0;\n\nconst templates = {\n  new: () => ({ title: 'Новая заявка', text: 'Заявление №' + (1000 + seq) + ' зарегистрировано' }),\n  status: () => ({ title: 'Статус изменён', text: 'Заявление №' + (1000 + seq) + ' перешло в статус «в обработке»' })\n};\n\nfunction render() {\n  const unread = notifications.filter(n => !n.read).length;\n  $('unread').textContent = unread;\n  $('unread').className = 'badge-status' + (unread ? '' : ' done');\n  $('list').innerHTML = notifications.length ? notifications.map(n => `\n    <div class=\"item\" style=\"${n.read ? 'opacity:.6' : ''}\">\n      <div><b>${esc(n.title)}<\/b><div class=\"muted\">${esc(n.text)} · ${n.time}<\/div><\/div>\n      ${n.read ? '<span class=\"ok\">прочитано<\/span>' : `<button class=\"btn\" onclick=\"markRead(${n.id})\">Прочитать<\/button>`}\n    <\/div>`).join('') : '<p class=\"muted\">Уведомлений нет.<\/p>';\n}\n\nfunction pushNotification(kind) {\n  seq++;\n  const t = templates[kind]();\n  notifications.unshift({ id: seq, ...t, read: false, time: new Date().toLocaleTimeString('ru-RU') });\n  render();\n  out(`<span class=\"ok\">Добавлено уведомление: ${esc(t.title)}<\/span>`);\n}\n\nfunction markRead(id) {\n  const n = notifications.find(x => x.id === id);\n  if (n) n.read = true;\n  render();\n}\n\nfunction readAll() {\n  notifications.forEach(n => n.read = true);\n  render();\n  out('<span class=\"ok\">Все уведомления прочитаны<\/span>');\n}\n\nrender();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Виджет для встраивания", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР21 • Зад.7 • Виджет для встраивания<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto ML = `\n    &lt;h3&gt;Платформа обратной связи&lt;/h3&gt;\n    &lt;p class=&quot;muted&quot;&gt;Виджет встроен на страницу сайта. Сообщений отправлено: &lt;b id=&quot;fb-count&quot;&gt;0&lt;/b&gt;&lt;/p&gt;\n    &lt;div class=&quot;row&quot;&gt;\n      &lt;span class=&quot;pill active&quot;&gt;Сообщить о проблеме&lt;/span&gt;\n      &lt;span class=&quot;pill&quot;&gt;Задать вопрос&lt;/span&gt;\n    &lt;/div&gt;`;\n})();\n\nfunction sendFeedback() {\n  const name = $(&#x27;fb-name&#x27;).value.trim() || &#x27;Аноним&#x27;;\n  const text = $(&#x27;fb-text&#x27;).value.trim();\n  if (!text) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Введите текст обращения&lt;/span&gt;&#x27;); return; }\n  widgetCounter++;\n  $(&#x27;fb-count&#x27;).textContent = widgetCounter;\n  $(&#x27;fb-text&#x27;).value = &#x27;&#x27;;\n  out(`&lt;span class=&quot;ok&quot;&gt;Обращение принято&lt;/span&gt;\nОт: ${esc(name)}\nТекст: ${esc(text)}\nНомер обращения: ПОС-${String(widgetCounter).padStart(4, &#x27;0&#x27;)}`);\n}\n\nfunction showCode() {\n  out(`&lt;pre class=&quot;code&quot; style=&quot;max-height:240px&quot;&gt;&amp;lt;div id=&quot;gosuslugi-widget&quot;&amp;gt;&amp;lt;/div&amp;gt;\n&amp;lt;script&amp;gt;\n(function() {\n  const container = document.getElementById(&#x27;gosuslugi-widget&#x27;);\n  if (!container) return;\n  container.innerHTML = renderWidget();\n})();\n&amp;lt;/script&amp;gt;&lt;/pre&gt;`);\n}<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nlet widgetCounter = 0;\n\n(function initWidget() {\n  const container = document.getElementById('gosuslugi-widget');\n  if (!container) return;\n\n  container.innerHTML = `\n    <h3>Платформа обратной связи<\/h3>\n    <p class=\"muted\">Виджет встроен на страницу сайта. Сообщений отправлено: <b id=\"fb-count\">0<\/b><\/p>\n    <div class=\"row\">\n      <span class=\"pill active\">Сообщить о проблеме<\/span>\n      <span class=\"pill\">Задать вопрос<\/span>\n    <\/div>`;\n})();\n\nfunction sendFeedback() {\n  const name = $('fb-name').value.trim() || 'Аноним';\n  const text = $('fb-text').value.trim();\n  if (!text) { out('<span class=\"err\">Введите текст обращения<\/span>'); return; }\n  widgetCounter++;\n  $('fb-count').textContent = widgetCounter;\n  $('fb-text').value = '';\n  out(`<span class=\"ok\">Обращение принято<\/span>\nОт: ${esc(name)}\nТекст: ${esc(text)}\nНомер обращения: ПОС-${String(widgetCounter).padStart(4, '0')}`);\n}\n\nfunction showCode() {\n  out(`<pre class=\"code\" style=\"max-height:240px\">&lt;div id=\"gosuslugi-widget\"&gt;&lt;/div&gt;\n&lt;script&gt;\n(function() {\n  const container = document.getElementById('gosuslugi-widget');\n  if (!container) return;\n  container.innerHTML = renderWidget();\n})();\n&lt;/script&gt;<\/pre>`);\n}\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const frame = document.getElementById('frame');

let current = -1;

  button.className = 'tab';

function select(i) {

    button.classList.toggle('active', index === i);

}
