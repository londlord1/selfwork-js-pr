<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПР27 — React: списки (все задания)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}
.wrap{max-width:680px;margin:0 auto}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}
.navbtns{display:flex;gap:8px}
.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0}
h1{color:#1a73e8;margin-bottom:4px;font-size:24px}
.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px}
input:focus,select:focus{border-color:#1a73e8;outline:none}
.rbtn{padding:10px 16px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}
.rbtn.gray{background:#64748b}
.stats{display:flex;gap:10px;margin:10px 0}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 6px;text-align:center;flex:1}
.stat b{display:block;font-size:20px;color:#1a73e8}
.stat span{font-size:11px;color:#777}
.item{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin-bottom:6px}
.item .name{flex:1}
.item .done{text-decoration:line-through;color:#94a3b8}
.icon-btn{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.cat{margin:12px 0 4px;font-weight:600;color:#334155;border-bottom:1px solid #e2e8f0;padding-bottom:3px}
.muted{color:#64748b;font-size:13px;margin-top:8px}
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="topnav">
  <a href="index.html">« Все практические</a>
  <div class="navbtns"><button class="btn" onclick="location.href='pr26.html'">← Пред. ПР</button><button class="btn" onclick="location.href='pr28.html'">След. ПР →</button></div>
</div>
<span class="pr-tag">ПР27</span>
<h1>ПР27 — React: списки и ключи (все задания)</h1>
<div class="desc">Один список покупок со всеми заданиями: Enter для добавления, отметка «куплено», счётчики, поиск, редактирование, сохранение в localStorage и категории.</div>
<div id="root"></div>
</div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const KEY = 'pr27_list';
const CATS = { food: 'Продукты', chem: 'Бытовая химия', electronics: 'Электроника' };

function App() {
  const [items, setItems] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } });
  const [name, setName] = useState('');
  const [cat, setCat] = useState('food');
  const [search, setSearch] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');

  useEffect(() => { localStorage.setItem(KEY, JSON.stringify(items)); }, [items]);

  const add = (e) => { e.preventDefault(); const n = name.trim(); if (!n) return; setItems([...items, { id: Date.now(), name: n, cat, purchased: false }]); setName(''); };
  const toggle = (id) => setItems(items.map((i) => i.id === id ? { ...i, purchased: !i.purchased } : i));
  const del = (id) => setItems(items.filter((i) => i.id !== id));
  const saveEdit = (id) => { const n = editValue.trim(); if (n) setItems(items.map((i) => i.id === id ? { ...i, name: n } : i)); setEditingId(null); };

  const filtered = items.filter((i) => i.name.toLowerCase().includes(search.toLowerCase()));
  const purchased = items.filter((i) => i.purchased).length;
  const grouped = filtered.reduce((acc, it) => { (acc[it.cat] = acc[it.cat] || []).push(it); return acc; }, {});

  return (
    <div className="card">
      <form onSubmit={add}>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Новый товар + Enter..." style={{flex:1,minWidth:160}} />
        <select value={cat} onChange={(e) => setCat(e.target.value)}>{Object.entries(CATS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
        <button className="rbtn" type="submit">Добавить</button>
      </form>
      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Поиск..." style={{width:'100%',marginBottom:10}} />

      <div className="stats">
        <div className="stat"><b>{items.length}</b><span>Всего</span></div>
        <div className="stat"><b style={{color:'#16a34a'}}>{purchased}</b><span>Куплено</span></div>
        <div className="stat"><b style={{color:'#f59e0b'}}>{items.length - purchased}</b><span>Осталось</span></div>
      </div>

      {Object.keys(grouped).length === 0 && <p className="muted">Список пуст.</p>}
      {Object.entries(grouped).map(([c, list]) => (
        <div key={c}>
          <div className="cat">{CATS[c]} ({list.length})</div>
          {list.map((it) => (
            <div className="item" key={it.id}>
              <button className="icon-btn" onClick={() => toggle(it.id)}>{it.purchased ? '✓' : '○'}</button>
              {editingId === it.id ? (
                <>
                  <input value={editValue} onChange={(e) => setEditValue(e.target.value)} style={{flex:1}} />
                  <button className="icon-btn" onClick={() => saveEdit(it.id)}>Сохранить</button>
                  <button className="icon-btn" onClick={() => setEditingId(null)}>Отмена</button>
                </>
              ) : (
                <>
                  <span className={it.purchased ? 'name done' : 'name'}>{it.name}</span>
                  <button className="icon-btn" onClick={() => { setEditingId(it.id); setEditValue(it.name); }}>✎</button>
                  <button className="icon-btn" onClick={() => del(it.id)}>×</button>
                </>
              )}
            </div>
          ))}
        </div>
      ))}
      <p className="muted">Список сохраняется в localStorage ({items.length} позиций).</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
