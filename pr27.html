px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.shop{max-width:640px;margin:0 auto}\n.shop-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}\n.shop-form input{flex:1;min-width:180px}\n.shop-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin:6px 0}\n.shop-item .name{flex:1}\n.shop-item .done{text-decoration:line-through;color:#94a3b8}\n.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}\n.stats .stat{flex:1}\n.cat-title{margin:14px 0 4px;font-weight:600;color:#334155;border-bottom:1px solid #e2e8f0;padding-bottom:3px}\n.icon-btn{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР27 • Зад.4<\/span>\n<h1>React: поиск по товарам<\/h1>\n<div class=\"desc\">Задание 4: поле поиска фильтрует список при вводе текста (без учёта регистра).<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState } = React;\n\nconst initial = [\n  { id: 1, name: &#x27;Молоко&#x27;, purchased: false },\n  { id: 2, name: &#x27;Хлеб&#x27;, purchased: true },\n  { id: 3, name: &#x27;Яблоки&#x27;, purchased: false },\n  { id: 4, name: &#x27;Молоко сгущённое&#x27;, purchased: false },\n  { id: 5, name: &#x27;Сыр&#x27;, purchased: true }\n];\n\nfunction App() {\n  const [items, setItems] = useState(initial);\n  const [searchTerm, setSearchTerm] = useState(&#x27;&#x27;);\n\n  const filteredItems = items.filter(item =&gt;\n    item.name.toLowerCase().includes(searchTerm.toLowerCase())\n  );\n\n  return (\n    &lt;div className=&quot;card shop&quot;&gt;\n      &lt;h2&gt;Список покупок&lt;/h2&gt;\n      &lt;input\n        value={searchTerm}\n        onChange={(e) =&gt; setSearchTerm(e.target.value)}\n        placeholder=&quot;Поиск...&quot;\n        style={{ width: &#x27;100%&#x27;, marginBottom: 12 }}\n      /&gt;\n      {filteredItems.length === 0 &amp;&amp; &lt;p className=&quot;muted&quot;&gt;Ничего не найдено.&lt;/p&gt;}\n      {filteredItems.map(item =&gt; (\n        &lt;div className=&quot;shop-item&quot; key={item.id}&gt;\n          &lt;span className={item.purchased ? &#x27;name done&#x27; : &#x27;name&#x27;}&gt;{item.name}&lt;/span&gt;\n          &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; setItems(items.filter(i =&gt; i.id !== item.id))}&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n      ))}\n      &lt;p className=&quot;muted&quot;&gt;Показано {filteredItems.length} из {items.length}&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst initial = [\n  { id: 1, name: 'Молоко', purchased: false },\n  { id: 2, name: 'Хлеб', purchased: true },\n  { id: 3, name: 'Яблоки', purchased: false },\n  { id: 4, name: 'Молоко сгущённое', purchased: false },\n  { id: 5, name: 'Сыр', purchased: true }\n];\n\nfunction App() {\n  const [items, setItems] = useState(initial);\n  const [searchTerm, setSearchTerm] = useState('');\n\n  const filteredItems = items.filter(item =>\n    item.name.toLowerCase().includes(searchTerm.toLowerCase())\n  );\n\n  return (\n    <div className=\"card shop\">\n      <h2>Список покупок<\/h2>\n      <input\n        value={searchTerm}\n        onChange={(e) => setSearchTerm(e.target.value)}\n        placeholder=\"Поиск...\"\n        style={{ width: '100%', marginBottom: 12 }}\n      />\n      {filteredItems.length === 0 && <p className=\"muted\">Ничего не найдено.<\/p>}\n      {filteredItems.map(item => (\n        <div className=\"shop-item\" key={item.id}>\n          <span className={item.purchased ? 'name done' : 'name'}>{item.name}<\/span>\n          <button className=\"icon-btn\" onClick={() => setItems(items.filter(i => i.id !== item.id))}>×<\/button>\n        <\/div>\n      ))}\n      <p className=\"muted\">Показано {filteredItems.length} из {items.length}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "R  false }\n];\n\nfunction App() {\n  const [items, setItems] = useState(initial);\n  const [editingId, setEditingId] = useState(null);\n  const [editValue, setEditValue] = useState(&#x27;&#x27;);\n\n  const startEdit = (id, name) =&gt; {\n    setEditingId(id);\n    setEditValue(name);\n  };\n\n  const saveEdit = (id) =&gt; {\n    if (!editValue.trim()) return;\n    setItems(items.map(item =&gt; item.id === id ? { ...item, name: editValue.trim() } : item));\n    setEditingId(null);\n  };\n\n  return (\n    &lt;div className=&quot;card shop&quot;&gt;\n      &lt;h2&gt;Список покупок&lt;/h2&gt;\n      {items.map(item =&gt; (\n        &lt;div className=&quot;shop-item&quot; key={item.id}&gt;\n          {editingId === item.id ? (\n            &lt;&gt;\n              &lt;input value={editValue} onChange={(e) =&gt; setEditValue(e.target.value)} style={{ flex: 1 }} /&gt;\n              &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; saveEdit(item.id)}&gt;Сохранить&lt;/button&gt;\n              &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; setEditingId(null)}&gt;Отмена&lt;/button&gt;\n            &lt;/&gt;\n          ) : (\n            &lt;&gt;\n              &lt;span className={item.purchased ? &#x27;name done&#x27; : &#x27;name&#x27;}&gt;{item.name}&lt;/span&gt;\n              &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; startEdit(item.id, item.name)}&gt;✎&lt;/button&gt;\n              &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; setItems(items.filter(i =&gt; i.id !== item.id))}&gt;×&lt;/button&gt;\n            &lt;/&gt;\n          )}\n        &lt;/div&gt;\n      ))}\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src ails><summary>Показать код решения<\/summary><pre class=\"code\">const { useState, useEffect } = React;\nconst STORAGE_KEY = &#x27;pr27_shoppingList&#x27;;\n\nfunction App() {\n  const [items, setItems] = useState(() =&gt; {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY);\n      return saved ? JSON.parse(saved) : [];\n    } catch (e) {\n      return [];\n    }\n  });\n  const [inputValue, setInputValue] = useState(&#x27;&#x27;);\n\n  useEffect(() =&gt; {\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));\n  }, [items]);\n\n  const addItem = (e) =&gt; {\n    e.preventDefault();\n    const name = inputValue.trim();\n    if (!name) return;\n    setItems([...items, { id: Date.now(), name, purchased: false }]);\n    setInputValue(&#x27;&#x27;);\n  };\n\n  return (\n    &lt;div className=&quot;card shop&quot;&gt;\n      &lt;h2&gt;Список покупок с сохранением&lt;/h2&gt;\n      &lt;form className=&quot;shop-form&quot; onSubmit={addItem}&gt;\n        &lt;input value={inputValue} onChange={(e) =&gt; setInputValue(e.target.value)} placeholder=&quot;Новый товар...&quot; /&gt;\n        &lt;button className=&quot;rbtn&quot; type=&quot;submit&quot;&gt;Добавить&lt;/button&gt;\n      &lt;/form&gt;\n      {items.length === 0 &amp;&amp; &lt;p className=&quot;muted&quot;&gt;Список пуст. Добавьте товар и перезагрузите страницу.&lt;/p&gt;}\n      {items.map(item =&gt; (\n        &lt;div className=&quot;shop-item&quot; key={item.id}&gt;\n          &lt;span className={item.purchased ? &#x27;name done&#x27; : &#x27;name&#x27;}&gt;{item.name}&lt;/span&gt;\n          &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; setItems(items.filter(i =&gt; i.id !== item.id))}&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n      ))}\n      &lt;button className=&quot;rbtn gray&quot; style={{ marginTop: 10 }} onClick={() =&gt; setItems([])}&gt;Очистить список&lt;/button&gt;\n      &lt;p className=&quot;muted&quot;&gt;Сохранено товаров: {items.length} · ключ localStorage e=\"rbtn gray\" style={{ marginTop: 10 }} onClick={() => setItems([])}>Очистить список<\/button>\n      <p className=\"muted\">Сохранено товаров: {items.length} · ключ localStorage: {STORAGE_KEY}<\/p>\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 5;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "React: категории товаров", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР27 • Зад.7 • React: категории товаров<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;  10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n\n.shop{max-width:640px;margin:0 auto}\n.shop-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}\n.shop-form input{flex:1;min-width:180px}\n.shop-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin:6px 0}\n.shop-item .name{flex:1}\n.shop-item .done{text-decoration:line-through;color:#94a3b8}\n.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}\n.stats .stat{flex:1}\n.cat-title{margin:14px 0 4px;font-weight:600;color:#334155;border-bottom:1px solid #e2e8f0;padding-bottom:3px}\n.icon-btn{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР27 • Зад.7<\/span>\n<h1>React: категории товаров<\/h1>\n<div class=\"desc\">Задание 7: у товара есть категория, список группируется по категориям через <code>reduce<\/code>, каждая группа выводится со своим заголовком.<\/div>\n<div id=\"root\"><\/div>\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const { useState } = React;\n\nconst CATEGORIES = {\n  food: &#x27;Продукты&#x27;,\n  chem: &#x27;Бытовая химия&#x27;,\n  electronics: &#x27;Электроника&#x27;\n};\n\nfunction App() {\n  const [items, setItems] = useState([\n    { id: 1, name: &#x27;Молоко&#x27;, category: &#x27;food&#x27;, purchased: false },\n    { id: 2, name: &#x27;Мыло&#x27;, category: &#x27;chem&#x27;, purchased: false },\n    { id: 3, name: &#x27;Наушники&#x27;, category: &#x27;electronics&#x27;, purchased: false },\n    { id: 4, name: &#x27;Хлеб&#x27;, category: &#x27;food&#x27;, purchased: true }\n  ]);\n  const [name, setName] = useState(&#x27;&#x27;);\n  const [category, setCategory] = useState(&#x27;food&#x27;);\n\n  const addItem = (e) =&gt; {\n    e.preventDefault();\n    if (!name.trim()) return;\n    setItems([...items, { id: Date.now(), name: name.trim(), category, purchased: false }]);\n    setName(&#x27;&#x27;);\n  };\n\n  const grouped = items.reduce((acc, item) =&gt; {\n    if (!acc[item.category]) acc[item.category] = [];\n    acc[item.category].push(item);\n    return acc;\n  }, {});\n\n  return (\n    &lt;div className=&quot;card shop&quot;&gt;\n      &lt;h2&gt;Список покупок по категориям&lt;/h2&gt;\n      &lt;form className=&quot;shop-form&quot; onSubmit={addItem}&gt;\n        &lt;input value={name} onChange={(e) =&gt; setName(e.target.value)} placeholder=&quot;Новый товар...&quot; /&gt;\n        &lt;select value={category} onChange={(e) =&gt; setCategory(e.target.value)}&gt;\n          {Object.entries(CATEGORIES).map(([key, label]) =&gt; &lt;option key={key} value={key}&gt;{label}&lt;/option&gt;)}\n        &lt;/select&gt;\n        &lt;button className=&quot;rbtn&quot; type=&quot;submit&quot;&gt;Добавить&lt;/button&gt;\n      &lt;/form&gt;\n      {Object.entries(grouped).map(([cat, catItems]) =&gt; (\n        &lt;div key={cat}&gt;\n          &lt;div className=&quot;cat-title&quot;&gt;{CATEGORIES[cat]} ({catItems.length})&lt;/div&gt;\n          {catItems.map(item =&gt; (\n            &lt;div className=&quot;shop-item&quot; key={item.id}&gt;\n              &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; setItems(items.map(i =&gt; i.id === item.id ? { ...i, purchased: !i.purchased } : i))}&gt;\n                {item.purchased ? &#x27;✓&#x27; : &#x27;○&#x27;}\n              &lt;/button&gt;\n              &lt;span className={item.purchased ? &#x27;name done&#x27; : &#x27;name&#x27;}&gt;{item.name}&lt;/span&gt;\n              &lt;button className=&quot;icon-btn&quot; onClick={() =&gt; setItems(items.filter(i =&gt; i.id !== item.id))}&gt;×&lt;/button&gt;\n            &lt;/div&gt;\n          ))}\n        &lt;/div&gt;\n      ))}\n    &lt;/div&gt;\n  );\n}\n\nReactDOM.createRoot(document.getElementById(&#x27;root&#x27;)).render(&lt;App /&gt;);<\/pre><\/details>\n\n\n<\/div>\n<script crossorigin src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\"><\/script>\n<script crossorigin src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.26.4/babel.min.js\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\">\n\nconst { useState } = React;\n\nconst CATEGORIES = {\n  food: 'Продукты',\n  chem: 'Бытовая химия',\n  electronics: 'Электроника'\n};\n\nfunction App() {\n  const [items, setItems] = useState([\n    { id: 1, name: 'Молоко', category: 'food', purchased: false },\n    { id: 2, name: 'Мыло', category: 'chem', purchased: false },\n    { id: 3, name: 'Наушники', category: 'electronics', purchased: false },\n    { id: 4, name: 'Хлеб', category: 'food', purchased: true }\n  ]);\n  const [name, setName] = useState('');\n  const [category, setCategory] = useState('food');\n\n  const addItem = (e) => {\n    e.preventDefault();\n    if (!name.trim()) return;\n    setItems([...items, { id: Date.now(), name: name.trim(), category, purchased: false }]);\n    setName('');\n  };\n\n  const grouped = items.reduce((acc, item) => {\n    if (!acc[item.category]) acc[item.category] = [];\n    acc[item.category].push(item);\n    return acc;\n  }, {});\n\n  return (\n    <div className=\"card shop\">\n      <h2>Список покупок по категориям<\/h2>\n      <form className=\"shop-form\" onSubmit={addItem}>\n        <input value={name} onChange={(e) => setName(e.target.value)} placeholder=\"Новый товар...\" />\n        <select value={category} onChange={(e) => setCategory(e.target.value)}>\n          {Object.entries(CATEGORIES).map(([key, label]) => <option key={key} value={key}>{label}<\/option>)}\n        <\/select>\n        <button className=\"rbtn\" type=\"submit\">Добавить<\/button>\n      <\/form>\n      {Object.entries(grouped).map(([cat, catItems]) => (\n        <div key={cat}>\n          <div className=\"cat-title\">{CATEGORIES[cat]} ({catItems.length})<\/div>\n          {catItems.map(item => (\n            <div className=\"shop-item\" key={item.id}>\n              <button className=\"icon-btn\" onClick={() => setItems(items.map(i => i.id === item.id ? { ...i, purchased: !i.purchased } : i))}>\n                {item.purchased ? '✓' : '○'}\n              <\/button>\n              <span className={item.purchased ? 'name done' : 'name'}>{item.name}<\/span>\n              <button className=\"icon-btn\" onClick={() => setItems(items.filter(i => i.id !== item.id))}>×<\/button>\n            <\/div>\n          ))}\n        <\/div>\n      ))}\n    <\/div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n\n<\/script>\n<script>\n(function () {\n  var index = 6;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
