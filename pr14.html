cus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР14<\/span>\n<h1>ПР14 • Зад.1 • Добавление опыта работы<\/h1>\n<div class=\"desc\">Добавьте места работы: компания, должность, годы. Каждое место — объект { company, position, years }, собранный сокращённым синтаксисом, иммутабельно в массив.<\/div>\n\n<div class=\"card\">\n<label>Компания:<\/label><input id=\"c\" placeholder=\"Яндекс\">\n<label>Должность:<\/label><input id=\"p\" placeholder=\"Разработчик\">\n<label>Лет:<\/label><input id=\"y\" type=\"number\" value=\"1\" style=\"width:80px\">\n<button class=\"btn\" onclick=\"addExp()\">➕ Добавить опыт<\/button>\n<\/div>\n<div id=\"explist\" style=\"margin:10px 0\"><\/div>\n<div class=\"out\" id=\"out\">Заполните компанию и должность, затем «Добавить опыт».<\/div>\n<script>\nlet exp=[];\nfunction addExp(){\n const company=document.getElementById('c').value.trim();\n const position=document.getElementById('p').value.trim();\n const years=Number(document.getElementById('y').value)||0;\n if(!company||!position){document.getElementById('out').innerHTML='<span class=\"err\">Заполните компанию и должность<\/span>';return;}\n const job={company,position,years}; // сокращённый синтаксис\n exp=[...exp,job];                   // иммутабельное добавление\n renderExp();document.getElementById('c').value='';document.getElementById('p').value='';\n document.getElementById('out').innerHTML=`<span class=\"ok\">Добавлено:<\/span> ${position} в ${company} (${years} лет)\n\nМассив: ${JSON.stringify(exp)}`;\n}\nfunction renderExp(){const e=document.getElementById('explist');e.innerHTML=exp.map((j,i)=>`<div style=\"background:#f8f9fa;border-radius:8px;padding:8px 12px;margin:4px 0\">${i+1}. ${j.position} в ${j.company} · ${j.years} лет<\/div>`).join('')||'—';}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Иммутабельное обновление объекта", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР14 • Зад.2 • Иммутабельное обновление объекта<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10 чение:<\/label><input id=\"nv\" placeholder=\"Санкт-Петербург\">\n<button class=\"btn\" onclick=\"runUpdate()\">Обновить (immutable)<\/button>\n<\/div>\n<div class=\"card\">\n<div class=\"out\" id=\"orig\">Оригинал<\/div>\n<div class=\"out\" id=\"newres\">Обновлённый (новый объект)<\/div>\n<\/div>\n<script>\nconst base={firstName:'Иван',lastName:'Иванов',age:30,address:{city:'Москва',street:'Ленина',building:'15'},contacts:{email:'ivan@example.com',phone:'+7-999'}};\nfunction updateResumeField(resume,path,val){\n const parts=path.split('.');\n if(parts.length===1)return {...resume,[parts[0]]:val};\n if(parts.length===2)return {...resume,[parts[0]]:{...resume[parts[0]],[parts[1]]:val}};\n return resume;\n}\nfunction runUpdate(){const path=document.getElementById('fp').value.trim();const val=document.getElementById('nv').value;\n const updated=updateResumeField(base,path,val)||base;\n document.getElementById('orig').innerHTML=`<span class=\"hl\">Оригинал (без изменений)<\/span>\n\n${JSON.stringify(base,null,2)}`;\n document.getElementById('newres').innerHTML=`<span class=\"hl\">updateResumeField('${path}', '${val}')<\/span>\n\n${JSON.stringify(updated,null,2)}\n\nОригинал не изменён ✅`;\n}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Значения по умолчанию при деструктуризации", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР14 • Зад.3 • Значения по умолчанию при деструктуризации<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#22 ,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР14<\/span>\n<h1>ПР14 • Зад.3 • Значения по умолчанию при деструктуризации<\/h1>\n<div class=\"desc\">Модифицируйте displayResume, чтобы корректно обрабатывались отсутствующие свойства через дефолты при деструктуризации.<\/div>\n\n<div class=\"card\">\n<button class=\"btn\" onclick=\"showFull()\">Полное резюме<\/button>\n<button class=\"btn green\" onclick=\"showEmpty()\">Пустое резюме (дефолты)<\/button>\n<button class=\"btn orange\" onclick=\"showPartial()\">Частичное (только имя)<\/button>\n<\/div>\n<div id=\"out\" style=\"background:#f8f9fa;border-radius:12px;padding:14px;margin-top:10px\"><\/div>\n<script>\nfunction displayResume(resume){\n const {firstName='Неизвестный',lastName='Пользователь',age='не указан',address:{city='Город не указан',street='',building=''}={},skills=[],contacts:{email='не указан',phone='не указан'}={}}=resume||{};\n const addr=[city,street,building].filter(Boolean).join(', ');\n document.getElementById('out').innerHTML=`<b>Резюме: ${firstName} ${lastName}<\/b><br>Возраст: ${age}<br>Адрес: ${addr||'не указан'}<br>Навыки: ${skills.length?skills.join(', '):'не указаны'}<br>Email: ${email}<br>Телефон: ${phone}`;\n}\nfunction showFull(){displayResume({firstName:'Иван',lastName:'Иванов',age:30,address:{city:'Москва',street:'Ленина','building':'15'},skills:['JS','React'],contacts:{email:'ivan@example.com',phone:'+7-999'}});}\nfunction showEmpty(){displayResume({});}\nfunction showPartial(){displayResume({firstName:'Пётр'});}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}, {"title": "Сохранение резюме в localStorage", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР14 • Зад.4 • Сохранение резюме в localStorage<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:860px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР14<\/span>\n<h1>ПР14 • Зад.4 • Сохранение резюме в localStorage<\/h1>\n<div class=\"desc\">Сохраните собранное резюме в localStorage (JSON) и реализуйте кнопку «Загрузить последнее резюме».<\/div>\n\n<div class=\"card\">\n<label>Имя:<\/label><input id=\"rname\" value=\"Мария\">\n<label>Email:<\/label><input id=\"rmail\" value=\"maria@example.com\">\n<button class=\"btn\" onclick=\"saveToday()\">💾 Сохранить резюме<\/button>\n<button class=\"btn green\" onclick=\"loadLast()\">📥 Загрузить последнее<\/button>\n<\/div>\n<div class=\"out\" id=\"out\">Составьте резюме, сохраните — оно останется в localStorage после перезагрузки.<\/div>\n<script>\nfunction buildR(){return {firstName:document.getElementById('rname').value.trim(),email:document.getElementById('rmail').value.trim()};}\nfunction saveToday(){const r=buildR();localStorage.setItem('savedResume',JSON.stringify(r));document.getElementById('out').innerHTML=`<span class=\"ok\">✅ Сохранено в localStorage:<\/span>\n\n${JSON.stringify(r)}`;}\nfunction loadLast(){const s=localStorage.getItem('savedResume');if(!s){document.getElementById('out').innerHTML='<span class=\"err\">Не сохранено ни одного резюме<\/span>';return;}const r=JSON.parse(s);document.getElementById('out').innerHTML=`<span class=\"hl\">Загружено из localStorage:<\/span>\n\nИмя: <span class=\"ok\">${r.firstName}<\/span>\nEmail: <span class=\"ok\">${r.email}<\/span>`;}\n<\/script>\n\n\n\n<\/div>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
</script>
</body>
