а! 👋&#x27;, &#x27;До встречи! 😊&#x27;]\n};\n\nfunction getBotResponse(text) {\n  const lower = text.toLowerCase().trim();\n  for (const [keyword, answers] of Object.entries(botResponses)) {\n    if (lower.includes(keyword)) {\n      return answers[Math.floor(Math.random() * answers.length)];\n    }\n  }\n  return &#x27;Я не совсем понял. Спросите «имя» или «возраст» 🤔&#x27;;\n}\n\nfunction addMessage(text, who) {\n  const chat = $(&#x27;chat&#x27;);\n  const prev = chat.innerHTML;\n  chat.innerHTML = prev + `&lt;div style=&quot;margin:6px 0&quot;&gt;&lt;b class=&quot;${who === &#x27;user&#x27; ? &#x27;hl&#x27; : &#x27;ok&#x27;}&quot;&gt;${who === &#x27;user&#x27; ? &#x27;Вы&#x27; : &#x27;Бот&#x27;}:&lt;/b&gt; ${esc(text)}&lt;/div&gt;`;\n  chat.scrollTop = chat.scrollHeight;\n}\n\nfunction send() {\n  const input = $(&#x27;msg&#x27;);\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, &#x27;user&#x27;);\n  input.value = &#x27;&#x27;;\n  setTimeout(() =&gt; addMessage(getBotResponse(text), &#x27;bot&#x27;), 300);\n}\n\naddMessage(&#x27;Привет! Я бот. Спросите «имя» или «возраст».&#x27;, &#x27;bot&#x27;);<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst botResponses = {\n  'привет': ['Привет! 😊', 'Здравствуй! 👋', 'Приветствую! 🤖'],\n  'имя': ['Меня зовут Бот! А тебя? 😊', 'Я безымянный бот! Можешь придумать мне имя! 🤖'],\n  'возраст': ['Мне ровно 1 день — я родился вместе с этой страницей 🎂', 'Возраст бота — понятие относительное 🙂'],\n  'пока': ['Пока! 👋', 'До встречи! 😊']\n};\n\nfunction getBotResponse(text) {\n  const lower = text.toLowerCase().trim();\n  for (const [keyword, answers] of Object.entries(botResponses)) {\n    if (lower.includes(keyword)) {\n      return answers[Math.floor( .length)];\n    }\n  }\n  return &#x27;Не понял. Спросите «как тебя зовут».&#x27;;\n}\n\nfunction addMessage(text, who) {\n  const chat = $(&#x27;chat&#x27;);\n  chat.innerHTML += `&lt;div style=&quot;margin:6px 0&quot;&gt;&lt;b class=&quot;${who === &#x27;user&#x27; ? &#x27;hl&#x27; : &#x27;ok&#x27;}&quot;&gt;${who === &#x27;user&#x27; ? &#x27;Вы&#x27; : &#x27;Бот&#x27;}:&lt;/b&gt; ${esc(text)}&lt;/div&gt;`;\n  chat.scrollTop = chat.scrollHeight;\n}\n\nfunction send() {\n  const input = $(&#x27;msg&#x27;);\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, &#x27;user&#x27;);\n  input.value = &#x27;&#x27;;\n  setTimeout(() =&gt; addMessage(getBotResponse(text), &#x27;bot&#x27;), 300);\n}\n\naddMessage(&#x27;Спросите «как тебя зовут» — отвечу целиком на фразу.&#x27;, &#x27;bot&#x27;);<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst botResponses = {\n  'как тебя зовут': ['Меня зовут ЧатБот-2000 🤖', 'У меня пока нет имени — придумай! 😊'],\n  'зовут': ['Меня зовут Бот 🙂', 'Зови меня просто Бот.'],\n  'привет': ['Привет! 👋']\n};\n\nfunction getBotResponse(text) {\n  const lower = text.toLowerCase();\n  const keys = Object.keys(botResponses).sort((a, b) => b.length - a.length);\n  for (const key of keys) {\n    if (lower.includes(key)) {\n      const answers = botResponses[key];\n      return answers[Math.floor(Math.random() * answers.length)];\n    }\n  }\n  return 'Не понял. Спросите «как тебя зовут».';\n}\n\nfunction addMessage(text, who) {\n  const chat = $('chat');\n  chat.innerHTML += `<div style=\"margin:6px 0\"><b class=\"${who === 'user' ? 'hl' : 'ok'}\">${who === 'user' ? 'Вы' : 'Бот'}:<\/b> ${esc(text)}<\/div>`;\n  chat.scrollTop = chat.scrollHeight;\n}\n\nfunction send() {\n  const input = $('msg');\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, 'user');\n  input.value = '';\n  setTimeout(() => addMessage(getBotResponse(text), 'bot'), 300);\n}\n\naddMessage('Спросите «как тебя зовут» — отвечу целиком на фразу.', 'bot');\n\n<\/script>\n<script>\n(function () {\n  var index = 3;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Режим «Калькулятор»", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР19 • Зад.5 • Режим «Калькулятор»<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;bord olor:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn. scrollHeight;\n}\n\nfunction addMessage(text, who) {\n  const history = loadHistory();\n  history.push({ text, who, date: new Date().toISOString() });\n  saveHistory(history);\n  render();\n}\n\nfunction getBotResponse(text) {\n  if (/привет/i.test(text)) return &#x27;Привет! История уже сохраняется 💾&#x27;;\n  if (/очист/i.test(text)) return &#x27;Кнопка очистки — над чатом.&#x27;;\n  return &#x27;Записал в историю. Перезагрузите страницу — сообщения останутся.&#x27;;\n}\n\nfunction send() {\n  const input = $(&#x27;msg&#x27;);\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, &#x27;user&#x27;);\n  input.value = &#x27;&#x27;;\n  setTimeout(() =&gt; addMessage(getBotResponse(text), &#x27;bot&#x27;), 300);\n}\n\nfunction clearChat() {\n  localStorage.removeItem(HISTORY_KEY);\n  render();\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;История очищена&lt;/span&gt;&#x27;);\n}\n\nif (!loadHistory().length) {\n  addMessage(&#x27;Привет! Я сохраняю историю в localStorage.&#x27;, &#x27;bot&#x27;);\n}\nrender();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst HISTORY_KEY = 'pr19_chatHistory';\n\nfunction loadHistory() {\n  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }\n  catch (e) { return []; }\n}\n\nfunction saveHistory(history) {\n  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));\n}\n\nfunction render() {\n  const history = loadHistory();\n  $('chat').innerHTML = history.map(m =>\n    `<div style=\"margin:6px 0\"><b class=\"${m.who === 'user' ? 'hl' : 'ok'}\">${m.who === 'user' ? 'Вы' : 'Бот'}:<\/b> ${esc(m.text)}<\/div>`\n  ).join('');\n  $('chat').scrollTop = $('chat').scrollHeight;\n}\n\nfunction addMessage(text, who) {\n  const history = loadHistory();\n  history.push({ text, who, date: new Date().toISOString() });\n  saveHistory(history);\n  render();\n}\n\nfunction getBotResponse(text) {\n  if (/привет/i.test(text)) return 'Привет! История уже сохраняется 💾';\n  if (/очист/i.test(text)) return 'Кнопка очистки — над чатом.';\n  return 'Записал в историю. Перезагрузите страницу — сообщения останутся.';\n}\n\nfunction send() {\n  const input = $('msg');\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, 'user');\n  input.value = '';\n  setTimeout(() => addMessage(getBotResponse(text), 'bot'), 300);\n}\n\nfunction clearChat() {\n  localStorage.removeItem(HISTORY_KEY);\n  render();\n  out('<span class=\"ok\">История очищена<\/span>');\n}\n\nif (!loadHistory().length) {\n  addMessage('Привет! Я сохраняю историю в localStorage.', 'bot');\n}\nrender();\n\n<\/script>\n<script>\n(function () {\n  var index = 5;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Выбор языка", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР19 • Зад.7 • Выбор языка<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8 р языка<\/h1>\n<div class=\"desc\">Задание 7: переключатель языка бота (русский / английский). Наборы ответов хранятся в <code>botResponses.ru<\/code> и <code>botResponses.en<\/code>.<\/div>\n\n<div class=\"card\">\n  <h2>Чат с ботом<\/h2>\n  <div class=\"row\">\n    <button class=\"pill active\" id=\"btn-ru\" onclick=\"switchLanguage('ru')\">🇷🇺 Русский<\/button>\n    <button class=\"pill\" id=\"btn-en\" onclick=\"switchLanguage('en')\">🇬🇧 English<\/button>\n  <\/div>\n  <div class=\"out\" id=\"chat\" style=\"min-height:220px;max-height:320px;overflow:auto\"><\/div>\n  <div class=\"row\">\n    <input id=\"msg\" placeholder=\"Введите сообщение...\" style=\"flex:1;min-width:200px\" onkeydown=\"if(event.key==='Enter')send()\">\n    <button class=\"btn\" onclick=\"send()\">Отправить<\/button>\n  <\/div>\n  <div class=\"out\" id=\"out\" style=\"min-height:auto\"><\/div>\n<\/div>\n\n<details><summary>Показать код решения<\/summary><pre class=\"code\">let currentLanguage = &#x27;ru&#x27;;\n\nconst botResponses = {\n  ru: {\n    &#x27;привет&#x27;: [&#x27;Привет! 😊&#x27;, &#x27;Здравствуй! 👋&#x27;],\n    &#x27;пока&#x27;: [&#x27;Пока! 👋&#x27;, &#x27;До встречи! 😊&#x27;],\n    &#x27;как дела&#x27;: [&#x27;Отлично! 🌟&#x27;, &#x27;Прекрасно! 💫&#x27;]\n  },\n  en: {\n    &#x27;hello&#x27;: [&#x27;Hello! 😊&#x27;, &#x27;Hi there! 👋&#x27;],\n    &#x27;bye&#x27;: [&#x27;Bye! 👋&#x27;, &#x27;See you! 😊&#x27;],\n    &#x27;how are you&#x27;: [&#x27;Great! 🌟&#x27;, &#x27;Wonderful! 💫&#x27;]\n  }\n};\n\nfunction getBotResponse(msg) {\n  const lower = msg.toLowerCase();\n  const responses = botResponses[currentLanguage];\n  for (const [keyword, answers] of Object.entries(responses)) {\n    if (lower.includes(keyword)) return answers[Math.floor(Math.random() * answers.length)];\n  }\n  return currentLanguage === &#x27;ru&#x27; ? &#x27;Я не совсем понял. 🤔&#x27; : &quot;I don&#x27;t quite understand. 🤔&quot;;\n}\n\nfunction addMessage(text, who) {\n  const chat = $(&#x27;chat&#x27;);\n  chat.innerHTML += `&lt;div style=&quot;margin:6px 0&quot;&gt;&lt;b class=&quot;${who === &#x27;user&#x27; ? &#x27;hl&#x27; : &#x27;ok&#x27;}&quot;&gt;${who === &#x27;user&#x27; ? &#x27;Вы&#x27; : &#x27;Bot&#x27;}:&lt;/b&gt; ${esc(text)}&lt;/div&gt;`;\n  chat.scrollTop = chat.scrollHeight;\n}\n\nfunction switchLanguage(lang) {\n  currentLanguage = lang;\n  $(&#x27;btn-ru&#x27;).classList.toggle(&#x27;active&#x27;, lang === &#x27;ru&#x27;);\n  $(&#x27;btn-en&#x27;).classList.toggle(&#x27;active&#x27;, lang === &#x27;en&#x27;);\n  addMessage(lang === &#x27;ru&#x27; ? &#x27;Язык переключен на русский&#x27; : &#x27;Language switched to English&#x27;, &#x27;bot&#x27;);\n}\n\nfunction send() {\n  const input = $(&#x27;msg&#x27;);\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, &#x27;user&#x27;);\n  input.value = &#x27;&#x27;;\n  setTimeout(() =&gt; addMessage(getBotResponse(text), &#x27;bot&#x27;), 300);\n}\n\naddMessage(&#x27;Привет! Я многоязычный бот 🌍&#x27;, &#x27;bot&#x27;);<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nlet currentLanguage = 'ru';\n\nconst botResponses = {\n  ru: {\n    'привет': ['Привет! 😊', 'Здравствуй! 👋'],\n    'пока': ['Пока! 👋', 'До встречи! 😊'],\n    'как дела': ['Отлично! 🌟', 'Прекрасно! 💫']\n  },\n  en: {\n    'hello': ['Hello! 😊', 'Hi there! 👋'],\n    'bye': ['Bye! 👋', 'See you! 😊'],\n    'how are you': ['Great! 🌟', 'Wonderful! 💫']\n  }\n};\n\nfunction getBotResponse(msg) {\n  const lower = msg.toLowerCase();\n  const responses = botResponses[currentLanguage];\n  for (const [keyword, answers] of Object.entries(responses)) {\n    if (lower.includes(keyword)) return answers[Math.floor(Math.random() * answers.length)];\n  }\n  return currentLanguage === 'ru' ? 'Я не совсем понял. 🤔' : \"I don't quite understand. 🤔\";\n}\n\nfunction addMessage(text, who) {\n  const chat = $('chat');\n  chat.innerHTML += `<div style=\"margin:6px 0\"><b class=\"${who === 'user' ? 'hl' : 'ok'}\">${who === 'user' ? 'Вы' : 'Bot'}:<\/b> ${esc(text)}<\/div>`;\n  chat.scrollTop = chat.scrollHeight;\n}\n\nfunction switchLanguage(lang) {\n  currentLanguage = lang;\n  $('btn-ru').classList.toggle('active', lang === 'ru');\n  $('btn-en').classList.toggle('active', lang === 'en');\n  addMessage(lang === 'ru' ? 'Язык переключен на русский' : 'Language switched to English', 'bot');\n}\n\nfunction send() {\n  const input = $('msg');\n  const text = input.value.trim();\n  if (!text) return;\n  addMessage(text, 'user');\n  input.value = '';\n  setTimeout(() => addMessage(getBotResponse(text), 'bot'), 300);\n}\n\naddMessage('Привет! Я многоязычный бот 🌍', 'bot');\n\n<\/script>\n<script>\n(function () {\n  var index = 6;\n  function send() {\n    parent.postMessage({ type: 'ph-height', index: index, height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const container = document.getElementById('tasks');
const toc = document.getElementById('toc');
const frames = [];

TASKS.forEach(function (task, i) {
  const section = document.createElement('section');
  section.className = 'task';
  section.id = 'task-' + (i + 1);

  const head = document.createElement('div');
  head.className = 'task-head';
  const num = document.createElement('span');
  num.className = 'task-num';
  num.textContent = i + 1;
  const title = document.createElement('span');
  title.textContent = task.title;
  head.appendChild(num);
  head.appendChild(title);

  const frame = document.createElement('iframe');
  frame.className = 'task-frame';
  frame.dataset.index = i;
  frame.title = 'Задание ' + (i + 1) + ': ' + task.title;
  frame.src = 'about:blank';

  section.appendChild(head);
  section.appendChild(frame);
  container.appendChild(section);
  frames.push(frame);

  const link = document.createElement('a');
  link.href = '#task-' + (i + 1);
  link.textContent = i + 1;
  link.title = task.title;
  toc.appendChild(link);
});

const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (!entry.isIntersecting) return;
    const frame = entry.target;
    if (frame.dataset.loaded) return;
    frame.dataset.loaded = '1';
    frame.srcdoc = TASKS[Number(frame.dataset.index)].html;
    observer.unobserve(frame);
  });
}, { rootMargin: '600px' });

frames.forEach(function (frame) { observer.observe(frame); });

window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'ph-height') return;
  const frame = frames[event.data.index];
  if (frame) frame.style.height = Math.max(420, event.data.height + 6) + 'px';
});
</script>
