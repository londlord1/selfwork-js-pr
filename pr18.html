span&gt;`);\n  return greeting;\n}\n\nfunction sendHello() {\n  const name = $(&#x27;name&#x27;).value.trim();\n  fakeChrome.scripting.executeScript({ func: showHello, args: [name] });\n}\n\nconst fakeChrome = {\n  scripting: {\n    executeScript({ func, args }) {\n      func(...args);\n    }\n  }\n};\n\nsendHello();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nfunction showHello(name) {\n  const greeting = name ? `Привет, ${name}! 👋` : 'Привет, студент! 👋';\n  out(`<span class=\"ok\">${esc(greeting)}<\/span>`);\n  return greeting;\n}\n\nfunction sendHello() {\n  const name = $('name').value.trim();\n  fakeChrome.scripting.executeScript({ func: showHello, args: [name] });\n}\n\nconst fakeChrome = {\n  scripting: {\n    executeScript({ func, args }) {\n      func(...args);\n    }\n  }\n};\n\nsendHello();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Добавить новую кнопку", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР18 • Зад.2 • Добавить новую кнопку<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.t documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Расширение с контент-скриптом", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР18 • Зад.6 • Расширение с контент-скриптом<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray: nd:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР18 • Зад.6<\/span>\n<h1>Расширение с контент-скриптом<\/h1>\n<div class=\"desc\">Задание 6: отдельный файл <code>content-script.js<\/code> вместо внедрения кода из popup. Popup отправляет сообщение через <code>runtime.sendMessage<\/code>, контент-скрипт принимает его в <code>runtime.onMessage<\/code>. Демо показывает обмен сообщениями.<\/div>\n\n<div class=\"card\">\n  <h2>Popup расширения<\/h2>\n  <div class=\"row\">\n    <button class=\"btn\" onclick=\"send('highlight')\">Выделить заголовки<\/button>\n    <button class=\"btn green\" onclick=\"send('banner')\">Добавить баннер<\/button>\n    <button class=\"btn gray\" onclick=\"send('clear')\">Убрать эффекты<\/button>\n  <\/div>\n  <div class=\"out\" id=\"out\">content-script.js подключён через manifest.json → content_scripts.<\/div>\n<\/div>\n\n<div class=\"preview\" id=\"page\">\n  <h3>Демо-страница сайта<\/h3>\n  <p>Это обычная страница, на которую расширение применяет свои действия.<\/p>\n  <h4>Заголовок второго уровня<\/h4>\n  <p>Расширение работает через <code>chrome.scripting.executeScript<\/code> или контент-скрипт.<\/p>\n  <ul><li>Первый пункт списка<\/li><li>Второй пункт списка<\/li><\/ul>\n<\/div>\n\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const contentScript = {\n  onMessage(message, sender, sendResponse) {\n    const page = $(&#x27;page&#x27;);\n    if (message.action === &#x27;highlight&#x27;) {\n      page.querySelectorAll(&#x27;h3, h4&#x27;).forEach(h =&gt; {\n        h.style.background = &#x27;#fff59d&#x27;;\n        h.style.padding = &#x27;4px 8px&#x27;;\n        h.style.borderRadius = &#x27;4px&#x27;;\n      });\n      sendResponse(&#x27;Заголовки выделены&#x27;);\n    } else if (message.action === &#x27;banner&#x27;) {\n      if (!$(&#x27;cs-banner&#x27;)) {\n        const banner = document.createElement(&#x27;div&#x27;);\n        banner.id = &#x27;cs-banner&#x27;;\n        banner.textContent = &#x27;📢 Баннер добавлен контент-скриптом&#x27;;\n        banner.style.cssText = &#x27;background:#1a73e8;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:10px&#x27;;\n        page.prepend(banner);\n      }\n      sendResponse(&#x27;Баннер добавлен&#x27;);\n    } else {\n      page.querySelectorAll(&#x27;h3, h4&#x27;).forEach(h =&gt; {\n        h.style.background = &#x27;&#x27;;\n        h.style.padding = &#x27;&#x27;;\n      });\n      const banner = $(&#x27;cs-banner&#x27;);\n      if (banner) banner.remove();\n      sendResponse(&#x27;Эффекты убраны&#x27;);\n    }\n  }\n};\n\nfunction send(action) {\n  const message = { action };\n  console.log(&#x27;popup → content-script:&#x27;, message);\n  const response = contentScript.onMessage(message, {}, () =&gt; {});\n  out(`popup отправил &lt;span class=&quot;hl&quot;&gt;${action}&lt;/span&gt;\ncontent-script ответил: &lt;span class=&quot;ok&quot;&gt;${esc(response)}&lt;/span&gt;`);\n}<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst contentScript = {\n  onMessage(message, sender, sendResponse) {\n    const page = $('page');\n    if (message.action === 'highlight') {\n      page.querySelectorAll('h3, h4').forEach(h => {\n        h.style.background = '#fff59d';\n        h.style.padding = '4px 8px';\n        h.style.borderRadius = '4px';\n      });\n      sendResponse('Заголовки выделены');\n    } else if (message.action === 'banner') {\n      if (!$('cs-banner')) {\n        const banner = document.createElement('div');\n        banner.id = 'cs-banner';\n        banner.textContent = '📢 Баннер добавлен контент-скриптом';\n        banner.style.cssText = 'background:#1a73e8;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:10px';\n        page.prepend(banner);\n      }\n      sendResponse('Баннер добавлен');\n    } else {\n      page.querySelectorAll('h3, h4').forEach(h => {\n        h.style.background = '';\n        h.style.padding = '';\n      });\n      const banner = $('cs-banner');\n      if (banner) banner.remove();\n      sendResponse('Эффекты убраны');\n    }\n  }\n};\n\nfunction send(action) {\n  const message = { action };\n  console.log('popup → content-script:', message);\n  const response = contentScript.onMessage(message, {}, () => {});\n  out(`popup отправил <span class=\"hl\">${action}<\/span>\ncontent-script ответил: <span class=\"ok\">${esc(response)}<\/span>`);\n}\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"title": "Заметки на странице", "html": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ПР18 • Зад.7 • Заметки на странице<\/title>\n<style>*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;padding:24px;line-height:1.55}\n.wrap{max-width:900px;margin:0 auto}\n.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.topnav a{color:#1a73e8;text-decoration:none;font-size:14px}\n.topnav a:hover{text-decoration:underline}\n.navbtns{display:flex;gap:8px;flex-wrap:wrap}\n.navbtns .btn{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:#0b57d0;text-decoration:none}\n.navbtns .btn:hover{background:#eef6ff}\n.navbtns .btn:disabled{opacity:.4;cursor:default}\nh1{color:#1a73e8;margin-bottom:4px;font-size:24px}\n.pr-tag{display:inline-block;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}\n.desc{background:#eef6ff;border:1px solid #c9e3ff;border-radius:10px;padding:12px 16px;margin:14px 0;color:#1a56a0;font-size:14px}\n.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}\n.card h2{font-size:17px;color:#333;margin-bottom:10px}\n.btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 6px 0 0;transition:all .2s}\n.btn:hover{background:#0b5bc0}\n.btn.green{background:#28a745}.btn.green:hover{background:#1e7e34}\n.btn.red{background:#dc3545}.btn.red:hover{background:#c82333}\n.btn.orange{background:#f39c12}.btn.orange:hover{background:#d68910}\n.btn.gray{background:#64748b}.btn.gray:hover{background:#475569}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select,textarea{padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;margin:4px 6px 4px 0;font-family:inherit}\ninput:focus,select:focus,textarea:focus{border-color:#1a73e8;outline:none}\nlabel{font-size:14px;color:#555}\n.out{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin:12px 0;white-space:pre-wrap;min-height:40px}\n.ok{color:#2ecc71}.err{color:#ff6b6b}.hl{color:#f1c40f}\ntable{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}\nth,td{border:1px solid #cbd5e1;padding:8px;text-align:left}\nth{background:#eef2ff}\nfooter{margin-top:24px;font-size:12px;color:#999;text-align:center}\nol{padding-left:20px}\nol li{margin:6px 0}\nol a{color:#0b57d0;text-decoration:none;font-size:15px}\nol a:hover{text-decoration:underline}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.muted{color:#777;font-size:13px}\n.chip{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;font-size:12px;color:#3730a3;margin:2px}\npre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:420px}\ndetails{margin:14px 0}\nsummary{cursor:pointer;color:#0b57d0;font-size:14px;user-select:none}\n.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;margin:12px 0}\n.preview.dark{background:#1a1a1a;color:#fff;border-color:#444}\n.preview.dark input,.preview.dark select{background:#2d2d2d;color:#fff;border-color:#555}\n.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}\n.pill.active{background:#1a73e8;color:#fff;border-color:#1a73e8}\n.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}\n.stat b{display:block;font-size:20px;color:#1a73e8}\n.stat span{font-size:12px;color:#777}\n.rbtn{padding:10px 18px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}\n.rbtn:hover{background:#0b5bc0}\n.rbtn.gray{background:#64748b}.rbtn.gray:hover{background:#475569}\n.rbtn.green{background:#28a745}.rbtn.green:hover{background:#1e7e34}\n.rbtn.red{background:#dc3545}.rbtn.red:hover{background:#c82333}\n.rbtn:disabled{opacity:.45;cursor:not-allowed}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<span class=\"pr-tag\">ПР18 • Зад.7<\/span>\n<h1>Заметки на странице<\/h1>\n<div class=\"desc\">Задание 7: заметки привязываются к URL страницы и хранятся в <code>localStorage<\/code>. При повторном открытии страницы заметки восстанавливаются.<\/div>\n\n<div class=\"card\">\n  <h2>Заметки к странице<\/h2>\n  <p class=\"muted\">📍 URL: <span id=\"current-url\" class=\"kv\"><\/span><\/p>\n  <div class=\"row\">\n    <textarea id=\"note-text\" placeholder=\"Текст заметки...\" style=\"flex:1;min-width:240px;min-height:70px\"><\/textarea>\n  <\/div>\n  <div class=\"row\">\n    <button class=\"btn green\" onclick=\"saveNote()\">💾 Сохранить заметку<\/button>\n    <button class=\"btn red\" onclick=\"clearNotes()\">Очистить все<\/button>\n  <\/div>\n  <div id=\"notes\"><\/div>\n  <div class=\"out\" id=\"out\"><\/div>\n<\/div>\n\n<details><summary>Показать код решения<\/summary><pre class=\"code\">const URL_KEY = &#x27;notes_&#x27; + location.pathname;\n$(&#x27;current-url&#x27;).textContent = location.pathname;\n\nfunction loadNotes() {\n  try {\n    return JSON.parse(localStorage.getItem(URL_KEY) || &#x27;[]&#x27;);\n  } catch (e) {\n    return [];\n  }\n}\n\nfunction renderNotes() {\n  const notes = loadNotes();\n  const box = $(&#x27;notes&#x27;);\n  if (!notes.length) {\n    box.innerHTML = &#x27;&lt;p class=&quot;muted&quot;&gt;Заметок пока нет.&lt;/p&gt;&#x27;;\n    return;\n  }\n  box.innerHTML = notes.map((note, i) =&gt; `\n    &lt;div class=&quot;item&quot;&gt;\n      &lt;div&gt;\n        &lt;div&gt;${esc(note.text)}&lt;/div&gt;\n        &lt;div class=&quot;muted&quot;&gt;${new Date(note.date).toLocaleString(&#x27;ru-RU&#x27;)}&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;button class=&quot;btn red&quot; onclick=&quot;removeNote(${i})&quot;&gt;×&lt;/button&gt;\n    &lt;/div&gt;`).join(&#x27;&#x27;);\n}\n\nfunction saveNote() {\n  const text = $(&#x27;note-text&#x27;).value.trim();\n  if (!text) { out(&#x27;&lt;span class=&quot;err&quot;&gt;Введите текст заметки&lt;/span&gt;&#x27;); return; }\n  const notes = loadNotes();\n  notes.push({ text, date: new Date().toISOString() });\n  localStorage.setItem(URL_KEY, JSON.stringify(notes));\n  $(&#x27;note-text&#x27;).value = &#x27;&#x27;;\n  renderNotes();\n  out(`&lt;span class=&quot;ok&quot;&gt;Заметка сохранена для ${esc(location.pathname)}&lt;/span&gt;`);\n}\n\nfunction removeNote(i) {\n  const notes = loadNotes();\n  notes.splice(i, 1);\n  localStorage.setItem(URL_KEY, JSON.stringify(notes));\n  renderNotes();\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;Заметка удалена&lt;/span&gt;&#x27;);\n}\n\nfunction clearNotes() {\n  localStorage.removeItem(URL_KEY);\n  renderNotes();\n  out(&#x27;&lt;span class=&quot;ok&quot;&gt;Все заметки удалены&lt;/span&gt;&#x27;);\n}\n\nrenderNotes();<\/pre><\/details>\n\n\n<\/div>\n<script>\nconst $ = (id) => document.getElementById(id);\nfunction out(html) { const el = $('out'); if (el) el.innerHTML = html; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\n\nconst URL_KEY = 'notes_' + location.pathname;\n$('current-url').textContent = location.pathname;\n\nfunction loadNotes() {\n  try {\n    return JSON.parse(localStorage.getItem(URL_KEY) || '[]');\n  } catch (e) {\n    return [];\n  }\n}\n\nfunction renderNotes() {\n  const notes = loadNotes();\n  const box = $('notes');\n  if (!notes.length) {\n    box.innerHTML = '<p class=\"muted\">Заметок пока нет.<\/p>';\n    return;\n  }\n  box.innerHTML = notes.map((note, i) => `\n    <div class=\"item\">\n      <div>\n        <div>${esc(note.text)}<\/div>\n        <div class=\"muted\">${new Date(note.date).toLocaleString('ru-RU')}<\/div>\n      <\/div>\n      <button class=\"btn red\" onclick=\"removeNote(${i})\">×<\/button>\n    <\/div>`).join('');\n}\n\nfunction saveNote() {\n  const text = $('note-text').value.trim();\n  if (!text) { out('<span class=\"err\">Введите текст заметки<\/span>'); return; }\n  const notes = loadNotes();\n  notes.push({ text, date: new Date().toISOString() });\n  localStorage.setItem(URL_KEY, JSON.stringify(notes));\n  $('note-text').value = '';\n  renderNotes();\n  out(`<span class=\"ok\">Заметка сохранена для ${esc(location.pathname)}<\/span>`);\n}\n\nfunction removeNote(i) {\n  const notes = loadNotes();\n  notes.splice(i, 1);\n  localStorage.setItem(URL_KEY, JSON.stringify(notes));\n  renderNotes();\n  out('<span class=\"ok\">Заметка удалена<\/span>');\n}\n\nfunction clearNotes() {\n  localStorage.removeItem(URL_KEY);\n  renderNotes();\n  out('<span class=\"ok\">Все заметки удалены<\/span>');\n}\n\nrenderNotes();\n\n<\/script>\n<script>\n(function () {\n  function send() {\n    parent.postMessage({ type: 'ph-height', height: document.documentElement.scrollHeight }, '*');\n  }\n  window.addEventListener('load', send);\n  if (window.ResizeObserver) new ResizeObserver(send).observe(document.documentElement);\n  setInterval(send, 1500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];
const frame = document.getElementById('frame');
const tabs = document.getElementById('tabs');
let current = -1;

TASKS.forEach(function (task, i) {
  const button = document.createElement('button');
  button.className = 'tab';
  button.textContent = (i + 1) + '. ' + task.title;
  button.addEventListener('click', function () { select(i); });
  tabs.appendChild(button);
});

function select(i) {
  current = i;
  Array.prototype.forEach.call(tabs.children, function (button, index) {
    button.classList.toggle('active', index === i);
  });
  frame.style.height = '620px';
  frame.srcdoc = TASKS[i].html;
}

window.addEventListener('message', function (event) {
  if (event.data && event.data.type === 'ph-height') {
    frame.style.height = Math.max(420, event.data.height + 6) + 'px';
  }
});

select(0);
</script>
